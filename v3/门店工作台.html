<script>
'use strict';
// 独立离线演示。无远程接口、无支付请求，业务变更仅保存至本浏览器。
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),copy=v=>JSON.parse(JSON.stringify(v)),KEY='weidong-v3-standalone-release-1',fmt=n=>Number(n||0).toFixed(2);
const paths={home:'M3 10 12 3l9 7v11h-7v-7h-4v7H3z',bars:'M3 12h4v9H3z M10 7h4v14h-4z M17 3h4v18h-4z',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',pie:'M12 3v9h9A9 9 0 1 1 12 3 M15 2v7h7a9 9 0 0 0-7-7',gem:'m3 8 4-5h10l4 5-9 13z M3 8h18 M7 3l5 18 5-18',scan:'M8 3H3v5 M16 3h5v5 M3 16v5h5 M21 16v5h-5 M7 7h10v10H7z M1 12h22',shop:'M4 10h16v11H4z M2 10l3-7h14l3 7 M8 21v-7h8v7 M2 10q2 4 5 0 2 4 5 0 2 4 5 0 3 4 5 0',money:'M7 3h10v3h3v15H4V6h3z M8 10l4 4 4-4 M12 14v5 M8 16h8',file:'M5 3h11l4 4v14H5z M15 3v5h5 M8 11h8 M8 15h8 M8 18h5',edit:'m4 16 12-12 4 4-12 12-5 1z M14 6l4 4 M4 16l4 4',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-3a8 8 0 0 1 16 0v3z',users:'M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M1 21v-3a8 8 0 0 1 16 0v3 M17 3a4 4 0 0 1 0 8 M19 14a6 6 0 0 1 4 6',hand:'m2 8 5-3 5 2 5-2 5 3-4 11-4 2-8-3z M7 9l5-2 5 5-3 3-4-3 M7 15l4 3',calendar:'M4 5h16v16H4z M8 2v6 M16 2v6 M4 10h16 M8 14h2 M14 14h2 M8 18h2',chat:'M3 4h18v13H10l-5 4v-4H3z M7 8h10 M7 12h7',phone:'M6 2h12v20H6z M10 18h4',more:'M4 12h.01 M12 12h.01 M20 12h.01',left:'m15 5-7 7 7 7',down:'m5 9 7 7 7-7',filter:'M3 4h18l-7 8v7l-4 2v-9z',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 6v7l4 2',gift:'M3 9h18v4H3z M5 13v8h14v-8 M12 9v12 M12 9C4 9 4 2 8 3c3 0 4 6 4 6s1-6 4-6c4 0 4 6-4 6',star:'m12 2 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1z',settings:'m10 2 4 0 1 3 3 1 3 0 1 4-2 2 0 3 2 2-2 4-3-1-2 2-1 2h-4l-1-3-3-1-3 0-1-4 2-2 0-3-2-2 2-4 3 1 2-2z M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',bed:'M2 7v14 M22 7v14 M2 16h20 M5 10h14v6H5z M6 4h12v6H6z',box:'M3 6l9-4 9 4v14H3z M3 6l9 5 9-5 M12 11v9',check:'m4 12 5 5 11-11',close:'m5 5 14 14 M19 5 5 19',search:'M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M15 15l6 6',image:'M3 3h18v18H3z M3 17l6-7 5 5 3-3 4 5 M15 7h.01',clipboard:'M8 4H5v17h14V4h-3 M8 2h8v5H8z M8 11h8 M8 15h8 M8 18h5'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
const avatar=()=>`<svg class="avatar-art" viewBox="0 0 60 60" aria-hidden="true" style="stroke:none"><circle cx="30" cy="30" r="30" fill="#f4b4bb"/><path d="M13 56V29c0-24 34-24 34 0v27" fill="#ffd679"/><path d="M14 57c0-17 32-17 32 0" fill="#92d5e9"/><path d="M24 40h12v9H24z" fill="#ffe5c3"/><ellipse cx="30" cy="29" rx="13" ry="16" fill="#fff0d5"/><path d="M17 24c8 0 14-6 14-12 11 1 15 8 12 15-10 1-17-4-18-9" fill="#ffd278"/><path d="m23 44 7 7 7-7v14H23z" fill="#fff"/></svg>`;
const quick=(label,ic,color,action,badge='')=>`<button class="quick" onclick="${action}"><span class="disc ${color}">${ic==='ai'?'<b>AI</b>':icon(ic)}</span><span>${esc(label)}</span>${badge?`<i class="bubble">${badge}</i>`:''}</button>`;
const empty=(text='暂无数据',ic='file')=>`<div class="empty">${icon(ic)}<span>${esc(text)}</span></div>`;
const btn=(t,a,c='')=>`<button class="btn ${c}" type="button" onclick="${a}">${esc(t)}</button>`;
const seeds={customers:[{id:'9631433',name:'空手机号03',phone:'156****9554',wechat:'demo_03',type:'新客',store:'上海徐汇店',intent:'Z10',birthday:'',balance:0,consumed:0,frozen:0,debt:0,portrait:'',note:'',tags:[],verified:false},{id:'9631434',name:'价格标准化1',phone:'153****5520',wechat:'demo_price',type:'新客',store:'上海徐汇店',intent:'S10',birthday:'',balance:0,consumed:0,frozen:0,debt:0,portrait:'',note:'',tags:[],verified:false},{id:'9631435',name:'夏秀琴',phone:'138****1020',wechat:'demo_xia',type:'新客',store:'上海徐汇店',intent:'皮肤',birthday:'',balance:0,consumed:0,frozen:0,debt:0,portrait:'',note:'',tags:[],verified:false}],orders:[{id:'2610120925594881',cid:'9631433',day:'2026-10-14',store:'上海徐汇店',status:'待服务',arrival:'2026-10-25T11:00',created:'2026-10-12 09:25',settled:'',intent:'Z10',sales:'',teacher:'',team:'',helper:'',deposit:0,paid:0,debt:0,note:'',recording:false,items:[{name:'MTS导入增强精华液(增强再生20支)',price:898,quantity:1,type:'赠送',category:'消费'},{name:'微针种植(默认)',price:8800,quantity:1,type:'赠送',category:'消费'}],total:8800,logs:[{time:'2026-10-12 09:25',action:'创建预约订单',content:'预约到店时间：2026-10-25 11:00'}],payments:[]},{id:'26102009001020',cid:'9631435',day:'2026-10-20',store:'上海徐汇店',status:'待服务',arrival:'2026-10-20T13:00',created:'2026-10-20 09:00',settled:'',intent:'皮肤',sales:'',teacher:'',team:'',helper:'',deposit:0,paid:0,debt:0,note:'',recording:false,items:[],total:0,logs:[],payments:[]},{id:'2405051536001',cid:'9631434',day:'2024-05-05',store:'上海徐汇店',status:'已流退',arrival:'2024-05-05T15:36',created:'2024-05-05 15:36',settled:'',intent:'皮肤',sales:'',teacher:'',team:'',helper:'',deposit:0,paid:0,debt:0,note:'',recording:false,items:[],total:0,logs:[],payments:[]}],visits:[],consults:[],images:[],groups:[{name:'111',note:'这是一个E级人员测试',ic:'file',color:'sky'},{name:'55',note:'',ic:'user',color:'green'},{name:'text1',note:'',ic:'gift',color:'peach'},{name:'2323',note:'',ic:'file',color:'sky'}]};
// 历史记录与当前订单关联同一份档案，便于演示资料页的订单穿透。
for(const [id,arrival,intent] of [['240505153603','2024-05-05T15:36','S10'],['240430143003','2024-04-30T14:30','皮肤'],['240428110003','2024-04-28T11:00','皮肤']])seeds.orders.push({...copy(seeds.orders[2]),id,cid:'9631433',arrival,day:arrival.slice(0,10),created:arrival.replace('T',' '),intent});
let data;try{data=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(data?.orders)||!Array.isArray(data?.customers))data=null}catch{}data=data||copy(seeds);
const ui={day:'2026-10-14',store:'上海徐汇店',status:'全部',kind:'总客数',recording:'',sales:'',orderTab:'项目信息',profileTab:'订单',memberTab:'客户分群',searchType:'姓名',query:'',searched:false,receiptQuery:'',receiptFrom:'',receiptTo:'',checkoutId:'',checkoutTab:'当日排客',checkoutKind:'新客',rating:5,group:''};
let route={page:'orders',id:''},historyDepth=0,sheet=null,returnFocus=null,toastTimer,draft=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('浏览器存储不可用，本次操作仅在当前页面保留');return false}}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2300)}
function customer(id=route.id){return data.customers.find(x=>x.id===id)||data.customers[0]}
function order(id=route.id){return data.orders.find(x=>x.id===id)||data.orders[0]}
function currentCustomer(){return route.page==='order'?customer(order().cid):customer()}
function time(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date())}
function log(o,action,content=''){o.logs.unshift({time:time(),action,content})}
function go(page,id=''){closeSheet(true);const h='#'+page+(id?'?id='+encodeURIComponent(id):'');if(location.hash===h){render();return}historyDepth++;location.hash=h}
function back(){if(sheet){closeSheet();return}if(historyDepth>0){historyDepth--;history.back()}else go(route.page==='customer'?'members':'orders')}
function readRoute(){const [p,q]=location.hash.slice(1).split('?');route={page:['orders','order','customer','workbench','members','data','ranking','receipts','checkout','add-member','edit-member','booking','billing','visit','consult','recharge','transfer','group'].includes(p)?p:'orders',id:new URLSearchParams(q||'').get('id')||''};draft=null;closeSheet(true);render();$('#screen').scrollTop=0}
function bottom(){return `<nav class="bottom" aria-label="主导航">${[['orders','门店订单','home'],['ranking','排行榜','bars'],['workbench','工作台','grid'],['data','数据','pie'],['members','会员','gem']].map(([p,t,ic])=>`<button class="${route.page===p?'active':''}" ${route.page===p?'aria-current="page"':''} onclick="go('${p}')">${icon(ic)}<span>${t}</span>${p==='workbench'?'<span class="bubble">99+</span>':''}</button>`).join('')}</nav>`}
function subnav(title){return `<header class="subnav"><button class="back" onclick="back()" aria-label="返回上一页">${icon('left')}返回</button><h1>${esc(title)}</h1><span class="local-label">本地演示</span></header>`}
function tabs(list,active,key){return `<div class="tabs ${key==='profileTab'?'profile-tabs':''}" role="tablist">${list.map(x=>`<button role="tab" aria-selected="${active===x}" class="${active===x?'active':''}" onclick="setTab('${key}','${x}')">${x}</button>`).join('')}</div>`}
function setTab(key,val){ui[key]=val;render()}
function matchedOrders(){return data.orders.filter(o=>o.day===ui.day&&o.store===ui.store&&(ui.status==='全部'||o.status===ui.status)&&(ui.kind==='总客数'||customer(o.cid).type===ui.kind)&&(!ui.recording||(ui.recording==='有录音')===o.recording)&&(!ui.sales||o.sales===ui.sales))}
function ordersPage(){const all=data.orders.filter(x=>x.day===ui.day&&x.store===ui.store),rows=matchedOrders();return `<div class="hero"><div class="store-line"><button onclick="pickStore()">焕灯　${esc(ui.store)}&gt;</button><button class="date-button">${Number(ui.day.slice(5,7))}月${Number(ui.day.slice(8))}日⌄<input type="date" aria-label="订单日期" value="${ui.day}" onchange="ui.day=this.value||'2026-10-14';render()"></button></div><div class="score-grid"><button class="score" onclick="showMetric('总业绩')"><strong>${all.reduce((s,o)=>s+o.paid,0)}</strong><small>总业绩</small>${icon('money')}</button><button class="score cyan" onclick="showMetric('新客客单')"><strong>${newCustomerAverage(all)}</strong><small>新客客单</small>${icon('users')}</button></div><div class="quick-grid">${quick('扫码收款','scan','','go(\'checkout\')')+quick('门店设置','shop','peach','go(\'workbench\')')+quick('收款明细','money','red','go(\'receipts\')')}</div></div><div class="totals">${['总客数','新客','老客','老转新','老带新'].map(x=>`<button class="total ${ui.kind===x?'active':''}" onclick="ui.kind='${x}';render()"><strong>${x==='总客数'?all.length:all.filter(o=>customer(o.cid).type===x).length}</strong><span>${x}</span></button>`).join('')}</div><div class="filterbar"><div class="status-tabs" role="tablist" aria-label="订单状态">${['全部','待服务','已到店','已完成','已超时','已流退'].map(x=>`<button role="tab" aria-selected="${ui.status===x}" class="${ui.status===x?'active':''}" onclick="ui.status='${x}';render()">${x}</button>`).join('')}</div><button class="filter-button" onclick="filterOrders()">筛选${icon('filter')}</button></div><div class="order-list">${rows.map((o,i)=>orderCard(o,i)).join('')||empty('暂无符合条件的订单')}</div>${rows.length?'<div class="end">没有更多...</div>':''}`}
function orderCard(o,i){const c=customer(o.cid);return `<button class="order-card" onclick="openOrder('${o.id}')" aria-label="查看${esc(c.name)}订单详情"><span class="seq">${i+1}</span>${avatar()}<div class="order-copy"><h3><span class="new-label">${c.type==='新客'?'新':'老'}</span>${esc(c.name)}</h3><div>意向：${esc(o.intent||'-')}</div><div>接待人：${esc(o.sales)}</div><div>预定金: <span class="money">${o.deposit}</span> 已付: <span class="money">${o.paid}</span> 欠款: <span class="money">${o.debt}</span></div></div><div class="order-end"><time>${o.arrival.slice(5).replace('T',' ')}</time><span class="badge ${o.status==='已到店'?'green':o.status==='已流退'?'blue':''}">${o.status}</span></div></button>`}
function openOrder(id){ui.orderTab='项目信息';go('order',id)}
function openCustomer(id){ui.profileTab='订单';go('customer',id)}
function orderPage(){const o=order(),c=customer(o.cid);return `<div class="detail-top"><div class="customer-strip"><div><h2>${esc(c.name)} <button class="tiny-link" onclick="openCustomer('${c.id}')">查看资料</button></h2><p>${esc(c.phone||'未添加手机号')}</p></div><div class="customer-id">客户ID<b>${c.id}</b></div></div><div class="detail-card"><div class="staff-row"><span>接待销售</span><span class="value">${esc(o.sales||'-')}</span><span class="badge green">${o.status==='待服务'?'已排客':o.status}</span></div><div class="staff-row"><span>压单老师</span><span class="value">${esc(o.teacher||'-')}</span><button class="tiny-link" onclick="chooseStaff('teacher','转交老师')">转交</button></div><div class="staff-row"><span>服务团队</span><span class="value">${esc(o.team||'-')}</span><button class="tiny-link" onclick="chooseStaff('team','修改服务团队')">修改</button></div><div class="staff-row"><span>协作人员</span><span class="value">${esc(o.helper||'-')}</span><button class="tiny-link" onclick="chooseStaff('helper','协作人员')">选择</button></div><dl class="detail-kv">${Object.entries({'预约单号':o.id,'下单门店':o.store,'下单时间':o.created,'到店时间':o.arrival.replace('T',' '),'结算时间':o.settled||'-','预约金':fmt(o.deposit),'欠款':fmt(o.debt),'备注':o.note||''}).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="quick-grid detail-actions">${quick('接待','hand','green',"chooseStaff('sales','接待')")+quick('到店','shop','purple',"arrive()")+quick('备注','edit','green',"editNote()")+quick('修改','edit','sky',"editOrder()")+quick('更多','more','purple',"orderMore()")}</div></div></div>${tabs(['项目信息','操作记录','支付记录','联系客服','订单评价'],ui.orderTab,'orderTab')}<div class="more-bottom">${orderTabContent(o)}</div><button class="ai-button" onclick="showAI()">AI智能</button>`}
function orderTabContent(o){if(ui.orderTab==='项目信息')return `<div class="content-pad"><div class="project-summary">共 ${o.items.length} 个项目(开发 <span class="money">${o.items.filter(x=>x.type==='开发').length}</span> 项；维护 <span class="money">${o.items.filter(x=>x.type==='维护').length}</span> 项；赠送 <span class="money">${o.items.filter(x=>x.type==='赠送').length}</span> 项)，金额合计： <span class="money">${fmt(o.total)}</span></div>${o.items.map((x,i)=>`<button class="project" style="width:100%;text-align:left" onclick="projectDetail(${i})"><h3><span style="color:#6e8aff">▣</span> <span class="mini-tag">${x.category}</span>${esc(x.name)}</h3><div><span class="symbol">▤</span>开单: ${esc(x.staff||'')}</div><div><span class="symbol">♙</span>原价：<span class="money">${fmt(x.price)}</span>　售价：<span class="money">${fmt(x.price)}</span>　金额：<span class="money">${fmt(x.price*x.quantity)}</span></div></button>`).join('')}</div>`;if(ui.orderTab==='操作记录')return o.logs.map(x=>`<article class="record"><div class="top"><strong>${esc(x.action)}</strong><small class="muted">${x.time}</small></div><p>${esc(x.content)}</p><small class="muted">本地演示</small></article>`).join('')||empty('暂无操作记录');if(ui.orderTab==='支付记录')return paymentRows(o.payments);if(ui.orderTab==='联系客服')return `<div class="empty">${icon('chat')}<span>订单客服</span><p class="hint">本地演示不连接客服服务</p>${btn('查看订单咨询记录',"showConsultRecords()")}</div>`;return `<div class="content-pad">${o.review?`<div class="record"><div class="top"><strong>订单评价</strong><span style="color:#ffb54f">${'★'.repeat(o.review.stars)}</span></div><p>${esc(o.review.text)}</p><small>${o.review.time}</small></div>`:`<div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${n}星" class="${ui.rating>=n?'on':''}" onclick="ui.rating=${n};render()">★</button>`).join('')}</div><textarea id="reviewText" aria-label="订单评价内容" placeholder="请输入评价内容" style="width:100%"></textarea><div style="text-align:center;margin-top:12px">${btn('提交评价','saveReview()','primary')}</div>`}</div>`}
function paymentRows(rows){return rows.length?rows.map(x=>`<article class="record"><div class="top"><strong>${esc(x.method)}</strong><b class="money">${fmt(x.amount)}</b></div><p>${esc(x.customer||'')}</p><small class="muted">${x.time} · 本地演示记录</small></article>`).join(''):empty('暂无支付记录')}
function profilePage(){const c=customer();return `<div class="profile-hero"><div class="profile-summary">${avatar()}<div><h2>${esc(c.name)}<span class="label-dark">${c.type}</span><button class="label-peach" onclick="verifyCustomer()">${c.verified?'已验证':'去验证'}</button></h2><p>${esc(c.phone||'未添加手机号')}<button class="fill-link" onclick="toast('演示档案仅展示脱敏手机号')">获取</button><button class="fill-link" onclick="addPhone()">添加手机号</button></p><p>${esc(c.store)}</p></div><button class="plus-tag" aria-label="更多客户操作" onclick="customerMore()">+</button></div><div class="balances">${[['余额','balance'],['消费','consumed'],['冻结','frozen'],['欠款','debt']].map(([t,k])=>`<button onclick="balanceDetail('${k}','${t}')"><strong>${c[k]}</strong>${t}</button>`).join('')}</div><div class="quick-grid profile-actions">${quick('开单','edit','red',`go('billing','${c.id}')`)+quick('预约','calendar','',`go('booking','${c.id}')`)+quick('回访','chat','green',`go('visit','${c.id}')`)+quick('充值','phone','peach',`go('recharge','${c.id}')`)+quick('编辑','edit','sky',`go('edit-member','${c.id}')`)+quick('余额转交','money','peach',`go('transfer','${c.id}')`)+quick('问诊','users','green',`go('consult','${c.id}')`)+quick('分配','file','sky',"assignCustomer()")}</div></div><section class="portrait"><h3>客户画像</h3>${c.portrait?`<p style="margin:20px 0;line-height:24px;color:#6d7d95">${esc(c.portrait)}</p><button class="text-link" onclick="editPortrait()">编辑画像 ›</button>`:`<div class="empty">${icon('clipboard')}<span>暂无客户画像, <button class="text-link" onclick="editPortrait()">请完善 &gt;</button></span></div>`}</section>${tabs(['订单','项目','支付','影像','回访','详情','问诊'],ui.profileTab,'profileTab')}${profileContent(c)}`}
function profileContent(c){const orders=data.orders.filter(x=>x.cid===c.id);if(ui.profileTab==='订单')return orders.map(o=>`<button class="profile-order" onclick="openOrder('${o.id}')"><span class="status ${o.status==='已流退'?'blue':''}">${o.status==='待服务'?'待接客':o.status}</span><div class="item-line">${icon('user')}意向：${esc(o.intent)}</div><div class="item-line">${icon('clock')}${o.arrival.replace('T',' ')}</div><div class="item-line">${icon('shop')}${esc(o.store)}</div><div class="item-line">${icon('users')}接待销售：${esc(o.sales||'-')}　服务团队：${esc(o.team||'-')}</div><div class="profile-money"><span>预定金: <strong>${fmt(o.deposit)}</strong></span><span>已付: <strong>${fmt(o.paid)}</strong></span><span>欠款: <strong>${fmt(o.debt)}</strong></span></div></button>`).join('')||empty('暂无订单');if(ui.profileTab==='项目')return `<div class="content-pad">${orders.flatMap(o=>o.items.map(x=>`<article class="project"><h3><span class="mini-tag">${x.category}</span>${esc(x.name)}</h3><div>数量：${x.quantity}　金额：<span class="money">${fmt(x.price*x.quantity)}</span></div></article>`)).join('')||empty('暂无项目')}</div>`;if(ui.profileTab==='支付')return paymentRows(orders.flatMap(o=>o.payments).concat((data.recharges||[]).filter(x=>x.cid===c.id)));if(ui.profileTab==='详情')return `<div class="details-list">${Object.entries({'客户ID':c.id,'姓名':c.name,'手机号':c.phone||'-','微信':c.wechat||'-','会员类型':c.type,'所属门店':c.store,'初始意向':c.intent,'生日':c.birthday||'-','客户标签':c.tags.join('、')||'-','分配人员':c.owner||'-','备注':c.note||'-'}).map(([k,v])=>`<div class="form-row"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}</div>`;if(ui.profileTab==='影像')return `<div class="content-pad"><label class="attach" style="display:block;cursor:pointer">${icon('image')} 添加客户影像<input type="file" accept="image/*" multiple hidden onchange="addImages(this)"></label><div class="file-images">${data.images.filter(x=>x.cid===c.id).map(x=>`<button onclick="viewImage('${x.id}')"><img src="${x.src}" alt="${esc(x.name)}"></button>`).join('')}</div>${data.images.some(x=>x.cid===c.id)?'':empty('暂无客户影像')}</div>`;const list=(ui.profileTab==='回访'?data.visits:data.consults).filter(x=>x.cid===c.id);return `<div class="content-pad">${btn(ui.profileTab==='回访'?'新增回访':'新增问诊',`go('${ui.profileTab==='回访'?'visit':'consult'}','${c.id}')`,'primary')}</div>${list.map(x=>`<article class="record"><div class="top"><strong>${esc(x.type)}</strong><small>${x.time}</small></div><p>${esc(x.content)}</p></article>`).join('')||empty('暂无'+ui.profileTab+'记录')}`}

function memberCard(c){return `<button class="member-card" onclick="openCustomer('${c.id}')">${avatar()}<div><h3>${esc(c.name)} <span class="badge green">${c.type}</span></h3><p>${esc(c.phone||'未添加手机号')}　${esc(c.store)}</p><p>客户ID：${c.id}</p></div><span>›</span></button>`}
function groupPage(){const g=data.groups[Number(route.id)]||data.groups[0],rows=data.customers.filter(c=>c.group===g.name);return `<div class="group-heading">${esc(g.name)} · ${esc(g.note)}<div style="margin-top:12px">${btn('添加客户',`groupMembers('${esc(g.name)}')`)}</div></div>${rows.map(memberCard).join('')||empty('暂无客户')}`}
function receiptsPage(){let rows=data.orders.flatMap(o=>o.payments.map(p=>({...p,customer:customer(o.cid).name}))).concat((data.recharges||[]).map(p=>({...p,customer:customer(p.cid).name}))).filter(x=>(!ui.receiptQuery||x.customer.includes(ui.receiptQuery))&&(!ui.receiptFrom||x.time.slice(0,10)>=ui.receiptFrom)&&(!ui.receiptTo||x.time.slice(0,10)<=ui.receiptTo));return `<form class="records-toolbar" onsubmit="event.preventDefault();searchReceipts()"><input id="receiptQuery" aria-label="收款客户姓名" value="${esc(ui.receiptQuery)}" placeholder="客户姓名"><input id="receiptFrom" aria-label="收款开始日期" type="date" value="${ui.receiptFrom}"><input id="receiptTo" aria-label="收款结束日期" type="date" value="${ui.receiptTo}"><button class="btn">搜索</button>${btn('重置',"ui.receiptQuery='';ui.receiptFrom='';ui.receiptTo='';render()")}</form><div class="receipt-total">收款合计<b>¥ ${fmt(rows.reduce((s,x)=>s+x.amount,0))}</b>共 ${rows.length} 笔</div>${paymentRows(rows)}`}
function searchReceipts(){ui.receiptQuery=$('#receiptQuery').value.trim();ui.receiptFrom=$('#receiptFrom').value;ui.receiptTo=$('#receiptTo').value;render()}
function checkoutPage(){let rows=data.customers.filter(c=>c.type===ui.checkoutKind&&(ui.checkoutTab==='全部客户'||data.orders.some(o=>o.cid===c.id&&o.day===ui.day)));return tabs(['当日排客','全部客户'],ui.checkoutTab,'checkoutTab')+`<div class="content-pad"><div class="stack">客户类型：${['新客','老客'].map(t=>`<button class="choice ${ui.checkoutKind===t?'active':''}" onclick="ui.checkoutKind='${t}';render()">${t}</button>`).join('')}</div>${rows.map(c=>`<label class="pick-row">${avatar()}<div><strong>${esc(c.name)}</strong><p class="muted">${esc(c.phone)}</p></div><input class="right" type="radio" name="checkout" aria-label="选择${esc(c.name)}" ${ui.checkoutId===c.id?'checked':''} onchange="ui.checkoutId='${c.id}'"></label>`).join('')||empty('没有查询到数据...')}</div><div class="form-footer">${btn('下一步','checkoutNext()','primary')}</div>`}
function inputRow(label,name,value='',type='text',required=false){return `<div class="form-row"><label for="f-${name}">${required?'<span class="required">*</span>':''}${label}</label><input id="f-${name}" name="${name}" aria-label="${label}" type="${type}" value="${esc(value)}" ${required?'required':''} ${name==='customer'?'readonly':''} ${type==='number'?'min="0" step="0.01"':''} placeholder="请输入"></div>`}
function selectRow(label,name,options,value=''){return `<div class="form-row"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" aria-label="${label}">${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function textRow(label,name,value=''){return `<div class="form-row textarea"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" aria-label="${label}" placeholder="请输入">${esc(value)}</textarea></div>`}

function render(){const root=['orders','workbench','members','data','ranking'].includes(route.page),titles={orders:'门店订单',order:'订单详情',customer:'客户资料',workbench:'工作台',members:'会员',data:'数据',ranking:'排行榜',receipts:'收款明细',checkout:'选择收款客户','add-member':'新增会员','edit-member':'编辑会员',booking:'预约',billing:'开单',visit:'新增回访',consult:'问诊',recharge:'充值',transfer:'余额转交',group:'客户分群'},renderers={orders:ordersPage,order:orderPage,customer:profilePage,workbench:workbenchPage,members:membersPage,receipts:receiptsPage,checkout:checkoutPage,group:groupPage,data:()=>'',ranking:()=>''};document.title=titles[route.page]+' · 微动 V3';$('#app').innerHTML=(root?'':subnav(titles[route.page]))+`<main class="screen ${['order','customer','members','group'].includes(route.page)?'white':''} ${['data','ranking'].includes(route.page)?'is-blank':''}" id="screen" aria-label="${titles[route.page]}">${(renderers[route.page]||formPage)()}</main>`+(root?bottom():'')+(!['data','ranking'].includes(route.page)?'<div class="watermark" aria-hidden="true"></div>':'');}
function openSheet(title,html,footer=''){if(!sheet)returnFocus=document.activeElement;sheet={title};$('#app').inert=true;$('#layers').innerHTML=`<div class="sheet-layer" id="sheetLayer"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="sheet-head"><h2>${esc(title)}</h2><button aria-label="关闭" onclick="closeSheet()">×</button></header><div class="sheet-body">${html}<p class="form-error" id="sheetError" role="alert"></p></div><footer class="sheet-foot">${footer||btn('关闭','closeSheet()')}</footer></section></div>`;$('#sheetLayer').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet()});$('#layers button')?.focus()}
function closeSheet(immediate=false){if(!sheet&&!$('#layers').children.length)return;sheet=null;const el=$('#sheetLayer');if(immediate){$('#layers').innerHTML='';$('#app').inert=false;return}if(!el||el.classList.contains('closing'))return;el.classList.add('closing');setTimeout(()=>{el.remove();if(!$('#layers').children.length){$('#app').inert=false;if(returnFocus?.isConnected)returnFocus.focus()}},matchMedia('(prefers-reduced-motion:reduce)').matches?0:210)}
function sheetValues(){return Object.fromEntries([...$('#layers').querySelectorAll('[name]')].map(x=>[x.name,x.type==='checkbox'?x.checked:x.value]))}
function mainValues(){return Object.fromEntries(new FormData($('#mainForm')))}
function error(text,inSheet=false){$(inSheet?'#sheetError':'#formError').textContent=text;return false}
function pickStore(){openSheet('选择门店',`<div class="search-row"><input id="storeQuery" aria-label="搜索门店" placeholder="门店名称">${btn('搜索','searchStores()')}${btn('重置',"$('#storeQuery').value='';searchStores()")}</div><div id="storeOptions">${storeOptions('')}</div>`)}
function storeOptions(q){return ['上海徐汇店','上海静安店','上海浦东店'].filter(x=>x.includes(q)).map(x=>`<button class="pick-row" onclick="ui.store='${x}';closeSheet(true);render()">${icon('shop')}${x}<span class="right">${ui.store===x?'✓':'›'}</span></button>`).join('')||empty('暂无符合条件的门店')}
function searchStores(){$('#storeOptions').innerHTML=storeOptions($('#storeQuery').value.trim())}
function newCustomerAverage(rows){let list=rows.filter(o=>customer(o.cid).type==='新客');return list.length?Math.round(list.reduce((n,o)=>n+o.paid,0)/list.length*100)/100:0}
function showMetric(title){let rows=data.orders.filter(o=>o.day===ui.day&&o.store===ui.store);openSheet(title,`<div class="receipt-total">${title}<b>${title==='总业绩'?fmt(rows.reduce((s,o)=>s+o.paid,0)):fmt(newCustomerAverage(rows))}</b></div><p class="hint">${esc(ui.store)} · ${ui.day}</p>${rows.map(o=>`<div class="statline"><span>${esc(customer(o.cid).name)}</span><b class="money">${fmt(o.paid)}</b></div>`).join('')||empty('暂无业绩记录')}`)}
function filterOrders(){draft={recording:ui.recording,sales:ui.sales};openSheet('筛选订单',`<h3 style="margin-bottom:12px">接待人</h3>${selectRow('接待人','sales',['全部','梁淑芬','林悦','黄伟健'],ui.sales||'全部')}<h3 style="margin:20px 0 12px">录音</h3><div class="choices">${['全部','有录音','无录音'].map(x=>`<button class="choice ${(ui.recording||'全部')===x?'active':''}" data-recording="${x}" onclick="draft.recording='${x==='全部'?'':x}';document.querySelectorAll('[data-recording]').forEach(b=>b.classList.toggle('active',b.dataset.recording==='${x}'))">${x}</button>`).join('')}</div>`,btn('取消','closeSheet()')+btn('重置',"draft.recording='';ui.recording='';ui.sales='';closeSheet(true);render()")+btn('搜索',"ui.recording=draft.recording;ui.sales=sheetValues().sales==='全部'?'':sheetValues().sales;closeSheet(true);render()"));}
function chooseStaff(key,title){let o=order();openSheet(title,`<div class="search-row"><input id="staffQuery" aria-label="搜索员工" placeholder="姓名">${btn('搜索','searchStaff()')}${btn('重置',"$('#staffQuery').value='';searchStaff()")}</div><div id="staffOptions">${['未分配','梁淑芬','林悦','黄伟健','陈敏'].map(x=>`<label class="pick-row" data-staff="${x}"><input type="radio" name="staff" value="${x}" ${(o[key]||'未分配')===x?'checked':''}>${icon('user')}${x}</label>`).join('')}</div>`,btn('取消','closeSheet()')+btn('保存',`saveStaff('${key}','${title}')`,'primary'))}
function searchStaff(){const q=$('#staffQuery').value.trim();document.querySelectorAll('[data-staff]').forEach(x=>x.hidden=!x.dataset.staff.includes(q))}
function saveStaff(key,title){const el=$('#layers input[name=staff]:checked');if(!el)return error('请选择人员',true);let o=order();o[key]=el.value==='未分配'?'':el.value;log(o,title,o[key]||'未分配');save();closeSheet(true);render();toast(title+'已保存')}
function arrive(){let o=order();if(o.status==='已到店'){toast('该订单已到店');return}if(['已完成','已流退'].includes(o.status)){toast('当前订单已结束');return}openSheet('到店确认',`<p class="dialog-note">确认 ${esc(customer(o.cid).name)} 已到店？</p><p class="hint">到店状态将更新至订单列表。</p>`,btn('取消','closeSheet()')+btn('确认到店',"setOrderStatus('已到店')",'primary'))}
function setOrderStatus(status){let o=order();o.status=status;log(o,status);save();closeSheet(true);render();toast('订单已更新为'+status)}
function editNote(){openSheet('订单备注',textRow('备注','note',order().note),btn('取消','closeSheet()')+btn('保存',"saveOrderNote()",'primary'))}
function saveOrderNote(){let o=order();o.note=sheetValues().note;log(o,'修改备注',o.note);save();closeSheet(true);render();toast('备注已保存')}
function editOrder(){let o=order();openSheet('修改订单',inputRow('到店时间','arrival',o.arrival,'datetime-local')+selectRow('下单门店','store',['上海徐汇店','上海静安店','上海浦东店'],o.store)+selectRow('意向','intent',['Z10','S10','皮肤','纹绣','美牙'],o.intent)+textRow('备注','note',o.note),btn('取消','closeSheet()')+btn('保存','saveOrderEdit()','primary'))}
function saveOrderEdit(){let v=sheetValues();if(!v.arrival)return error('请选择到店时间',true);Object.assign(order(),v);log(order(),'修改订单',v.arrival.replace('T',' '));save();closeSheet(true);render();toast('订单修改已保存')}
function orderMore(){openSheet('更多操作',`<div class="action-list">${[['查看资料',`openCustomer('${order().cid}')`],['见客','seeCustomer()'],['申请售后','afterSales()'],['取消订单','cancelOrder()'],['订单结算','settleOrder()']].map(([t,a])=>`<button onclick="${a}">${t}<span>›</span></button>`).join('')}</div>`)}
function seeCustomer(){openSheet('见客',selectRow('见客结果','result',['已见客','未见客'])+textRow('备注','note'),btn('取消','closeSheet()')+btn('保存',"saveSeen()",'primary'))}
function saveSeen(){const v=sheetValues();log(order(),'见客',v.result+' '+v.note);save();closeSheet(true);ui.orderTab='操作记录';render();toast('见客记录已保存')}
function afterSales(){openSheet('申请售后',selectRow('售后类型','type',['项目跟进','退款申请','其他'])+textRow('申请原因','reason'),btn('取消','closeSheet()')+btn('保存申请',"saveAfterSales()",'primary'))}
function saveAfterSales(){const v=sheetValues();if(!v.reason.trim())return error('请填写申请原因',true);log(order(),'申请售后',v.type+'：'+v.reason);save();closeSheet(true);ui.orderTab='操作记录';render();toast('本地售后申请已保存')}
function cancelOrder(){openSheet('取消订单',textRow('取消原因','reason'),btn('返回','closeSheet()')+btn('确认取消','confirmCancelOrder()','danger'))}
function confirmCancelOrder(){let v=sheetValues();if(!v.reason.trim())return error('请填写取消原因',true);order().status='已流退';log(order(),'取消订单',v.reason);save();closeSheet(true);render();toast('订单已流退')}
function settleOrder(){openSheet('订单结算',`<p class="dialog-note">应结算金额：<b class="money">${fmt(Math.max(0,order().total-order().paid))}</b></p>${inputRow('本次收款（元）','amount',Math.max(0,order().total-order().paid),'number')}${selectRow('支付方式','method',['微信','支付宝','现金','银行卡','会员余额'])}<p class="notice-small">本地演示，不发起真实支付。</p>`,btn('取消','closeSheet()')+btn('确认结算',"savePayment(true)",'primary'))}
function projectDetail(i){let x=order().items[i];openSheet('项目信息',`<h3>${esc(x.name)}</h3><div class="details-list">${Object.entries({'项目类别':x.category,'项目类型':x.type,'数量':x.quantity,'原价':fmt(x.price),'售价':fmt(x.price),'金额':fmt(x.price*x.quantity),'开单人员':x.staff||'-'}).map(([k,v])=>`<div class="form-row"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}</div>`)}
function saveReview(){let text=$('#reviewText').value.trim();if(!text){toast('请输入评价内容');return}order().review={stars:ui.rating,text,time:time()};log(order(),'提交订单评价',text);save();render();toast('评价已保存')}
function showConsultRecords(){openSheet('订单咨询记录',empty('暂无订单咨询记录'))}
function showAI(){let o=order();openSheet('AI智能',`<div class="ai-content"><span class="disc purple"><b>AI</b></span><h3>订单信息摘要</h3><p>客户：${esc(customer(o.cid).name)}<br>订单状态：${o.status}<br>预约时间：${o.arrival.replace('T',' ')}<br>项目数量：${o.items.length}<br>接待销售：${esc(o.sales||'未分配')}</p><p class="hint">根据当前示例订单整理；未连接 AI 服务。</p></div>`)}
function verifyCustomer(){let c=customer();openSheet('客户验证',`<p class="dialog-note">${esc(c.name)} · ${esc(c.phone||'未填写手机号')}</p><p class="hint">此页面演示验证状态，不发送短信。</p>`,btn('取消','closeSheet()')+btn('标记已核实',"customer().verified=true;save();closeSheet(true);render();toast('本地验证状态已更新')",'primary'))}
function addPhone(){openSheet('添加手机号',inputRow('手机号','phone','','tel'),btn('取消','closeSheet()')+btn('保存','savePhone()','primary'))}
function savePhone(){let p=sheetValues().phone.trim();if(!/^1\d{10}$/.test(p))return error('请输入11位手机号',true);customer().phone=p;save();closeSheet(true);render();toast('手机号已保存')}
function customerMore(){openSheet('客户操作',`<div class="action-list">${[['添加标签','editTags()'],['客户分群','changeCustomerGroup()'],['添加手机号','addPhone()'],['编辑资料',`go('edit-member','${customer().id}')`]].map(([t,a])=>`<button onclick="${a}">${t}<span>›</span></button>`).join('')}</div>`)}
function editTags(){openSheet('客户标签',inputRow('标签','tags',customer().tags.join('、')),btn('取消','closeSheet()')+btn('保存',"customer().tags=sheetValues().tags.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);save();closeSheet(true);render();toast('标签已保存')",'primary'))}
function changeCustomerGroup(){openSheet('客户分群',selectRow('分群','group',['未分群',...data.groups.map(g=>g.name)],customer().group||'未分群'),btn('取消','closeSheet()')+btn('保存',"customer().group=sheetValues().group==='未分群'?'':sheetValues().group;save();closeSheet(true);render();toast('分群已保存')",'primary'))}
function editPortrait(){openSheet('客户画像',textRow('客户画像','portrait',customer().portrait),btn('取消','closeSheet()')+btn('保存',"customer().portrait=sheetValues().portrait;save();closeSheet(true);render();toast('客户画像已保存')",'primary'))}
function balanceDetail(key,title){const c=customer();openSheet(title+'明细',`<div class="receipt-total">${title}<b>${fmt(c[key])}</b></div>${key==='balance'?paymentRows((data.recharges||[]).filter(x=>x.cid===c.id)):empty('暂无'+title+'明细')}`)}
function assignCustomer(){openSheet('分配客户',selectRow('分配人员','owner',['未分配','梁淑芬','林悦','黄伟健','陈敏'],customer().owner||'未分配'),btn('取消','closeSheet()')+btn('保存',"customer().owner=sheetValues().owner;save();closeSheet(true);render();toast('客户分配已保存')",'primary'))}
function groupMembers(name){openSheet('添加分群客户',data.customers.map(c=>`<label class="pick-row"><input type="checkbox" value="${c.id}" ${c.group===name?'checked':''}>${esc(c.name)}<span class="right muted">${esc(c.phone)}</span></label>`).join(''),btn('取消','closeSheet()')+btn('保存',`saveGroupMembers('${name}')`,'primary'))}
function saveGroupMembers(name){let ids=[...$('#layers').querySelectorAll('input:checked')].map(x=>x.value);data.customers.forEach(c=>{if(ids.includes(c.id))c.group=name;else if(c.group===name)c.group=''});save();closeSheet(true);render();toast('客户分群已保存')}
function saveMember(){const v=mainValues();if(!v.wechat.trim()||!v.name.trim())return error('请填写客户微信和姓名');if(v.phone&&!/^1\d{10}$/.test(v.phone)&&!/^1\d{2}\*{4}\d{4}$/.test(v.phone))return error('请输入正确的手机号');let c;if(route.page==='edit-member'){c=customer();Object.assign(c,v)}else{c={...copy(seeds.customers[0]),...v,id:String(Date.now()),balance:0,consumed:0,debt:0,frozen:0,verified:false,portrait:'',tags:[]};data.customers.unshift(c)}save();openCustomer(c.id);toast('会员资料已保存')}
function saveBooking(){const v=mainValues();if(!v.arrival)return error('请选择预约时间');let o={...copy(seeds.orders[0]),id:'YY'+Date.now(),cid:customer().id,day:v.arrival.slice(0,10),arrival:v.arrival,store:v.store,intent:v.intent,sales:v.sales==='未分配'?'':v.sales,teacher:'',team:'',helper:'',created:time(),status:'待服务',note:v.note,items:[],total:0,logs:[],payments:[]};log(o,'创建预约订单',v.arrival);data.orders.unshift(o);save();openOrder(o.id);toast('预约已保存')}
function saveBilling(){const v=mainValues(),quantity=Number(v.quantity),price=Number(v.price);if(!Number.isInteger(quantity)||quantity<1||!Number.isFinite(price)||price<0)return error('请填写有效的数量和售价');let o={...copy(seeds.orders[0]),id:'KD'+Date.now(),cid:customer().id,day:ui.day,arrival:ui.day+'T11:00',created:time(),status:'待服务',store:v.store,note:v.note,items:[{name:v.item,price,quantity,type:v.type,category:'消费'}],total:price*quantity,logs:[],payments:[],sales:'',teacher:'',team:'',helper:''};log(o,'开单',v.item);data.orders.unshift(o);save();openOrder(o.id);toast('订单已保存')}
function saveVisit(type){let v=mainValues();if(!v.content.trim())return error(type==='visit'?'请填写回访内容':'请填写主要诉求');(type==='visit'?data.visits:data.consults).unshift({...v,cid:customer().id,time:time(),content:v.content+(v.history?'\n既往情况：'+v.history:'')+(v.advice?'\n沟通记录：'+v.advice:'')});save();ui.profileTab=type==='visit'?'回访':'问诊';go('customer',customer().id);toast('记录已保存')}
function saveRecharge(){const v=mainValues(),amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0)return error('充值金额需大于0');let c=customer();c.balance=Math.round((c.balance+amount)*100)/100;(data.recharges??=[]).unshift({cid:c.id,amount,method:v.method+'充值',time:time(),note:v.note});save();go('customer',c.id);toast('本地充值记录已保存')}
function saveTransfer(){const v=mainValues(),amount=Number(v.amount),c=customer(),target=data.customers.find(x=>x.name===v.target&&x.id!==c.id);if(!target)return error('请选择接收会员');if(!Number.isFinite(amount)||amount<=0||amount>c.balance)return error('转交金额需大于0且不超过余额');c.balance=Math.round((c.balance-amount)*100)/100;target.balance=Math.round((target.balance+amount)*100)/100;(data.recharges??=[]).unshift({cid:c.id,amount:-amount,method:'余额转出 → '+target.name,time:time()},{cid:target.id,amount,method:'余额转入 ← '+c.name,time:time()});save();go('customer',c.id);toast('余额已转交')}
function checkoutNext(){if(!ui.checkoutId)return toast('请选择收款客户');const c=customer(ui.checkoutId),o=data.orders.find(x=>x.cid===c.id&&!['已完成','已流退'].includes(x.status));if(!o)return toast('该客户暂无可收款订单');draft={orderId:o.id};openSheet('扫码收款',`<h3>${esc(c.name)}</h3><p class="hint">${o.id}</p>${inputRow('收款金额（元）','amount','','number')}${selectRow('收款方式','method',['微信','支付宝','现金','银行卡','会员余额'])}<div class="mockqr">本地演示<br>不生成真实收款码</div>`,btn('取消','closeSheet()')+btn('记录收款',"savePayment(false)",'primary'))}
function savePayment(settle){let o=settle?order():order(draft.orderId),v=sheetValues(),amount=Number(v.amount),c=customer(o.cid),due=Math.max(0,o.total-o.paid);if(!Number.isFinite(amount)||amount<0||(!settle&&amount===0))return error('请填写有效收款金额',true);if(amount>due&&o.total>0)return error('收款金额不能超过应收金额 '+fmt(due),true);if(settle&&amount<due)return error('结算金额不足，请先完成收款',true);if(v.method==='会员余额'&&amount>c.balance)return error('会员余额不足',true);if(v.method==='会员余额')c.balance=Math.round((c.balance-amount)*100)/100;o.paid=Math.round((o.paid+amount)*100)/100;o.debt=Math.max(0,o.total-o.paid);c.debt=data.orders.filter(x=>x.cid===c.id).reduce((n,x)=>n+x.debt,0);c.consumed=Math.round((c.consumed+amount)*100)/100;if(amount>0)o.payments.unshift({time:time(),amount,method:v.method});if(settle){o.status='已完成';o.settled=time()}log(o,settle?'订单结算':'收款',v.method+' '+fmt(amount));save();closeSheet(true);if(settle){ui.orderTab='支付记录';render()}else go('receipts');toast('本地收款记录已保存')}
async function addImages(input){const files=[...input.files];if(files.some(f=>f.size>2*1024*1024)){toast('请选择2MB以内的图片');return}const cid=customer().id;for(const f of files){if(!f.type.startsWith('image/'))continue;const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)}).catch(()=>null);if(src)data.images.push({id:'IMG'+Date.now()+Math.random().toString(36).slice(2),cid,name:f.name,src})}save();render();toast('客户影像已添加')}
function viewImage(id){const x=data.images.find(x=>x.id===id);openSheet('客户影像',`<img src="${x.src}" alt="${esc(x.name)}" style="width:100%;height:auto"><p class="hint">${esc(x.name)}</p>`)}
document.addEventListener('keydown',e=>{if(sheet){if(e.key==='Escape'){e.preventDefault();closeSheet()}if(e.key==='Tab'){const els=[...$('#layers').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled&&!x.hidden&&x.getClientRects().length),a=els[0],b=els.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();b?.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a?.focus()}}}const tab=e.target.closest?.('[role=tab]');if(tab&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const list=[...tab.parentElement.querySelectorAll('[role=tab]')],i=(list.indexOf(tab)+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;const name=list[i].textContent;list[i].click();[...document.querySelectorAll('[role=tab]')].find(x=>x.textContent===name)?.focus()}});
window.addEventListener('hashchange',readRoute);readRoute();
</script>
</body>
</html>
