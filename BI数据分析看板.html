<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI销售全链路BI决策看板</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #f9fbfc;
      --line: #dfe5eb;
      --line-strong: #c9d3dc;
      --text: #17202a;
      --muted: #687482;
      --soft: #8a96a3;
      --teal: #0f8f85;
      --teal-soft: #e8f6f4;
      --blue: #326fd1;
      --blue-soft: #eaf1fd;
      --green: #13a06f;
      --green-soft: #e6f6ef;
      --red: #d44848;
      --red-soft: #fdecec;
      --amber: #b97813;
      --amber-soft: #fff3dc;
      --violet: #6957b8;
      --violet-soft: #f0edfb;
      --shadow: 0 12px 30px rgba(23, 32, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 64px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 22px;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 240px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(15, 143, 133, 0.94), rgba(50, 111, 209, 0.92)),
        linear-gradient(45deg, transparent 42%, rgba(255, 255, 255, 0.45) 43%, rgba(255, 255, 255, 0.45) 56%, transparent 57%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.48);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 760;
      white-space: nowrap;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .global-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .data-freshness {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    .more-filters {
      position: relative;
    }

    .more-filters summary {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      list-style: none;
      white-space: nowrap;
    }

    .more-filters summary::-webkit-details-marker {
      display: none;
    }

    .more-filters summary::after {
      content: "+";
      color: var(--muted);
      margin-left: 8px;
      font-size: 16px;
    }

    .more-filters[open] summary::after {
      content: "−";
    }

    .filter-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 50;
      width: 520px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .filter-field {
      display: grid;
      gap: 5px;
    }

    .filter-field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      gap: 2px;
    }

    .segmented button {
      min-height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
      padding: 0 10px;
      white-space: nowrap;
    }

    .segmented button.active {
      background: var(--surface);
      color: var(--teal);
      box-shadow: 0 1px 3px rgba(23, 32, 42, 0.08);
    }

    .control,
    .text-btn,
    .primary-btn {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      padding: 0 12px;
    }

    .text-btn:hover,
    .control:hover {
      border-color: var(--line-strong);
      background: #fbfcfd;
    }

    .primary-btn {
      border-color: var(--teal);
      background: var(--teal);
      color: #ffffff;
    }

    .layout {
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr);
      gap: 18px;
      padding: 18px 20px 28px;
      max-width: 1680px;
      width: 100%;
      margin: 0 auto;
    }

    .side {
      align-self: start;
      position: sticky;
      top: 82px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .side-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      padding: 0 4px 3px;
    }

    .module-btn {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      padding: 12px 12px;
      color: var(--text);
      text-align: left;
      display: grid;
      gap: 8px;
    }

    .module-btn:hover {
      background: rgba(255, 255, 255, 0.62);
      border-color: var(--line);
    }

    .module-btn.active {
      background: var(--surface);
      border-color: var(--line);
      box-shadow: var(--shadow);
    }

    .module-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .module-name {
      font-size: 14px;
      font-weight: 760;
      min-width: 0;
    }

    .module-badge {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 2px 7px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .module-btn.active .module-badge {
      color: var(--teal);
      background: var(--teal-soft);
    }

    .module-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .content {
      min-width: 0;
      display: grid;
      gap: 14px;
    }

    .insight-title,
    .insight-text,
    .panel-header h2,
    .panel-header h3,
    .panel-header p,
    .module-name,
    .module-meta,
    .kpi-card,
    .action-item,
    td {
      overflow-wrap: anywhere;
    }

    .insight-band {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 18px;
    }

    .insight-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 780;
      margin-bottom: 8px;
    }

    .insight-label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px var(--teal-soft);
    }

    .insight-title {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 28px);
      line-height: 1.22;
      letter-spacing: 0;
    }

    .insight-text {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      max-width: 880px;
    }

    .benchmark-tile {
      min-width: 220px;
      align-self: stretch;
      border-left: 1px solid var(--line);
      padding-left: 18px;
      display: grid;
      align-content: center;
      gap: 4px;
    }

    .benchmark-tile span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .benchmark-tile strong {
      font-size: 32px;
      line-height: 1;
    }

    .benchmark-tile small {
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .analysis-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 8px 20px rgba(23, 32, 42, 0.04);
    }

    .analysis-tabs[hidden] {
      display: none;
    }

    .analysis-tab {
      flex: 1 0 132px;
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 720;
      white-space: nowrap;
    }

    .analysis-tab:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .analysis-tab.active {
      background: var(--teal-soft);
      color: var(--teal);
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      min-height: 118px;
      display: grid;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(23, 32, 42, 0.04);
    }

    .kpi-card .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .kpi-card .value {
      font-size: 28px;
      font-weight: 780;
      line-height: 1.05;
    }

    .kpi-card .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .delta {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 740;
      line-height: 1.2;
    }

    .delta.up {
      color: var(--green);
      background: var(--green-soft);
    }

    .delta.down {
      color: var(--red);
      background: var(--red-soft);
    }

    .delta.flat {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .section-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr);
      gap: 14px;
    }

    .work-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(23, 32, 42, 0.04);
      min-width: 0;
    }

    .panel-header {
      min-height: 54px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
    }

    .panel-header h2,
    .panel-header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 780;
      line-height: 1.3;
    }

    .panel-header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .panel-body {
      padding: 16px;
    }

    .chart {
      display: grid;
      gap: 13px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr) 72px;
      align-items: center;
      gap: 12px;
      min-height: 34px;
      border-radius: 7px;
      padding: 4px 6px;
      transition: background 0.15s ease;
    }

    .bar-row:hover,
    .bar-row.active {
      background: var(--surface-2);
    }

    .bar-label {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .track {
      position: relative;
      height: 18px;
      border-radius: 999px;
      background: #edf1f5;
      overflow: hidden;
    }

    .bar {
      position: absolute;
      inset: 0 auto 0 0;
      min-width: 3px;
      border-radius: 999px;
      background: var(--green);
    }

    .bar.low {
      background: var(--red);
    }

    .bar.warn {
      background: var(--amber);
    }

    .baseline {
      position: absolute;
      top: -5px;
      bottom: -5px;
      width: 2px;
      background: #24313f;
      opacity: 0.7;
    }

    .value-cell {
      font-size: 13px;
      font-weight: 760;
      text-align: right;
      white-space: nowrap;
    }

    .chart-caption {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .drill-list {
      display: grid;
      gap: 10px;
    }

    .drill-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--surface-2);
    }

    .drill-item strong {
      display: block;
      font-size: 13px;
      line-height: 1.35;
      margin-bottom: 5px;
    }

    .drill-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .wide-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(0, 1.14fr);
      gap: 14px;
    }

    .path-list {
      display: grid;
      gap: 10px;
    }

    .path-step {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .step-index {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--teal);
      background: var(--teal-soft);
      font-size: 12px;
      font-weight: 820;
    }

    .path-step strong {
      display: block;
      font-size: 13px;
      line-height: 1.35;
    }

    .path-step span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 2px;
    }

    .step-rate {
      color: var(--text);
      font-size: 13px;
      font-weight: 780;
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 660px;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 10px 9px;
      vertical-align: top;
      line-height: 1.45;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 780;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 760;
      white-space: nowrap;
    }

    .status-pill.good {
      color: var(--green);
      background: var(--green-soft);
    }

    .status-pill.bad {
      color: var(--red);
      background: var(--red-soft);
    }

    .status-pill.watch {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .action-band {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(23, 32, 42, 0.04);
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 16px;
    }

    .action-item {
      min-height: 146px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .action-item b {
      font-size: 13px;
      line-height: 1.35;
    }

    .action-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .impact {
      width: fit-content;
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--blue);
      background: var(--blue-soft);
      font-size: 11px;
      font-weight: 780;
    }

    .compare-tools {
      display: grid;
      grid-template-columns: minmax(0, 0.64fr) minmax(0, 1.36fr);
      gap: 14px;
      align-items: stretch;
    }

    .compare-form {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .compare-result {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      padding: 16px;
      align-items: stretch;
    }

    .compare-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: var(--surface-2);
      display: grid;
      gap: 7px;
    }

    .compare-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .compare-card strong {
      font-size: 24px;
      line-height: 1.1;
    }

    .compare-vs {
      align-self: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 9px;
      color: var(--muted);
      background: var(--surface);
      font-size: 11px;
      font-weight: 820;
    }

    .significance {
      grid-column: 1 / -1;
      border-radius: 8px;
      background: var(--teal-soft);
      color: #07544f;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
    }

    .empty-hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      padding: 10px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: var(--surface-2);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .side-title {
        grid-column: 1 / -1;
      }

      .section-grid,
      .wide-grid,
      .compare-tools {
        grid-template-columns: 1fr;
      }

      .kpi-grid,
      .action-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px;
      }

      .brand {
        min-width: 0;
        width: 100%;
      }

      .brand h1,
      .brand p {
        white-space: normal;
      }

      .global-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        justify-content: stretch;
        width: 100%;
      }

      .global-controls .segmented {
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
        overflow: hidden;
      }

      .global-controls .segmented button {
        flex: 1 1 0;
        min-width: 0;
        padding: 0 4px;
      }

      .global-controls .control,
      .global-controls .text-btn,
      .global-controls .primary-btn {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        padding-left: 8px;
        padding-right: 8px;
      }

      .global-controls .more-filters {
        grid-column: 1 / -1;
      }

      .global-controls .more-filters summary {
        width: 100%;
        justify-content: space-between;
      }

      .filter-menu {
        position: static;
        width: 100%;
        grid-template-columns: 1fr;
        margin-top: 8px;
        box-shadow: none;
      }

      .data-freshness {
        grid-column: 1 / -1;
      }

      .layout {
        padding: 12px;
      }

      .side {
        grid-template-columns: 1fr;
      }

      .insight-band {
        grid-template-columns: 1fr;
      }

      .benchmark-tile {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 14px 0 0;
      }

      .kpi-grid,
      .action-grid,
      .compare-result {
        grid-template-columns: 1fr;
      }

      .compare-vs {
        justify-self: start;
      }

      .bar-row {
        grid-template-columns: 86px minmax(0, 1fr) 58px;
        gap: 8px;
      }

      .path-step {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .step-rate {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>AI销售全链路BI决策看板</h1>
          <p>开口率 × 开口后转化率 = 全链路转化率</p>
        </div>
      </div>
      <div class="global-controls" aria-label="全局筛选">
        <div class="segmented" role="group" aria-label="统计口径">
          <button class="active" type="button" data-mode="cohort">同期群</button>
          <button type="button" data-mode="event">事件发生</button>
        </div>
        <select class="control" id="dateRange" aria-label="加微日期范围">
          <option>近30天加微客户</option>
          <option>近7天加微客户</option>
          <option>本季度加微客户</option>
        </select>
        <select class="control" id="observeWindow" aria-label="观察窗口">
          <option>观察窗口：7天</option>
          <option>观察窗口：24小时</option>
          <option>观察窗口：14天</option>
          <option>观察窗口：30天</option>
        </select>
        <select class="control" aria-label="业务项目">
          <option>全部项目</option>
          <option>S10皮肤管理</option>
          <option>热玛吉高客单</option>
          <option>水光针种草</option>
        </select>
        <select class="control" aria-label="SOP策略">
          <option>全部SOP策略</option>
          <option>S10皮肤管理7天触达</option>
          <option>水光针种草序列</option>
          <option>热玛吉高意向序列</option>
        </select>
        <details class="more-filters">
          <summary>更多筛选</summary>
          <div class="filter-menu">
            <div class="filter-field">
              <label for="staffFilter">添加员工</label>
              <select class="control" id="staffFilter">
                <option>全部员工</option>
                <option>顾问A组</option>
                <option>顾问B组</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="painFilter">主要卡点</label>
              <select class="control" id="painFilter">
                <option>全部卡点</option>
                <option>价格/费用</option>
                <option>距离/便利</option>
                <option>效果疑虑</option>
                <option>犹豫拖延</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="sequenceFilter">跟进序列</label>
              <select class="control" id="sequenceFilter">
                <option>全部跟进序列</option>
                <option>标准序列</option>
                <option>快速逼单序列</option>
                <option>慢热培育序列</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="styleFilter">AI风格</label>
              <select class="control" id="styleFilter">
                <option>全部AI风格</option>
                <option>顾问型</option>
                <option>闺蜜型</option>
                <option>逼单型</option>
                <option>服务型</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="attributeFilter">成交归因</label>
              <select class="control" id="attributeFilter">
                <option>全部成交归因</option>
                <option>AI自动完成</option>
                <option>AI+人工</option>
                <option>纯人工</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="statusFilter">最终状态</label>
              <select class="control" id="statusFilter">
                <option>全部最终状态</option>
                <option>已成交</option>
                <option>深度沉默</option>
                <option>跟进中</option>
                <option>明确拒绝</option>
                <option>客户已删除企微</option>
              </select>
            </div>
          </div>
        </details>
        <button class="text-btn" type="button" id="exportAnalysis">导出分析</button>
        <button class="primary-btn" type="button" id="refreshData">刷新数据</button>
        <span class="data-freshness" id="dataFreshness">数据更新于 10:30</span>
      </div>
    </header>

    <main class="layout">
      <aside class="side" id="moduleNav" aria-label="分析模块导航"></aside>

      <section class="content" aria-live="polite">
        <div class="insight-band">
          <div>
            <div class="insight-label" id="insightLabel">本周核心问题</div>
            <h2 class="insight-title" id="insightTitle"></h2>
            <p class="insight-text" id="insightText"></p>
          </div>
          <div class="benchmark-tile">
            <span id="benchmarkLabel"></span>
            <strong id="benchmarkValue"></strong>
            <small id="benchmarkNote"></small>
          </div>
        </div>

        <nav class="analysis-tabs" id="analysisTabs" aria-label="转化分析视图" hidden></nav>

        <div class="kpi-grid" id="kpiGrid"></div>

        <div class="section-grid">
          <section class="work-panel">
            <div class="panel-header">
              <div>
                <h2 id="chartTitle"></h2>
                <p id="chartSub"></p>
              </div>
              <button class="text-btn" type="button" id="resetDrill">查看大盘</button>
            </div>
            <div class="panel-body">
              <div class="chart" id="comparisonChart"></div>
              <div class="chart-caption" id="chartCaption"></div>
            </div>
          </section>

          <section class="work-panel">
            <div class="panel-header">
              <div>
                <h3 id="drillTitle"></h3>
                <p id="drillSub"></p>
              </div>
            </div>
            <div class="panel-body">
              <div class="drill-list" id="drillList"></div>
            </div>
          </section>
        </div>

        <div class="wide-grid">
          <section class="work-panel">
            <div class="panel-header">
              <div>
                <h3 id="pathTitle"></h3>
                <p id="pathSub"></p>
              </div>
            </div>
            <div class="panel-body">
              <div class="path-list" id="pathList"></div>
            </div>
          </section>

          <section class="work-panel">
            <div class="panel-header">
              <div>
                <h3 id="tableTitle"></h3>
                <p id="tableSub"></p>
              </div>
            </div>
            <div class="panel-body">
              <div class="table-wrap" id="tableWrap"></div>
            </div>
          </section>
        </div>

        <section class="action-band">
          <div class="panel-header">
            <div>
              <h3 id="actionTitle"></h3>
              <p>每条建议都绑定触发证据、预计影响和执行对象，避免只停留在结论层。</p>
            </div>
          </div>
          <div class="action-grid" id="actionGrid"></div>
        </section>

        <section class="work-panel compare-tools">
          <div>
            <div class="panel-header">
              <div>
                <h3>A/B对比视图</h3>
                <p>选择任意两个策略、节点、话术或节奏，查看差异和判断。</p>
              </div>
            </div>
            <div class="compare-form">
              <div class="field">
                <label for="compareA">对象A</label>
                <select class="control" id="compareA"></select>
              </div>
              <div class="field">
                <label for="compareB">对象B</label>
                <select class="control" id="compareB"></select>
              </div>
            </div>
          </div>
          <div class="compare-result" id="compareResult"></div>
        </section>
      </section>
    </main>
  </div>

    const moduleKeys = Object.keys(modules);
    let activeKey = 'overview';
    let activeDrillLabel = null;
    let activeConversionView = 'overview';

    const conversionViewLabels = {
      overview: '全景拆解',
      converted: '成交客户',
      nonConverted: '未成交客户',
      reopen: '复开与节奏'
    };

    const $ = (selector) => document.querySelector(selector);

    function getActiveData() {
      const module = modules[activeKey];
      if (activeKey === 'conversion' && activeConversionView !== 'overview') {
        return module.subviews[activeConversionView];
      }
      return module;
    }

    function renderNav() {
      const nav = $('#moduleNav');
      nav.innerHTML = '<div class="side-title">分析模块</div>' + moduleKeys.map((key) => {
        const item = modules[key];
        return `
          <button class="module-btn ${key === activeKey ? 'active' : ''}" type="button" data-module="${key}">
            <span class="module-headline">
              <span class="module-name">${item.title}</span>
              <span class="module-badge">${item.badge}</span>
            </span>
            <span class="module-meta">${item.navMeta}</span>
          </button>
        `;
      }).join('');

      nav.querySelectorAll('[data-module]').forEach((button) => {
        button.addEventListener('click', () => {
          activeKey = button.dataset.module;
          if (activeKey === 'conversion') activeConversionView = 'overview';
          activeDrillLabel = null;
          renderPage();
        });
      });
    }

    function renderAnalysisTabs() {
      const tabs = $('#analysisTabs');
      const visible = activeKey === 'conversion';
      tabs.hidden = !visible;
      if (!visible) {
        tabs.innerHTML = '';
        return;
      }

      tabs.innerHTML = Object.entries(conversionViewLabels).map(([key, label]) => `
        <button class="analysis-tab ${key === activeConversionView ? 'active' : ''}" type="button" data-conversion-view="${key}">${label}</button>
      `).join('');

      tabs.querySelectorAll('[data-conversion-view]').forEach((button) => {
        button.addEventListener('click', () => {
          activeConversionView = button.dataset.conversionView;
          activeDrillLabel = null;
          renderPage();
        });
      });
    }

    function renderKpis(data) {
      $('#kpiGrid').innerHTML = data.metrics.map((metric) => `
        <article class="kpi-card">
          <span class="label">${metric.label}</span>
          <strong class="value">${metric.value}</strong>
          <span class="delta ${metric.trend}">${metric.delta}</span>
          <span class="note">${metric.note}</span>
        </article>
      `).join('');
    }

    function barClass(value, baseline) {
      if (value >= baseline) return '';
      if (value >= baseline * 0.8) return 'warn';
      return 'low';
    }

    function renderChart(data) {
      const maxValue = Math.max(...data.bars.map((bar) => bar.value), data.baseline) * 1.12 || 1;
      const baselineLeft = Math.min(100, (data.baseline / maxValue) * 100);
      $('#comparisonChart').innerHTML = data.bars.map((bar) => {
        const width = Math.max(1, (bar.value / maxValue) * 100);
        const isActive = activeDrillLabel === bar.label;
        return `
          <button class="bar-row ${isActive ? 'active' : ''}" type="button" data-bar="${bar.label}">
            <span class="bar-label">${bar.label}</span>
            <span class="track" aria-label="${bar.label} ${bar.value}${data.unit}">
              <span class="bar ${barClass(bar.value, data.baseline)}" style="width:${width}%"></span>
              <span class="baseline" style="left:${baselineLeft}%"></span>
            </span>
            <span class="value-cell">${bar.value}${data.unit}</span>
          </button>
        `;
      }).join('');

      $('#comparisonChart').querySelectorAll('[data-bar]').forEach((row) => {
        row.addEventListener('click', () => {
          activeDrillLabel = row.dataset.bar;
          renderChart(data);
          renderDrill(data);
        });
      });
    }

    function renderDrill(data) {
      const label = activeDrillLabel;
      const items = label && data.drillByLabel && data.drillByLabel[label] ? data.drillByLabel[label] : data.drillDefault;
      const selectedBar = data.bars.find((bar) => bar.label === label);
      $('#drillTitle').textContent = label ? `第二层：${label}归因下钻` : data.drillTitle;
      $('#drillSub').textContent = selectedBar ? selectedBar.meta : data.drillSub;
      $('#drillList').innerHTML = items.map((item) => `
        <div class="drill-item">
          <strong>${item[0]}</strong>
          <span>${item[1]}</span>
        </div>
      `).join('');
    }

    function renderPaths(data) {
      $('#pathList').innerHTML = data.paths.map((step, index) => `
        <div class="path-step">
          <span class="step-index">${index + 1}</span>
          <span>
            <strong>${step[0]}</strong>
            <span>${step[1]}</span>
          </span>
          <strong class="step-rate">${step[2]}</strong>
        </div>
      `).join('');
    }

    function parseStatus(value) {
      if (typeof value !== 'string' || !value.includes(':')) return value;
      const [status, label] = value.split(':');
      return `<span class="status-pill ${status}">${label}</span>`;
    }

    function renderTable(data) {
      const head = data.columns.map((column) => `<th>${column}</th>`).join('');
      const body = data.rows.map((row) => `
        <tr>${row.map((cell) => `<td>${parseStatus(cell)}</td>`).join('')}</tr>
      `).join('');
      $('#tableWrap').innerHTML = `
        <table>
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function renderActions(data) {
      $('#actionGrid').innerHTML = data.actions.map((action) => `
        <article class="action-item">
          <span class="impact">${action[2]}</span>
          <b>${action[0]}</b>
          <p>${action[1]}</p>
        </article>
      `).join('');
    }

    function fillSelect(select, options, selected) {
      select.innerHTML = options.map((option) => `<option ${option.label === selected ? 'selected' : ''}>${option.label}</option>`).join('');
    }

    function renderCompare(data) {
      const options = data.bars.map((bar) => ({ label: bar.label, value: bar.value, meta: bar.meta }));
      const first = options[0];
      const second = options[1] || options[0];
      const selectA = $('#compareA');
      const selectB = $('#compareB');
      if (!selectA.value || !options.some((option) => option.label === selectA.value)) {
        fillSelect(selectA, options, first.label);
      } else {
        fillSelect(selectA, options, selectA.value);
      }
      if (!selectB.value || !options.some((option) => option.label === selectB.value)) {
        fillSelect(selectB, options, second.label);
      } else {
        fillSelect(selectB, options, selectB.value);
      }

      const draw = () => {
        const itemA = options.find((option) => option.label === selectA.value) || first;
        const itemB = options.find((option) => option.label === selectB.value) || second;
        const diff = itemA.value - itemB.value;
        const abs = Math.abs(diff).toFixed(1);
        const winner = diff >= 0 ? itemA.label : itemB.label;
        const level = Math.abs(diff) >= data.baseline * 0.25 ? '观察差异较大' : '差异需继续观察';
        $('#compareResult').innerHTML = `
          <div class="compare-card">
            <span>${itemA.label}</span>
            <strong>${itemA.value}${data.unit}</strong>
            <span>${itemA.meta}</span>
          </div>
          <div class="compare-vs">VS</div>
          <div class="compare-card">
            <span>${itemB.label}</span>
            <strong>${itemB.value}${data.unit}</strong>
            <span>${itemB.meta}</span>
          </div>
          <div class="significance">${level}：${winner}领先${abs}${data.unit}。当前为描述性对比，需控制项目、卡点、意向和观察窗口后再判断是否复制。</div>
        `;
      };

      selectA.onchange = draw;
      selectB.onchange = draw;
      draw();
    }

    function renderPage() {
      const data = getActiveData();
      renderNav();
      renderAnalysisTabs();
      $('#insightLabel').textContent = data.insightLabel;
      $('#insightTitle').textContent = data.insightTitle;
      $('#insightText').textContent = data.insightText;
      $('#benchmarkLabel').textContent = data.benchmark.label;
      $('#benchmarkValue').textContent = data.benchmark.value;
      $('#benchmarkNote').textContent = data.benchmark.note;
      $('#chartTitle').textContent = data.chartTitle;
      $('#chartSub').textContent = data.chartSub;
      $('#chartCaption').textContent = data.chartCaption;
      $('#pathTitle').textContent = data.pathTitle;
      $('#pathSub').textContent = data.pathSub;
      $('#tableTitle').textContent = data.tableTitle;
      $('#tableSub').textContent = data.tableSub;
      $('#actionTitle').textContent = data.actionsTitle;
      renderKpis(data);
      renderChart(data);
      renderDrill(data);
      renderPaths(data);
      renderTable(data);
      renderActions(data);
      renderCompare(data);
    }

    $('#resetDrill').addEventListener('click', () => {
      activeDrillLabel = null;
      renderPage();
    });

    document.querySelectorAll('.segmented button').forEach((button) => {
      button.addEventListener('click', () => {
        button.parentElement.querySelectorAll('button').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        const isCohort = button.dataset.mode === 'cohort';
        $('#observeWindow').disabled = !isCohort;
        $('#dateRange').setAttribute('aria-label', isCohort ? '加微日期范围' : '事件发生日期范围');
        $('#dataFreshness').textContent = isCohort ? '同期群口径 · 统一观察窗口' : '事件口径 · 按发生日期统计';
      });
    });

    document.querySelectorAll('.global-controls select').forEach((select) => {
      select.addEventListener('change', () => {
        $('#dataFreshness').textContent = `筛选已应用 · ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
      });
    });

    $('#refreshData').addEventListener('click', () => {
      const button = $('#refreshData');
      button.disabled = true;
      button.textContent = '刷新中';
      window.setTimeout(() => {
        button.disabled = false;
        button.textContent = '刷新数据';
        $('#dataFreshness').textContent = `数据更新于 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
      }, 650);
    });

    $('#exportAnalysis').addEventListener('click', () => {
      const data = getActiveData();
      const lines = [
        ['模块', data.title],
        ['核心结论', data.insightTitle],
        [],
        ['指标', '当前值', '变化', '说明'],
        ...data.metrics.map((item) => [item.label, item.value, item.delta, item.note]),
        [],
        data.columns,
        ...data.rows.map((row) => row.map((cell) => String(cell).replace(/^(good|bad|watch):/, '')))
      ];
      const csv = '\ufeff' + lines.map((row) => row.map((cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `${data.title}-分析导出.csv`;
      link.click();
      URL.revokeObjectURL(url);
    });

    renderPage();
  </script>
</body>
</html>
