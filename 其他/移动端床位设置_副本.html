<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>床位安排 - 上海徐汇店</title>
  <!-- 保留原页面样式版本与全部 Tab 内控件样式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 隐藏滚动条 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 针对手机端点击态优化 */
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }
    /* 隐藏 input type="number" 的上下箭头 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    /* 自定义 select 下拉箭头隐藏（用SVG替代） */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 tap-highlight-transparent">

  <!-- 模拟手机外壳容器（PC端居中，手机端全屏） -->
  <div class="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-2xl relative pb-28">
    
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <button id="header-back" onclick="returnToOverview()" aria-label="返回全部日期安排" class="p-1 text-gray-400 hover:text-gray-600 focus:outline-none hidden">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
        </button>
        <div>
          <h1 id="page-title" class="text-lg font-bold text-gray-800">床位安排</h1>
          <p class="text-xs text-gray-400">上海徐汇店</p>
        </div>
      </div>
      <button id="reception-settings-button" type="button" onclick="openCapacitySettings()" class="min-h-[44px] min-w-[44px] text-sm font-medium text-blue-600 active:text-blue-800">设置</button>
      <button id="reset-button" onclick="resetAll()" class="hidden text-sm font-medium text-gray-500 hover:text-blue-600 px-2.5 py-1 rounded-full hover:bg-gray-100 transition-all">
        重置
      </button>
    </header>

    <!-- 首页只看已安排结果，沿用原页面的字号、卡片、间距与蓝色按钮。 -->
    <main id="overview-page" class="flex-1 p-4 space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-sm font-bold text-gray-700">全部日期安排</span>
        <span class="text-xs text-gray-400">点日期查看、调整</span>
      </div>
      <div id="schedule-list" class="space-y-3"></div>
    </main>

    <!-- 单日直接填写；批量设置保留上方选日期，新客 / 老客 Tab 内控件沿用原样。 -->
    <main id="settings-page" class="hidden flex-1 p-4 space-y-4 overflow-y-auto no-scrollbar">
      <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
        <!-- 选择目标日期 -->
        <div id="date-picker" class="p-4 bg-slate-50/50">
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center space-x-1.5">
              <span class="w-1.5 h-4 bg-blue-600 rounded-full"></span>
              <h2 class="text-base font-bold text-gray-800">1. 选择生效日期</h2>
            </div>
            <span id="selected-count-badge" class="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-semibold">
              已选 0 天
            </span>
          </div>
          <div class="flex space-x-2 mb-3">
            <button onclick="selectQuickDays(15)" class="flex-1 py-2 px-3 text-xs font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-xl transition-colors flex items-center justify-center space-x-1.5 border border-blue-100 active:scale-95 duration-150">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
              <span>一键选未来15天</span>
            </button>
            <button onclick="clearDateSelection()" class="py-2 px-4 text-xs font-medium text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors active:scale-95 duration-150">
              清除
            </button>
          </div>
          <div class="grid grid-cols-4 gap-2" id="date-grid"></div>
        </div>

        <!-- 视觉引导线 -->
        <div id="date-picker-guide" class="relative flex items-center justify-center py-1 bg-white">
          <div class="absolute inset-0 flex items-center px-4" aria-hidden="true">
            <div class="w-full border-t border-dashed border-gray-200"></div>
          </div>
          <div class="relative z-10 w-8 h-8 rounded-full bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-500 shadow-xs">
            <svg class="w-4 h-4 animate-bounce mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 13l-7 7-7-7m14-6l-7 7-7-7" />
            </svg>
          </div>
        </div>

        <!-- 配置选定日期的床位数 -->
        <div class="p-4 bg-white transition-all duration-300" id="bed-config-container">
          <div class="mb-3" id="bed-config-header"></div>
          <div id="bed-config-content-wrapper" class="space-y-4 transition-opacity duration-300">
            <div class="bg-gray-100 p-1 rounded-xl flex">
              <button onclick="switchGuestTab('new')" id="tab-new" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition-all text-blue-600 bg-white shadow-sm">
                新客床位
              </button>
              <button onclick="switchGuestTab('old')" id="tab-old" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all text-gray-500 hover:text-gray-800">
                老客床位
              </button>
            </div>
            <div class="space-y-4">
              <!-- 总数配额卡片 -->
              <div class="flex items-center justify-between bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                <div>
                  <span class="text-sm font-bold text-gray-800" id="total-bed-title">新客总接待上限</span>
                </div>
                <div class="flex items-center space-x-3">
                  <button onclick="adjustTotalBed(-1)" class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-blue-600 border border-blue-200 active:scale-95 transition-transform shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4" /></svg>
                  </button>
                  <span id="total-bed-value" class="text-xl font-extrabold text-blue-600 w-8 text-center">5</span>
                  <button onclick="adjustTotalBed(1)" class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-blue-600 border border-blue-200 active:scale-95 transition-transform shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                  </button>
                </div>
              </div>

              <!-- 专属床位开关与增加类型入口合并为一行。 -->
              <div class="flex items-center justify-between gap-1 py-2 border-t border-gray-50">
                <div class="flex items-center gap-2 shrink-0">
                  <span class="text-sm font-semibold text-gray-700 whitespace-nowrap">开启专属床位</span>
                  <button type="button" onclick="toggleDepartmentConfig()" id="dept-toggle" aria-label="开启专属床位" class="w-12 h-6 shrink-0 rounded-full transition-colors duration-200 ease-in-out relative focus:outline-none bg-blue-600">
                    <span id="dept-toggle-dot" class="translate-x-7 ease-in-out duration-200 block w-4 h-4 rounded-full bg-white shadow transform ring-0 transition"></span>
                  </button>
                </div>
                <button type="button" id="add-department-button" onclick="addDepartment()" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1.5 rounded-lg hover:bg-blue-100 flex items-center space-x-1 shrink-0 whitespace-nowrap transition-colors border border-blue-100">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                  <span>增加床位类型</span>
                </button>
              </div>

              <!-- 品类动态配置面板 -->
              <div id="dept-config-panel" class="space-y-3 transition-all duration-300">
                <div class="space-y-3" id="active-depts-list"></div>
                
                <div class="p-3 bg-slate-50 rounded-xl border border-dashed border-slate-200 flex items-center justify-between mt-2">
                  <div>
                    <div class="flex items-center space-x-1.5">
                      <span class="text-sm font-bold text-slate-700">通用床位</span>
                      <span class="text-[9px] bg-slate-200 text-slate-600 px-1 py-0.5 rounded font-mono font-bold">自动计算</span>
                    </div>
                  </div>
                  <div class="text-right">
                    <span id="universal-bed-value" class="text-lg font-black text-slate-700">0</span>
                    <span class="text-xs text-gray-400">张</span>
                  </div>
                </div>
              </div>


            </div>
          </div>
        </div>
      </section>



    </main>

    <!-- 统一设置入口；门店全部床位类型常驻，按需开启，整页保存。 -->
    <main id="capacity-page" class="hidden flex-1 p-4 space-y-4">
      <section class="bg-white rounded-2xl px-4 py-2 shadow-sm border border-gray-100 flex items-center justify-between gap-2">
        <h2 class="text-sm font-semibold text-gray-800 whitespace-nowrap">客户接待时长间隔</h2>
        <div class="flex shrink-0" role="group" aria-label="客户接待时长间隔">
          <button id="btn-interval-60" type="button" onclick="selectInterval(60)" class="min-h-[44px] px-2 text-xs font-semibold"><span class="block rounded-full px-2 py-1.5">60分钟</span></button>
          <button id="btn-interval-90" type="button" onclick="selectInterval(90)" class="min-h-[44px] px-2 text-xs font-semibold"><span class="block rounded-full px-2 py-1.5">90分钟</span></button>
        </div>
      </section>
      <section>
        <div class="flex items-center justify-between min-h-[44px] mb-1">
          <h2 class="text-sm font-bold text-gray-700">同一时段接待上限</h2>
          <button type="button" onclick="showCapacityHelp()" class="min-h-[44px] text-xs text-blue-600">规则说明</button>
        </div>
        <div id="capacity-rule-list" class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-100 overflow-hidden"></div>
        <p class="text-xs text-gray-400 leading-relaxed px-1 pt-3">未开启的床位类型，不限制同时接待人数。</p>
      </section>
    </main>

    <!-- 单列手机布局：保留原按钮样式，底部操作固定在手机宽度及安全区内。 -->
    <footer style="padding-bottom:max(1rem, env(safe-area-inset-bottom))" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-40 bg-white/95 backdrop-blur-md border-t border-gray-100 p-4 flex space-x-3">
      <button id="footer-back" onclick="returnToOverview()" class="hidden w-1/3 py-3 px-4 rounded-xl border border-gray-200 text-sm font-semibold text-gray-500 hover:bg-gray-50 transition-colors active:scale-[0.98]">
        返回
      </button>
      <button onclick="handlePrimaryAction()" class="flex-1 py-3 px-6 rounded-xl bg-blue-600 text-sm font-semibold text-white shadow-lg shadow-blue-200 hover:bg-blue-700 active:bg-blue-800 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
        <span id="primary-label">批量设置床位</span>
      </button>
    </footer>


    <div id="confirm-layer" class="hidden fixed inset-0 z-[60] bg-black/30 flex items-end justify-center" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="w-full max-w-md bg-white rounded-t-2xl p-4 shadow-xl" style="padding-bottom:max(1rem, env(safe-area-inset-bottom))">
        <h2 id="confirm-title" class="text-base font-bold text-gray-800"></h2>
        <div id="confirm-content" class="my-4 text-xs text-gray-500 space-y-3 max-h-[60vh] overflow-y-auto"></div>
        <div class="flex space-x-3">
          <button id="confirm-cancel" onclick="closeConfirmation()" class="w-1/3 py-3 px-4 rounded-xl border border-gray-200 text-sm font-semibold text-gray-500">返回修改</button>
          <button id="confirm-submit" onclick="acceptConfirmation()" class="flex-1 py-3 px-6 rounded-xl bg-blue-600 text-sm font-semibold text-white shadow-lg shadow-blue-200">确认保存</button>
        </div>
      </div>
    </div>

    <!-- 页面操作提示框 (Toast) -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[70] bg-gray-900/95 text-white px-4 py-3 rounded-xl text-sm font-medium shadow-xl opacity-0 scale-90 pointer-events-none transition-all duration-300 flex items-center space-x-2">
      <span id="toast-icon"></span>
      <span id="toast-text">提示信息</span>
    </div>

  </div>

  <script>
    // 日期按上海时区计算；手机与电脑预览使用相同的单列布局。
    const todayKey = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    const today = new Date(`${todayKey}T00:00:00Z`);
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const datesData = Array.from({ length: 15 }, (_, id) => {
      const date = new Date(today.getTime() + (id + 1) * 86400000);
      const key = date.toISOString().slice(0, 10);
      return { id, key, dateStr: key.slice(5), weekday: weekdays[date.getUTCDay()], hasConfig: false, badgeText: '', config: null };
    });

    // 可选床位品类数据池
    const allBedCategories = {
      yimei: { name: '医美床位', desc: '用于光电皮秒、注射等医学美容，可预约品类: s10 k10' },
      shengmei: { name: '生美床位', desc: '用于基础SPA与水分充盈护理项目，可预约品类: s11 k12' },
      wenxiu: { name: '纹绣床位', desc: '用于半永久纹眉、漂唇美睫等' },
      meijia: { name: '美甲美睫', desc: '用于美睫修甲等快消特色品类' },
      liliao: { name: '理疗按摩', desc: '用于艾灸推拿、肩颈修复按摩' },
      zhifa: { name: '植发护发', desc: '用于毛囊种植检测及深层健发' }
    };

    // 新客和老客分别保留总床位、专属开关和品类数量。
    const configState = {
      selectedDates: [],
      currentTab: 'new',
      newGuest: {
        totalLimit: 5,
        useDeptConfig: true,
        activeDepts: ['yimei', 'shengmei'],
        deptValues: { yimei: 0, shengmei: 5, wenxiu: 1, meijia: 0, liliao: 1, zhifa: 1 }
      },
      oldGuest: {
        totalLimit: 5,
        useDeptConfig: true,
        activeDepts: ['yimei', 'shengmei'],
        deptValues: { yimei: 0, shengmei: 5, wenxiu: 1, meijia: 0, liliao: 1, zhifa: 1 }
      }
    };

    // 页面层只负责日期与完整快照；Tab 内继续使用原来的 configState 和控件函数。
    const copy = value => JSON.parse(JSON.stringify(value));
    const SCHEDULE_STORAGE = 'weidong-bed-schedule-original-ui-v1';
    const defaultSnapshot = currentSnapshot();
    let currentView = 'overview';
    // 由入口决定是否展示日期选择；批量入口即使只选一天也保留选择器。
    let singleDateId = null;
    let sourceDateId = null;
    let draftBaseline = '';
    let overviewScrollTop = 0;
    let pendingConfirmation = null;
    let confirmationFocus = null;
    let scheduleStore = addOverviewExamples(readSchedule());
    const CAPACITY_STORAGE = 'weidong-bed-capacity-rules-v1';
    const capacityScopes = { all: '新老客合计限制', separate: '新老客分别限制', new: '仅限制新客', old: '仅限制老客' };
    const advanceOptions = [0, 15, 30, 60];
    let capacityStore = readCapacityRules();
    // 新版门店设置集中保存；首次使用沿用原来的接待间隔。
    scheduleStore.selectedInterval = capacityStore.selectedInterval;
    let intervalDraft = capacityStore.selectedInterval;
    let capacityDraft = [];
    let capacityBaseline = '';
    let capacityShowErrors = false;

    function addOverviewExamples(saved) {
      // 升级示例版本，让已缓存旧演示数据的浏览器也能看到两种未设置状态。
      // 本轮只补齐一次；之后填写并保存这些日期时，正常保留操作结果。
      if (saved.overviewExamplesVersion === 2) return saved;
      const updated = copy(saved);
      const generalDay = datesData[1];
      const unsetDay = datesData[2];
      updated.previousExampleDays = {
        ...saved.previousExampleDays,
        [generalDay.key]: copy(saved.days[generalDay.key] || null),
        [unsetDay.key]: copy(saved.days[unsetDay.key] || null)
      };

      const generalConfig = copy(defaultSnapshot);
      generalConfig.newGuest.totalLimit = 6;
      generalConfig.oldGuest.totalLimit = 8;
      generalConfig.newGuest.useDeptConfig = false;
      generalConfig.oldGuest.useDeptConfig = false;
      updated.days[generalDay.key] = generalConfig;
      // 没有配置记录才是“未设置”；不能用已设置为0张的记录代替。
      delete updated.days[unsetDay.key];
      updated.overviewExamplesVersion = 2;
      try { localStorage.setItem(SCHEDULE_STORAGE, JSON.stringify(updated)); }
      catch (error) { /* 浏览器不允许存储时，仍可查看和操作当前示例。 */ }
      return updated;
    }

    function bedGuestSnapshot(guest) {
      return {
        totalLimit: guest.totalLimit,
        useDeptConfig: guest.useDeptConfig,
        activeDepts: copy(guest.activeDepts),
        deptValues: copy(guest.deptValues)
      };
    }

    function bedSnapshot(snapshot) {
      return { newGuest: bedGuestSnapshot(snapshot.newGuest), oldGuest: bedGuestSnapshot(snapshot.oldGuest) };
    }

    function currentSnapshot() {
      return bedSnapshot(configState);
    }

    function normalizeSchedule(saved) {
      // 兼容旧的日期记录；门店接待间隔迁移为独立设置，不随单日配置切换。
      const previousInterval = Object.entries(saved.days).sort(([a], [b]) => a.localeCompare(b))
        .find(([, day]) => [60, 90].includes(day.selectedInterval))?.[1].selectedInterval;
      const normalized = {
        ...saved,
        version: 2,
        selectedInterval: [60, 90].includes(saved.selectedInterval) ? saved.selectedInterval : previousInterval || 90,
        days: Object.fromEntries(Object.entries(saved.days).map(([key, day]) => [key, bedSnapshot(day)]))
      };
      if (saved.previousExampleDays) {
        normalized.previousExampleDays = Object.fromEntries(Object.entries(saved.previousExampleDays)
          .map(([key, day]) => [key, day && validSnapshot(day) ? bedSnapshot(day) : null]));
      }
      return normalized;
    }

    function validSnapshot(snapshot) {
      return snapshot && ['newGuest', 'oldGuest'].every(key => {
        const guest = snapshot[key];
        return guest && Number.isSafeInteger(guest.totalLimit) && guest.totalLimit >= 0
          && typeof guest.useDeptConfig === 'boolean'
          && Array.isArray(guest.activeDepts) && new Set(guest.activeDepts).size === guest.activeDepts.length
          && guest.deptValues && guest.activeDepts.every(k => allBedCategories[k] && Number.isSafeInteger(guest.deptValues[k]) && guest.deptValues[k] >= 0)
          && (!guest.useDeptConfig || guest.activeDepts.reduce((sum, k) => sum + guest.deptValues[k], 0) <= guest.totalLimit);
      });
    }

    function readSchedule() {
      try {
        const saved = JSON.parse(localStorage.getItem(SCHEDULE_STORAGE));
        if (saved && [1, 2].includes(saved.version) && saved.days && Object.values(saved.days).every(validSnapshot)) return normalizeSchedule(saved);
        // 上一轮原型已经保存的试填数据继续保留，只转换结构，不修改旧存储。
        const previous = JSON.parse(localStorage.getItem('weidong-bed-planning-v3'));
        if (previous && previous.version === 3 && previous.plans && previous.rules) {
          const migrated = { version: 2, selectedInterval: [60, 90].includes(previous.rules.interval) ? previous.rules.interval : 90, days: {} };
          for (const [key, plan] of Object.entries(previous.plans)) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !plan.new || !plan.old || !Array.isArray(plan.categories)) continue;
            const snapshot = copy(defaultSnapshot);
            for (const [from, to] of [['new', 'newGuest'], ['old', 'oldGuest']]) {
              const guest = snapshot[to];
              guest.totalLimit = plan[from].total;
              guest.useDeptConfig = typeof plan[from].dedicated === 'boolean' ? plan[from].dedicated : !!plan.dedicated;
              guest.activeDepts = plan.categories.filter(k => allBedCategories[k]);
              guest.deptValues = { ...guest.deptValues, ...plan[from].values };
            }
            if (validSnapshot(snapshot)) migrated.days[key] = snapshot;
          }
          if (Object.keys(migrated.days).length) return migrated;
        }
      } catch (error) { /* 无可用本地数据时，载入演示数据。 */ }
      const initial = { version: 2, selectedInterval: 90, days: {} };
      datesData.slice(0, 10).forEach(day => {
        const snapshot = copy(defaultSnapshot);
        const weekend = ['周六', '周日'].includes(day.weekday);
        snapshot.newGuest.totalLimit = weekend ? 8 : 6;
        snapshot.newGuest.deptValues.yimei = weekend ? 3 : 2;
        snapshot.newGuest.deptValues.shengmei = 2;
        snapshot.oldGuest.totalLimit = weekend ? 10 : 8;
        snapshot.oldGuest.deptValues.yimei = 3;
        snapshot.oldGuest.deptValues.shengmei = weekend ? 4 : 3;
        initial.days[day.key] = snapshot;
      });
      return initial;
    }

    function persistSchedule() {
      try { localStorage.setItem(SCHEDULE_STORAGE, JSON.stringify(scheduleStore)); return true; }

    // ================== 按床位类型的同时接待规则 ==================
    function defaultCapacityRule(bedType) {
      return { bedType, enabled: false, scope: 'all', limits: {
        all: { limit: 2, advanceMinutes: 0 },
        new: { limit: 2, advanceMinutes: 0 },
        old: { limit: 2, advanceMinutes: 0 }
      } };
    }

    function capacityGroups(rule) {
      return rule.scope === 'separate' ? ['new', 'old'] : [rule.scope];
    }

    function capacityRuleErrors(rules) {
      if (!Array.isArray(rules)) return [{ index: 0, message: '请重新设置接待规则' }];
      const errors = [];
      rules.forEach((rule, index) => {
        if (!rule || !Object.hasOwn(allBedCategories, rule.bedType) || !Object.hasOwn(capacityScopes, rule.scope)
          || typeof rule.enabled !== 'boolean' || !rule.limits) {
          errors.push({ index, message: '请选择有效的限制方式' });
          return;
        }
        if (!rule.enabled) return;
        for (const group of capacityGroups(rule)) {
          const config = rule.limits[group];
          const name = group === 'all' ? '合计' : group === 'new' ? '新客' : '老客';
          if (!Number.isSafeInteger(config?.limit) || config.limit < 1) {
            errors.push({ index, message: `${name}接待上限请填写大于 0 的整数` });
          } else if (!advanceOptions.includes(config.advanceMinutes)) {
            errors.push({ index, message: `请选择${name}提前接待时间` });
          }
        }
      });
      return errors;
    }

    function normalizeCapacityRule(rule) {
      const normalized = defaultCapacityRule(rule.bedType);
      normalized.enabled = rule.enabled;
      normalized.scope = rule.scope;
      for (const group of ['all', 'new', 'old']) {
        const config = rule.limits?.[group];
        if (Number.isSafeInteger(config?.limit) && config.limit >= 1) normalized.limits[group].limit = config.limit;
        if (advanceOptions.includes(config?.advanceMinutes)) normalized.limits[group].advanceMinutes = config.advanceMinutes;
      }
      return normalized;
    }

    function readCapacityRules() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(CAPACITY_STORAGE)); }
      catch (error) { /* 未设置过的类型保持关闭。 */ }
      const rules = Object.keys(allBedCategories).map(bedType => {
        const rule = defaultCapacityRule(bedType);
        if (saved?.version === 2) {
          const previous = Array.isArray(saved.rules) ? saved.rules.find(item => item?.bedType === bedType) : null;
          return previous && !capacityRuleErrors([previous]).length ? normalizeCapacityRule(previous) : rule;
        }
        if (saved?.version !== 1 || !Array.isArray(saved.rules)) return rule;
        // 兼容旧版同类型拆为新客、老客两条规则；分别保留两边的上限与提前时间。
        const previous = saved.rules.filter(item => item?.bedType === bedType
          && ['all', 'new', 'old'].includes(item.scope) && Number.isSafeInteger(item.limit)
          && item.limit >= 1 && advanceOptions.includes(item.advanceMinutes));
        previous.forEach(item => {
          // 旧版可能留有关闭的同范围规则，优先保留当前开启项。
          if (item.enabled || !previous.some(other => other.scope === item.scope && other.enabled)) {
            rule.limits[item.scope] = { limit: item.limit, advanceMinutes: item.advanceMinutes };
          }
        });
        const active = previous.filter(item => item.enabled);
        const selected = active.length ? active : previous;
        rule.enabled = !!active.length;
        rule.scope = selected.some(item => item.scope === 'all') ? 'all'
          : selected.some(item => item.scope === 'new') && selected.some(item => item.scope === 'old') ? 'separate'
          : selected[0]?.scope || 'all';
        return rule;
      });
      return { version: 2, selectedInterval: saved?.version === 2 && [60, 90].includes(saved.selectedInterval)
        ? saved.selectedInterval : scheduleStore.selectedInterval, rules };
    }

    function updateCapacityRule(index, field, value) {
      const rule = capacityDraft[index];
      if (!rule || !['scope', 'enabled'].includes(field)) return;
      if (field === 'scope' && !Object.hasOwn(capacityScopes, value)) return;
      if (field === 'enabled' && typeof value !== 'boolean') return;
      rule[field] = value;
      renderCapacityEditor();
    }

    function updateCapacityValue(index, group, field, value, preserveInput = false) {
      const config = capacityDraft[index]?.limits[group];
      if (!config || !['limit', 'advanceMinutes'].includes(field)) return;
      if (field === 'advanceMinutes' && !advanceOptions.includes(value)) return;
      config[field] = value;
      if (preserveInput && field === 'limit') document.getElementById(`capacity-minus-${index}-${group}`).disabled = value <= 1;
      if (!preserveInput) renderCapacityEditor();
    }

    function adjustCapacityLimit(index, group, amount) {
      const current = capacityDraft[index]?.limits[group]?.limit;
      const next = Math.max(1, (Number.isSafeInteger(current) ? current : 1) + amount);
      if (Number.isSafeInteger(next)) updateCapacityValue(index, group, 'limit', next);
    }

      // 接待间隔与规则一次保存，不改动任何日期的床位配置。
      capacityStore = { version: 2, selectedInterval: intervalDraft, rules: capacityDraft.map(normalizeCapacityRule) };

    function effectiveCapacityRules(rules) {
      return rules.flatMap(rule => rule.limits
        ? capacityGroups(rule).map(scope => ({ bedType: rule.bedType, enabled: rule.enabled, scope, ...rule.limits[scope] }))
        : [rule]);
    }

    // 预约示例使用的规则计算。接入排客系统时传入该门店当天有效的预约，取消记录须排除。
    // guest 表示预约所属的新客/老客床位分区；bedType 按项目归属类型取值，排在通用床位的同类项目也计数。
    // 名额占用区间为 [开始, 结束 - 提前分钟)，床位仍占用完整的 [开始, 结束)。
    // 提前结束只释放本规则的接待名额；实际仪器、人员的可用性须由对应资源系统另行检查。
    function checkCapacityAvailability(candidate, appointments, rules) {
      if (!Number.isFinite(candidate.start) || !Number.isFinite(candidate.end) || candidate.end <= candidate.start) return { allowed: false, reason: '请检查服务起止时间' };
      const active = appointments.filter(item => item.status !== 'cancelled' && (!candidate.id || item.id !== candidate.id));
      if (active.some(item => candidate.bedId && item.bedId === candidate.bedId && item.start < candidate.end && item.end > candidate.start)) {
        return { allowed: false, reason: '该床位在完整服务期间已有预约' };
      }
      for (const rule of effectiveCapacityRules(rules).filter(item => item.enabled && item.bedType === candidate.bedType && (item.scope === 'all' || item.scope === candidate.guest))) {
        const matching = active.filter(item => item.bedType === rule.bedType && (rule.scope === 'all' || rule.scope === item.guest)
          && item.start < candidate.end && item.end > candidate.start);
        if ([candidate, ...matching].some(item => item.end - item.start <= rule.advanceMinutes)) {
          return { allowed: false, reason: '提前时间须小于每笔预约的服务时长' };
        }
        const start = candidate.start;
        const end = candidate.end - rule.advanceMinutes;
        const points = [...new Set([start, ...matching.flatMap(item => [item.start, item.end - rule.advanceMinutes])])]
          .filter(time => time >= start && time < end).sort((a, b) => a - b);
        if (points.some(time => matching.filter(item => item.start <= time && time < item.end - rule.advanceMinutes).length + 1 > rule.limit)) {
          return { allowed: false, reason: '服务期间接待名额不足' };
        }
      }
      return { allowed: true };
    }

    function capacityExampleContent(advanceMinutes = 30) {
      // 固定示例独立于设置草稿，查看说明不会启用或改写门店规则。
      const rule = { bedType: 'yimei', scope: 'all', enabled: true, limit: 2, advanceMinutes: 30 };
      const appointments = [
        { id: 'a', bedId: '1', bedType: rule.bedType, guest: 'new', start: 540, end: 660 },
        { id: 'b', bedId: '2', bedType: rule.bedType, guest: 'old', start: 600, end: 720 }
      ];
      const candidate = { id: 'c', bedId: '3', bedType: rule.bedType, guest: 'new' };
      const starts = Array.from({ length: 13 }, (_, i) => 540 + i * 15);
      const findStart = advanceMinutes => starts.find(start => checkCapacityAvailability({ ...candidate, start, end: start + 120 }, appointments, [{ ...rule, advanceMinutes }]).allowed);
      const regularStart = findStart(0);
      const advanceStart = findStart(30);
      const start = advanceMinutes === 30 ? advanceStart : regularStart;
      const format = time => `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(time % 60).padStart(2, '0')}`;
      const all = [...appointments, { ...candidate, start, end: start + 120 }];
      const board = `<div id="capacity-example-board" role="img" aria-label="时间纵轴、床位横轴。A：09:00 至 11:00，B：10:00 至 12:00，C：${format(start)} 至 ${format(start + 120)}。" class="grid gap-x-1 gap-y-3 text-center" style="grid-template-columns:42px repeat(3,minmax(0,1fr))"><span class="text-left">时间</span><span>床位 1</span><span>床位 2</span><span>床位 3</span><div class="relative h-60 text-left text-[11px] text-gray-400">${[540,600,660,720,780,840].map(time => `<span class="absolute left-0 -translate-y-1/2" style="top:${(time - 540) / 3}%">${format(time)}</span>`).join('')}</div>${['1','2','3'].map(bedId => `<div class="relative h-60 bg-gray-50">${all.filter(item => item.bedId === bedId).map(item => `<div data-example-customer="${item.id}" class="absolute inset-x-0 flex flex-col items-center justify-center gap-1 px-1 ${bedId === '3' ? 'bg-blue-100 text-blue-700' : 'bg-slate-200/70 text-gray-600'}" style="top:${(item.start-540)/3}%;height:${(item.end-item.start)/3}%"><span class="font-semibold">${item.id.toUpperCase()} · ${item.guest === 'new' ? '新客' : '老客'}</span><span>${format(item.start)}</span><span>至 ${format(item.end)}</span></div>`).join('')}</div>`).join('')}</div>`;
      return `<p>假设同一类型有 3 张床位，新老客合计最多接待 2 人，每位服务 2 小时。</p>
        <p>A 约 9:00—11:00，B 约 10:00—12:00，床位 3 空闲，且没有其他预约。</p>
        <div role="group" aria-label="切换预约示例" class="bg-blue-50 rounded-xl p-1 space-y-1 border border-blue-100">
          ${[0, 30].map(minutes => {
            const selected = minutes === advanceMinutes;
            return `<button id="capacity-example-option-${minutes}" type="button" aria-pressed="${selected}" aria-controls="capacity-example-board" onclick="selectCapacityExample(${minutes})" class="w-full min-h-[44px] flex items-center justify-between gap-2 px-2 py-2 rounded-lg text-[13px] text-left transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 ${selected ? 'bg-blue-100/70 text-blue-700 ring-1 ring-inset ring-blue-300' : 'text-gray-600 active:bg-blue-100/50'}">
              <span class="flex items-center gap-2"><span aria-hidden="true" class="w-4 h-4 rounded-full border flex items-center justify-center shrink-0 ${selected ? 'border-blue-600 bg-blue-600' : 'border-gray-300 bg-white'}">${selected ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>' : ''}</span><span>${minutes ? '提前 30 分钟' : '不提前'}</span></span>
              <span class="shrink-0">C 最早可约 <strong>${format(minutes ? advanceStart : regularStart)}</strong></span>
            </button>`;
          }).join('')}
        </div>
        <p class="text-xs text-gray-400">下图为${advanceMinutes ? '允许提前 30 分钟' : '不提前'}时的排客安排</p>
        ${board}
        <p>${advanceMinutes ? 'A 的接待名额在 10:30 释放，C 可安排到空闲的床位 3；床位 1 仍由 A 使用至 11:00。' : 'A 在 11:00 做完后，C 才能开始服务，安排在床位 3，服务至 13:00。'}</p>`;
    }

    function selectCapacityExample(advanceMinutes) {
      if (![0, 30].includes(advanceMinutes)) return;
      const example = document.getElementById('capacity-example');
      if (!example) return;
      const content = document.getElementById('confirm-content');
      const scrollTop = content.scrollTop;
      // 仅切换说明中的演示，不改动设置草稿，并保持当前阅读位置。
      example.innerHTML = capacityExampleContent(advanceMinutes);
      content.scrollTop = scrollTop;
      document.getElementById(`capacity-example-option-${advanceMinutes}`).focus({ preventScroll: true });
    }

    // 获取当前活动 Tab 的配置对象
    function getActiveGuestData() {
      return configState.currentTab === 'new' ? configState.newGuest : configState.oldGuest;
    }

    // 切换接待时长间隔函数
    function selectInterval(minutes) {
      if (![60, 90].includes(minutes)) return;
      intervalDraft = minutes;
      [60, 90].forEach(value => {
        const button = document.getElementById(`btn-interval-${value}`);
        button.setAttribute('aria-pressed', String(value === minutes));
        button.className = 'min-h-[44px] px-0.5 text-xs font-semibold';
        button.innerHTML = `<span class="block rounded-full px-2 py-1.5 ${value === minutes ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-500'}">${value}分钟</span>`;
      });
    }

    // 渲染日期网格
    function renderDateGrid() {
      const grid = document.getElementById('date-grid');
      grid.innerHTML = '';
      if (singleDateId !== null) {
        updateBedConfigState();
        return;
      }
      datesData.forEach(item => {
        const isSelected = configState.selectedDates.includes(item.id);
        const cardClass = isSelected 
          ? 'bg-blue-50 border-2 border-blue-600 text-blue-900 shadow-xs scale-[0.98]' 
          : 'bg-white border border-gray-200 text-gray-700 hover:border-gray-300';
        const badgeColor = isSelected ? 'bg-blue-200/60 text-blue-700' : 'bg-gray-100 text-gray-500';

        grid.innerHTML += `
          <button type="button" aria-pressed="${isSelected}" onclick="toggleDateSelect(${item.id})" class="${cardClass} rounded-xl p-2.5 text-center cursor-pointer transition-all duration-150 relative flex flex-col justify-between h-18 select-none">
            ${isSelected ? `
              <span class="absolute top-1 right-1 w-3.5 h-3.5 bg-blue-600 rounded-full flex items-center justify-center text-white">
                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
              </span>
            ` : ''}
            <div>
              <span class="block text-[13px] font-bold ${isSelected ? 'text-blue-700' : 'text-gray-800'}">${item.dateStr}</span>
              <span class="block text-[10px] text-gray-400 font-medium">${item.weekday}</span>
            </div>
            ${item.hasConfig ? `
              <span class="mt-1 text-[9px] px-1 py-0.5 rounded-sm scale-90 origin-center block truncate font-medium ${badgeColor}">${item.badgeText}</span>
            ` : `
              <span class="mt-1 text-[9px] text-gray-300 scale-90 block">未配置</span>
            `}
          </button>
        `;
      });
      document.getElementById('selected-count-badge').innerText = `已选 ${configState.selectedDates.length} 天`;
      updateBedConfigState();
    }

    function updateBedConfigState() {
      const headerContainer = document.getElementById('bed-config-header');
      const contentWrapper = document.getElementById('bed-config-content-wrapper');
      const selectedCount = configState.selectedDates.length;
      if (selectedCount > 0) {
        const selectedDay = datesData[configState.selectedDates[0]];
        const title = singleDateId !== null
          ? `${selectedDay.dateStr} ${selectedDay.weekday} · 床位设置`
          : selectedCount === 1 ? `2. 设置 ${selectedDay.dateStr} 的床位数` : `2. 设置这 <span class="text-blue-600 font-extrabold px-1 text-lg">${selectedCount}</span> 天的床位数`;
        const detail = singleDateId !== null ? '修改仅对当天生效' : selectedCount === 1
          ? (sourceDateId === selectedDay.id ? '已带入当天保存的完整配置，可直接增减' : '当前填写将保存到所选日期')
          : '';
        headerContainer.innerHTML = `<div class="flex items-center space-x-1.5"><span class="w-1.5 h-4 bg-blue-600 rounded-full"></span><h2 class="text-base font-bold text-gray-800">${title}</h2></div>${detail ? `<p class="text-xs text-blue-500 font-medium mt-1">${detail}</p>` : ''}`;
        contentWrapper.style.opacity = '1';
        contentWrapper.style.pointerEvents = 'auto';
      } else {
        headerContainer.innerHTML = '<div class="flex items-center space-x-2"><span class="w-1.5 h-4 bg-gray-300 rounded-full"></span><h2 class="text-base font-bold text-gray-400">2. 配置接待床位数</h2></div><p class="text-xs text-amber-500 font-semibold mt-1.5 bg-amber-50 border border-amber-100 p-2 rounded-xl">提示：请先在上方点击日期或“一键选未来15天”</p>';
        contentWrapper.style.opacity = '0.35';
        contentWrapper.style.pointerEvents = 'none';
      }
      if (currentView === 'settings') document.getElementById('primary-label').innerText = selectedCount === 1 ? `保存 ${datesData[configState.selectedDates[0]].dateStr} 的配置` : selectedCount > 1 ? `保存 ${selectedCount} 天的配置` : '保存配置';
    }

    function toggleDateSelect(id) {
      if (singleDateId !== null) return;
      const changed = hasDraftChanges();
      const index = configState.selectedDates.indexOf(id);
      if (index > -1) configState.selectedDates.splice(index, 1);
      else configState.selectedDates.push(id);
      configState.selectedDates.sort((a, b) => a - b);
      // 仅选中一天且尚未改动表单时，直接读取这一天的完整配置。
      if (configState.selectedDates.length === 1 && !changed) {
        const day = datesData[configState.selectedDates[0]];
        applySnapshot(day.config || defaultSnapshot);
        sourceDateId = day.hasConfig ? day.id : null;
        draftBaseline = JSON.stringify(currentSnapshot());
      }
      renderDateGrid();
    }

    function selectQuickDays(days) {
      if (singleDateId !== null) return;
      configState.selectedDates = [];
      for(let i = 0; i < days; i++) {
        configState.selectedDates.push(i);
      }
      renderDateGrid();
      showToast('success', `已为您一键选定未来 ${days} 天`);
    }

    function clearDateSelection() {
      if (singleDateId !== null) return;
      configState.selectedDates = [];
      renderDateGrid();
      showToast('info', '已清除日期选择');
    }

    function switchGuestTab(type) {
      configState.currentTab = type;
      const tabNew = document.getElementById('tab-new');
      const tabOld = document.getElementById('tab-old');
      
      if (type === 'new') {
        tabNew.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg transition-all text-blue-600 bg-white shadow-sm';
        tabOld.className = 'flex-1 py-2.5 text-sm font-medium rounded-lg transition-all text-gray-500 hover:text-gray-800';
        document.getElementById('total-bed-title').innerText = '新客总接待上限';
      } else {
        tabOld.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg transition-all text-blue-600 bg-white shadow-sm';
        tabNew.className = 'flex-1 py-2.5 text-sm font-medium rounded-lg transition-all text-gray-500 hover:text-gray-800';
        document.getElementById('total-bed-title').innerText = '老客总接待上限';
      }

      const activeData = type === 'new' ? configState.newGuest : configState.oldGuest;
      document.getElementById('total-bed-value').innerText = activeData.totalLimit;
      
      syncDeptUI(activeData);
    }

    // ================== 科室品类配置逻辑 ==================
    function syncDeptUI(guestData) {
      const toggle = document.getElementById('dept-toggle');
      const dot = document.getElementById('dept-toggle-dot');
      const panel = document.getElementById('dept-config-panel');
      setVisibility('add-department-button', guestData.useDeptConfig);

      if (guestData.useDeptConfig) {
        toggle.className = 'w-12 h-6 shrink-0 rounded-full transition-colors duration-200 ease-in-out relative focus:outline-none bg-blue-600';
        dot.className = 'translate-x-7 ease-in-out duration-200 block w-4 h-4 rounded-full bg-white shadow transform ring-0 transition';
        panel.classList.remove('hidden');
        renderActiveDepartments(guestData);
      } else {
        toggle.className = 'w-12 h-6 shrink-0 rounded-full transition-colors duration-200 ease-in-out relative focus:outline-none bg-gray-200';
        dot.className = 'translate-x-1 ease-in-out duration-200 block w-4 h-4 rounded-full bg-white shadow transform ring-0 transition';
        panel.classList.add('hidden');
      }
    }

    function renderActiveDepartments(guestData) {
      const container = document.getElementById('active-depts-list');
      container.innerHTML = '';

      if (guestData.activeDepts.length === 0) {
        container.innerHTML = `
          <div class="py-8 text-center text-xs text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-200 flex flex-col items-center justify-center">
            <svg class="w-8 h-8 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
            <p>暂无专属科室品类</p>
            <p class="mt-1">所有预约将共享通用床位</p>
          </div>
        `;
        calculateUniversalBed(guestData);
        return;
      }

      guestData.activeDepts.forEach((key, index) => {
        const deptInfo = allBedCategories[key];
        const val = guestData.deptValues[key] !== undefined ? guestData.deptValues[key] : 0;
        const isZero = val === 0;

        const availableOptions = Object.keys(allBedCategories).filter(k => !guestData.activeDepts.includes(k) || k === key);
        const optionsHtml = availableOptions.map(k => `<option value="${k}" ${k === key ? 'selected' : ''}>${allBedCategories[k].name}</option>`).join('');
        const cardBgClass = 'bg-white border border-gray-200';
        
        container.innerHTML += `
          <div class="p-3.5 rounded-2xl transition-all duration-200 ${cardBgClass} space-y-3">
            <div class="flex items-center justify-between">
              <div class="relative w-[130px]">
                <select onchange="changeDepartment(${index}, this)" class="block w-full pl-3 pr-8 py-2 text-[13px] font-bold text-gray-800 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 shadow-sm cursor-pointer">
                  ${optionsHtml}
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                </div>
              </div>

              <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 bg-gray-50 px-2 py-1.5 rounded-xl border border-gray-200 shadow-2xs">
                  <button onclick="adjustDeptBed('${key}', -1)" class="w-6 h-6 rounded-md bg-white hover:bg-gray-100 flex items-center justify-center text-gray-500 active:scale-90 transition-all border border-gray-200">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4" /></svg>
                  </button>
                  <span class="text-sm font-extrabold w-6 text-center transition-all duration-150 text-gray-800">${val}</span>
                  <button onclick="adjustDeptBed('${key}', 1)" class="w-6 h-6 rounded-md bg-white hover:bg-gray-100 flex items-center justify-center text-gray-500 active:scale-90 transition-all border border-gray-200">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                  </button>
                </div>
                
                <button onclick="removeDepartment(${index})" class="text-gray-300 hover:text-red-500 transition-colors p-1 active:scale-90">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>

            <div class="text-[11px] leading-relaxed pl-0.5">
              <p class="text-gray-400">${deptInfo.desc}</p>
            </div>
          </div>
        `;
      });

      calculateUniversalBed(guestData);
    }

    function addDepartment() {
      const activeData = getActiveGuestData();
      const availableKey = Object.keys(allBedCategories).find(k => !activeData.activeDepts.includes(k));
      if (!availableKey) {
        showToast('info', '已添加所有可用分类！');
        return;
      }
      activeData.activeDepts.push(availableKey);
      if (activeData.deptValues[availableKey] === undefined) {
        activeData.deptValues[availableKey] = 0;
      }
      renderActiveDepartments(activeData);
    }

    function removeDepartment(index) {
      const activeData = getActiveGuestData();
      activeData.activeDepts.splice(index, 1);
      renderActiveDepartments(activeData);
    }

    function changeDepartment(index, selectElement) {
      const newKey = selectElement.value;
      const activeData = getActiveGuestData();
      const oldKey = activeData.activeDepts[index];
      if (oldKey === newKey) return;
      if (activeData.deptValues[newKey] === undefined) {
        activeData.deptValues[newKey] = 0;
      }
      activeData.activeDepts[index] = newKey;
      renderActiveDepartments(activeData);
    }

    function calculateUniversalBed(guestData) {
      let allocatedSum = 0;
      guestData.activeDepts.forEach(key => {
        allocatedSum += (guestData.deptValues[key] || 0);
      });
      let universalValue = guestData.totalLimit - allocatedSum;
      if (universalValue < 0) {
        guestData.totalLimit = allocatedSum; 
        document.getElementById('total-bed-value').innerText = allocatedSum;
        universalValue = 0;
        showToast('info', '各品类分配已占满，总床位数已自动调大');
      }
      document.getElementById('universal-bed-value').innerText = universalValue;
    }

    function toggleDepartmentConfig() {
      const activeData = getActiveGuestData();
      activeData.useDeptConfig = !activeData.useDeptConfig;
      syncDeptUI(activeData);
    }

    function adjustTotalBed(amount) {
      const activeData = getActiveGuestData();
      let currentVal = activeData.totalLimit;
      currentVal += amount;
      if (currentVal < 0) currentVal = 0;
      if (activeData.useDeptConfig) {
        let allocatedSum = 0;
        activeData.activeDepts.forEach(key => {
          allocatedSum += (activeData.deptValues[key] || 0);
        });
        if (currentVal < allocatedSum) {
          showToast('error', `总床位数不能少于已分品类数总和 (${allocatedSum}张)`);
          return;
        }
      }
      activeData.totalLimit = currentVal;
      document.getElementById('total-bed-value').innerText = currentVal;
      if (activeData.useDeptConfig) {
        calculateUniversalBed(activeData);
      }
    }

    function adjustDeptBed(key, amount) {
      const activeData = getActiveGuestData();
      let val = activeData.deptValues[key] || 0;
      val += amount;
      if (val < 0) val = 0;
      activeData.deptValues[key] = val;
      renderActiveDepartments(activeData);
    }

    // ================== 重置与保存逻辑 ==================
    function resetCurrentConfig() {
      const guestKey = configState.currentTab === 'new' ? 'newGuest' : 'oldGuest';
      configState[guestKey] = bedGuestSnapshot(defaultSnapshot[guestKey]);
      switchGuestTab(configState.currentTab);
      showToast('info', '已重置当前床位配置');
    }

    function resetAll() {
      sourceDateId = null;
      configState.selectedDates = singleDateId === null ? [] : [singleDateId];
      configState.currentTab = 'new';
      applySnapshot(defaultSnapshot);
      renderDateGrid();
      showToast('info', '本次床位配置已重置');
    }

    function showToast(type, text) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');

      toastText.innerText = text;

      if (type === 'success') {
        toastIcon.innerHTML = `
          <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        `;
      } else if (type === 'error') {
        toastIcon.innerHTML = `
          <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        `;
      } else {
        toastIcon.innerHTML = `
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        `;
      }

      toast.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
      toast.classList.add('opacity-100', 'scale-100');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'scale-100');
      }, 2200);
    }

    function saveReceptionConfig() {
      if (!configState.selectedDates.length) {
        showToast('error', '请先在上方勾选生效日期！');
        return;
      }
      const snapshot = currentSnapshot();
      if (!validSnapshot(snapshot)) {
        showToast('error', '请检查新客、老客的总床位数与专属分配');
        return;
      }
      const ids = [...configState.selectedDates];
      const overwriteCount = ids.filter(id => datesData[id].hasConfig).length;
      const commit = () => {
        ids.forEach(id => { scheduleStore.days[datesData[id].key] = copy(snapshot); });
        const persisted = persistSchedule();
        syncDateData();
        showOverview();
        showToast(persisted ? 'success' : 'info', persisted ? `已保存 ${ids.length} 天的完整配置` : '已在本页保存，浏览器未能持久保存');
      };
      if (ids.length > 1 && overwriteCount) {
        const dates = ids.map(id => `<span class="bg-gray-50 px-2 py-1 rounded-lg border border-gray-200">${datesData[id].dateStr}</span>`).join('');
        showConfirmation('确认批量保存', `<p>将统一设置以下 <strong>${ids.length}</strong> 天，其中 <strong>${overwriteCount}</strong> 天已有配置。</p><div class="flex flex-wrap gap-2">${dates}</div><div class="bg-blue-50/50 border border-blue-100 rounded-xl p-3 space-y-2"><p class="text-gray-700 font-semibold">新客 ${snapshot.newGuest.totalLimit} 张 · 老客 ${snapshot.oldGuest.totalLimit} 张</p><p>新客：${guestSummary(snapshot.newGuest).join(' · ')}</p><p>老客：${guestSummary(snapshot.oldGuest).join(' · ')}</p></div><p>这些日期的新老客床位与专属分配将按本次填写统一更新。</p>`, commit, '确认保存');
      } else commit();
    }

    window.onload = function() {
      syncDateData();
      showOverview();
    };
