<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>设定本月目标</title>
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <style>
    .goal-page {
      padding-bottom: calc(150px + var(--safe-area-bottom));
    }

    .back-link {
      display: inline-flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      color: var(--color-text);
      font-size: 24px;
      line-height: 1;
    }

    .goal-hero {
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-6) var(--space-4);
      text-align: center;
    }

    .goal-hero__hint {
      color: var(--color-text-secondary);
      font-size: var(--font-size-helper);
    }

    .goal-amount {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--color-text);
      font-size: 38px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      line-height: 1.1;
    }

    .preset-list {
      display: flex;
      width: 100%;
      gap: var(--space-2);
    }

    .preset-chip {
      flex: 1 1 0;
      min-height: 36px;
      padding: 0 var(--space-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: var(--font-size-helper);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }

    .preset-chip.is-active {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
      color: var(--color-primary);
    }

    .suggestion {
      color: var(--color-text-secondary);
      font-size: var(--font-size-helper);
      line-height: 1.45;
    }

    .indicator-card {
      gap: var(--space-4);
    }

    .indicator-card__top,
    .indicator-card__value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .indicator-card__name {
      color: var(--color-text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-bold);
    }

    .indicator-value {
      color: var(--color-text);
      font-size: 24px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      line-height: 1.1;
    }

    .indicator-contribution {
      color: var(--color-text-secondary);
      font-size: var(--font-size-helper);
      white-space: nowrap;
    }

    .range-wrap {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .goal-range {
      width: 100%;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: var(--radius-full);
      background: transparent;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .goal-range::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--range-bg, #e5e7eb);
    }

    .goal-range::-moz-range-track {
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--range-bg, #e5e7eb);
    }

    .goal-range::-webkit-slider-thumb {
      width: 24px;
      height: 24px;
      margin-top: -8px;
      border: 2px solid #fff;
      border-radius: var(--radius-full);
      background: #fff;
      box-shadow: 0 4px 12px rgb(17 24 39 / 22%);
      appearance: none;
      -webkit-appearance: none;
    }

    .goal-range::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: var(--radius-full);
      background: #fff;
      box-shadow: 0 4px 12px rgb(17 24 39 / 22%);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: var(--color-text-muted);
      font-size: var(--font-size-badge);
      line-height: 1.2;
    }

    .goal-summary {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 95;
      width: 100%;
      max-width: var(--app-max-width);
      margin: 0 auto;
      padding: var(--space-4) var(--space-4) calc(var(--space-4) + var(--safe-area-bottom));
      background: rgb(255 255 255 / 96%);
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -12px 28px rgb(17 24 39 / 8%);
      backdrop-filter: blur(14px);
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }

    .summary-label {
      color: var(--color-text-secondary);
      font-size: var(--font-size-helper);
    }

    .summary-value {
      color: var(--color-text);
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .summary-diff {
      min-height: 20px;
      margin-bottom: var(--space-3);
      color: var(--color-text-muted);
      font-size: var(--font-size-helper);
      line-height: 1.4;
    }

    .summary-diff.is-positive {
      color: var(--color-success);
    }

    .summary-diff.is-negative {
      color: var(--color-danger);
    }

    .summary-note {
      margin-top: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--font-size-helper);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="top-bar__left">
        <a class="back-link" href="index.html" aria-label="返回首页">‹</a>
        <h1 class="top-bar__title">设定本月目标</h1>
      </div>
    </header>

    <main class="app-page app-page--with-top-bar goal-page">
      <div class="app-content">
        <section class="card goal-hero">
          <p class="goal-hero__hint">你希望这个月赚多少？</p>
          <button class="goal-amount" type="button" id="targetAmount" aria-label="编辑收入目标">¥50,000</button>
          <div class="preset-list" aria-label="快捷目标">
            <button class="preset-chip" type="button" data-preset="35000">稳妥 ¥35,000</button>
            <button class="preset-chip is-active" type="button" data-preset="50000">挑战 ¥50,000</button>
            <button class="preset-chip" type="button" data-preset="68000">冲刺 ¥68,000</button>
          </div>
          <p class="suggestion">基于门店近3月数据，建议区间 ¥42,000 ~ ¥58,000</p>
        </section>

        <section class="page-section">
          <div class="section-title">
            <h2 class="section-title__main">业绩指标拆解</h2>
          </div>
          <div class="stack gap-3" id="indicatorList"></div>
        </section>
      </div>
    </main>

    <footer class="goal-summary">
      <div class="summary-row">
        <span class="summary-label">当前指标对应预估收入</span>
        <span class="summary-value" id="estimatedIncome">¥50,000</span>
      </div>
      <p class="summary-diff" id="incomeDiff">已匹配目标收入</p>
      <button class="btn btn--primary btn--lg btn--block" type="button" id="confirmGoal">确认目标，开始冲刺</button>
      <p class="summary-note">目标可在月中随时调整</p>
    </footer>
  </div>

  <script src="../shared/js/app.js"></script>
  <script src="../shared/js/components.js"></script>
  <script src="../shared/js/charts.js"></script>
  <script>
    (function () {
      var baseIncome = 50000;
      var targetIncome = 50000;
      var metrics = [
        { id: "medical", name: "医美业绩", unit: "currency", base: 900000, low: 600000, high: 1020000, difficulty: "中等↑15%", level: "warning", contribution: 18000 },
        { id: "care", name: "基础护理业绩", unit: "currency", base: 280000, low: 180000, high: 330000, difficulty: "低↑5%", level: "success", contribution: 8400 },
        { id: "newcomer", name: "新客转化人数", unit: "people", base: 42, low: 24, high: 50, difficulty: "高↑22%", level: "danger", contribution: 10500 },
        { id: "repurchase", name: "老客复购金额", unit: "currency", base: 450000, low: 300000, high: 520000, difficulty: "中等↑12%", level: "warning", contribution: 9000 },
        { id: "product", name: "自营产品业绩", unit: "currency", base: 85000, low: 55000, high: 104000, difficulty: "低↑3%", level: "success", contribution: 4100 }
      ].map(function (metric) {
        metric.value = metric.base;
        metric.max = Math.round(metric.high * 1.3);
        return metric;
      });

      function money(value) {
        return "¥" + BeautyApp.formatNumber(Math.round(value));
      }

      function formatMetric(metric, value) {
        if (metric.unit === "people") return Math.round(value) + "人";
        return money(value);
      }

      function currentContribution(metric) {
        return metric.contribution * (metric.value / metric.base);
      }

      function totalIncome() {
        return metrics.reduce(function (sum, metric) {
          return sum + currentContribution(metric);
        }, 0);
      }

      function rangePercent(input) {
        return ((Number(input.value) - Number(input.min)) / (Number(input.max) - Number(input.min))) * 100;
      }

      function paintRange(input) {
        var percent = BeautyApp.clamp(rangePercent(input), 0, 100);
        input.style.setProperty("--range-bg", "linear-gradient(90deg, #4F46E5 0%, #7C3AED " + percent + "%, #E5E7EB " + percent + "%, #E5E7EB 100%)");
      }

      function renderMetrics() {
        var list = document.getElementById("indicatorList");
        list.innerHTML = metrics.map(function (metric) {
          return [
            '<article class="card indicator-card" data-metric-card="' + metric.id + '">',
            '<div class="indicator-card__top">',
            '<h3 class="indicator-card__name">' + metric.name + "</h3>",
            '<span class="badge badge--' + metric.level + '">' + metric.difficulty + "</span>",
            "</div>",
            '<div class="indicator-card__value-row">',
            '<span class="indicator-value" data-metric-value="' + metric.id + '">' + formatMetric(metric, metric.value) + "</span>",
            '<span class="indicator-contribution" data-metric-contribution="' + metric.id + '">贡献约 ' + money(currentContribution(metric)) + "</span>",
            "</div>",
            '<div class="range-wrap">',
            '<input class="goal-range" type="range" min="' + metric.low + '" max="' + metric.max + '" step="' + (metric.unit === "people" ? 1 : 1000) + '" value="' + metric.value + '" data-metric-slider="' + metric.id + '">',
            '<div class="range-labels"><span>' + formatMetric(metric, metric.low) + "</span><span>" + formatMetric(metric, metric.max) + "</span></div>",
            "</div>",
            "</article>"
          ].join("");
        }).join("");

        document.querySelectorAll(".goal-range").forEach(paintRange);
      }

      function syncMetricDisplay(metric) {
        var valueNode = document.querySelector('[data-metric-value="' + metric.id + '"]');
        var contributionNode = document.querySelector('[data-metric-contribution="' + metric.id + '"]');
        var slider = document.querySelector('[data-metric-slider="' + metric.id + '"]');
        if (valueNode) valueNode.textContent = formatMetric(metric, metric.value);
        if (contributionNode) contributionNode.textContent = "贡献约 " + money(currentContribution(metric));
        if (slider) {
          slider.value = metric.value;
          paintRange(slider);
        }
      }

      function syncAllDisplays() {
        metrics.forEach(syncMetricDisplay);
        document.getElementById("targetAmount").textContent = money(targetIncome);

        var total = Math.round(totalIncome());
        var diff = total - targetIncome;
        var diffNode = document.getElementById("incomeDiff");
        document.getElementById("estimatedIncome").textContent = money(total);

        diffNode.classList.remove("is-positive", "is-negative");
        if (Math.abs(diff) < 300) {
          diffNode.textContent = "已匹配目标收入";
        } else if (diff > 0) {
          diffNode.textContent = "预计高出目标 " + money(diff);
          diffNode.classList.add("is-positive");
        } else {
          diffNode.textContent = "距离目标还差 " + money(Math.abs(diff));
          diffNode.classList.add("is-negative");
        }

        document.querySelectorAll("[data-preset]").forEach(function (button) {
          button.classList.toggle("is-active", Number(button.dataset.preset) === targetIncome);
        });
      }

      function setTarget(nextTarget) {
        targetIncome = Math.max(10000, Math.round(nextTarget / 100) * 100);
        var ratio = targetIncome / baseIncome;
        metrics.forEach(function (metric) {
          var nextValue = Math.round(metric.base * ratio);
          if (metric.unit !== "people") nextValue = Math.round(nextValue / 1000) * 1000;
          metric.value = BeautyApp.clamp(nextValue, metric.low, metric.max);
        });
        syncAllDisplays();
      }

      function bindEvents() {
        document.addEventListener("input", function (event) {
          var slider = event.target.closest("[data-metric-slider]");
          if (!slider) return;

          var metric = metrics.find(function (item) {
            return item.id === slider.dataset.metricSlider;
          });
          if (!metric) return;

          metric.value = Number(slider.value);
          syncMetricDisplay(metric);
          syncAllDisplays();
        });

        document.addEventListener("click", function (event) {
          var preset = event.target.closest("[data-preset]");
          if (preset) {
            setTarget(Number(preset.dataset.preset));
            return;
          }

          if (event.target.closest("#targetAmount")) {
            var input = window.prompt("输入本月目标收入", String(targetIncome));
            if (input == null) return;
            var parsed = BeautyApp.toNumber(input, targetIncome);
            if (parsed > 0) setTarget(parsed);
            return;
          }

          if (event.target.closest("#confirmGoal")) {
            showToast("目标已设定！", "success", 1200);
            window.setTimeout(function () {
              window.location.href = "index.html";
            }, 500);
          }
        });
      }

      BeautyApp.ready(function () {
        renderMetrics();
        bindEvents();
        syncAllDisplays();
      });
    })();
  </script>
</body>
</html>
