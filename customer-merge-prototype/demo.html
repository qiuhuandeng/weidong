<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户档案合并 · 原型演示入口</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f7fb}.demo{max-width:1180px;margin:auto;padding:42px 24px}.demo h1{font-size:30px}.demo .intro{margin:10px 0 28px;color:#64748b}.ports{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.port{padding:22px;background:white;border:1px solid #e4e9f1;border-radius:10px}.port h2{margin-bottom:8px}.port p{font-size:12px;color:#64748b;min-height:44px}.port select{width:100%;margin:14px 0}.port a{display:flex}.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.scenario{background:white;border:1px solid #e4e9f1;border-radius:10px;padding:18px}.scenario h3{font-size:15px;margin:8px 0}.scenario p{font-size:12px;color:#64748b;min-height:45px;margin-bottom:16px}.scenario .btn{font-size:12px}details{background:white;border:1px solid #e4e9f1;border-radius:9px;padding:16px;margin:12px 0}summary{cursor:pointer;font-weight:600}.map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.map a{font-size:12px;padding:8px;background:#f7f9fd;border-radius:5px}.section-heading{margin:32px 0 16px;font-size:20px}@media(max-width:750px){.ports,.scenarios{grid-template-columns:1fr 1fr}.demo{padding:25px 16px}.demo h1{font-size:25px}.map{grid-template-columns:1fr}}@media(max-width:450px){.ports,.scenarios{grid-template-columns:1fr}}</style></head><body><main class="demo"><span class="eyebrow">WEIDONG · INTERACTIVE PROTOTYPE</span><h1>客户档案合并与纠错</h1><p class="intro">4 个端口 · 64 个页面视图 · 24 类浮层 · 22 个业务场景</p><div class="hint">功能演示模式：表单可留空提交，自动使用示例数据；全部操作开放，无需切换角色或逐级审批。</div><div class="ports" id="ports"></div><div class="row spread"><h2 class="section-heading">业务场景演示</h2><button class="btn danger" id="reset">重置全部演示数据</button></div><p class="muted small mb">“载入场景”会重置演示数据。进入后可连续走完流程，未填写的内容自动采用示例。</p><div class="scenarios" id="scenarios"></div><h2 class="section-heading">完整页面地图</h2><div id="map"></div><p class="muted small mt">边界：本地模拟数据与附件，不连接生产数据库、微信、短信或真实财务账套。审批模块通过业务入口对接，集团审批原有数据与管理员身份保持独立。</p><p class="mt"><a href="../index.html#customer-merge" target="_blank" rel="noopener">返回系统首页 · 数据中台</a></p></main><script src="page-manifest.js"></script><script src="seed.js"></script><script src="scenarios.js"></script><script>
const key='weidong.customer-merge.v1',actors=CMSeed.create().actors,ports=[['pc','总部 PC','合并、纠错、财务与规则配置','P-MG-01',['ops','finance','admin']],['store','门店手机工作台','开单、申请与纠错协作','E-MB-06',['advisor','manager','manager2']],['approval','移动审批','一键审批与调整单确认','E-AP-01',['manager','manager2','ops','finance']],['client','客户小程序','本人授权、会员与服务订单','C-WX-03',['client']]];
document.getElementById('ports').innerHTML=ports.map(([port,title,desc,page])=>'<section class="port"><h2>'+title+'</h2><p>'+desc+'</p><a class="btn primary" target="_blank" rel="noopener" id="link-'+port+'" href="'+port+'.html#'+page+'">打开'+title+'</a></section>').join('');
document.getElementById('scenarios').innerHTML=CMScenarios.list.map(s=>'<article class="scenario"><span class="pill blue">'+s.id+'</span><h3>'+s.title+'</h3><p>'+s.description+'</p><button class="btn" data-scenario="'+s.id+'">载入场景并开始 →</button></article>').join('');
function write(state){let old;try{old=JSON.parse(localStorage.getItem(key))}catch{}state.revision=(old?.revision||0)+1;localStorage.setItem(key,JSON.stringify(state))}
document.querySelectorAll('[data-scenario]').forEach(x=>x.onclick=()=>{const scenario=CMScenarios.list.find(s=>s.id===x.dataset.scenario);const {state,record}=CMScenarios.create(scenario.id);write(state);window.open(scenario.port+'.html#'+scenario.page+(record?'?id='+record:''),'_blank','noopener')});
document.getElementById('reset').onclick=()=>{if(confirm('重置本原型演示数据及附件？不会影响其他模块。')){write(CMSeed.create());alert('已恢复默认演示数据')}};
document.getElementById('map').innerHTML=ports.map(([port,title,,_,ids])=>'<details><summary>'+title+' · '+CMPages.filter(p=>p.port===port).length+' 页</summary><div class="map">'+CMPages.filter(p=>p.port===port).map(p=>'<a target="_blank" rel="noopener" href="'+port+'.html?actor='+ids[0]+'#'+p.id+'">'+p.id+'　'+p.title+'</a>').join('')+'</div></details>').join('');
</script></body></html>
