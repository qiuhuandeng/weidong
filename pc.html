/* Canonical backend UI: this archive merge page is the shared standard. */
:root{--blue:#1677ff;--blue-hover:#0958d9;--blue-light:#e6f4ff;--ink:#1a2332;--muted:#8c9bab;--line:#e8edf2;--bg:#f0f2f5;--green:#389e0d;--orange:#d48806;--red:#ff4d4f;--radius:8px;--shadow:none}

 }else add('线上订单，双方均无预约金',unpaid,arbLegacyAction(A[3]));
 add('主订单在线上，子订单已超时',[c('main.stage','eq','线上'),c('child.status','eq','已超时')],arbLegacyAction(B[1]));
 add('主已到店，子线上订单有预约金',[c('main.status','eq','已到店'),c('child.stage','eq','线上'),c('child.deposit','gt',0)],arbLegacyAction(C[0]));
 add('主已到店，子线上订单无预约金',[c('main.status','eq','已到店'),c('child.stage','eq','线上'),c('child.deposit','eq',0)],arbLegacyAction(C[1]));

function mrInterceptionDetails(pair,plan,rule){let main=pair.find(c=>c.id===plan.mainId)||pair[0],children=pair.filter(c=>c.id!==main.id),rows=[];for(let r of rule.config.intercept.filter(x=>x.on)){if(r.field==='手机号关联客户数'){let phones=new Map();pair.forEach(c=>[...new Set([c.phone,c.oldPhone,...(c.phones||[])].filter(Boolean))].forEach(p=>phones.set(p,[...(phones.get(p)||[]),c.id])));let n=Math.max(0,...pair.map(c=>c.linkedPhoneCount||0),...[...phones.values()].map(a=>a.length));if(n>=Number(r.value))rows.push({rule:r.name,reason:r.reason||r.name,customerIds:pair.map(c=>c.id),value:n+' 个客户关联手机号'});continue}for(let child of children){let hit=r.field==='白条余额'?child.white!==0:r.field==='充值记录'?child.recharge>0||child.rechargeAt&&mrTime(mrAddMonths(child.rechargeAt,r.value))>=Date.now():r.field==='已完成订单数'?child.orders.some(o=>o.status==='已完成'):r.field==='进行中投诉数'?child.complaint>0:r.field==='进行中售后/申述工单数'?child.aftersale>0:r.field==='进行中订单状态'?child.orders.some(o=>o.status==='已到店'):false;if(hit)rows.push({rule:r.name,reason:r.reason||r.name,customerIds:[child.id],value:r.field==='白条余额'?money(child.white):r.field==='充值记录'?money(child.recharge):'命中'})}}return rows}

 push('标签与培养标签','tags',2);push('通话记录','calls',3);push('售后 / 申述工单','tickets',4);push('到店签到','checkins',5);push('影像记录','images',6);

 document.querySelectorAll('#nav .nav-group').forEach(group=>{let expanded=sidebarPreferences.groups[group.dataset.navGroup]===true;group.querySelector('.nav-group-toggle').setAttribute('aria-expanded',String(expanded));group.querySelector('.nav-group-items').hidden=!expanded});
 const control=$('.mobile-toggle'),expanded=innerWidth<=760?$('#sidebar').classList.contains('open'):!compact;
 control.setAttribute('aria-expanded',String(expanded));control.setAttribute('aria-controls','sidebar');control.setAttribute('aria-label',expanded?'收起左侧菜单':'展开左侧菜单');control.title=expanded?'收起左侧菜单':'展开左侧菜单';
 control.innerHTML='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3z M9 4v16 '+(expanded?'m16 9-3 3 3 3':'m13 9 3 3-3 3')+'"/></svg>';
}
function toggleNavGroup(name){sidebarPreferences.groups[name]=!sidebarPreferences.groups[name];saveSidebarPreferences();syncSidebarControls()}
function mountSidebarGroups(){
 const navRoot=$('#nav'),children=Array.from(navRoot.children),groups=[];let current=null;
 children.forEach(child=>{if(child.classList.contains('nav-label')){current={name:child.textContent.trim(),items:[]};groups.push(current)}else if(current)current.items.push(child)});
 navRoot.replaceChildren();groups.forEach((group,index)=>{
  const active=group.items.some(item=>item.classList.contains('active'));
  if(!Object.hasOwn(sidebarPreferences.groups,group.name))sidebarPreferences.groups[group.name]=active;
  if(sidebarLastRoute!==null&&sidebarLastRoute!==route&&active)sidebarPreferences.groups[group.name]=true;
  const section=document.createElement('section'),list=document.createElement('div'),control=document.createElement('button');
  section.className='nav-group'+(active?' is-active':'');section.dataset.navGroup=group.name;
  const groupIcon=({'客户档案治理':'layers','门店管理':'grid','财务管理':'wallet','合作管理':'users','设备管理':'settings','移动端预览':'phone'})[group.name]||'file';
  control.type='button';control.className='nav-group-toggle';control.id='nav-group-toggle-'+index;control.title=group.name;control.setAttribute('aria-label',group.name);control.setAttribute('aria-controls','nav-group-items-'+index);control.innerHTML='<span class="nav-group-heading">'+icon(groupIcon)+'<span class="nav-group-title">'+esc(group.name)+'</span></span>'+icon('down').replace('class="icon"','class="icon nav-group-chevron"');control.onclick=()=>toggleNavGroup(group.name);
  group.items.forEach(item=>{item.querySelectorAll('.icon').forEach(mark=>mark.remove());if(!item.title)item.title=item.textContent.trim()});
  list.id='nav-group-items-'+index;list.className='nav-group-items';list.setAttribute('aria-labelledby',control.id);list.append(...group.items);section.append(control,list);navRoot.append(section);
 });
 sidebarLastRoute=route;saveSidebarPreferences();syncSidebarControls();
}
$('.app').classList.toggle('sidebar-collapsed',sidebarPreferences.collapsed);
matchMedia('(max-width:760px)').addEventListener('change',syncSidebarControls);

const ubOriginalNav=nav,ubOriginalRender=render,ubOriginalReadRoute=readRoute;
nav=function(){let navScroll=$('#sidebar').scrollTop;ubOriginalNav();const item=([id,label,ic])=>`<button class="nav-item ${route===id?'active':''}" title="${esc(label)}" onclick="go('${id}')">${icon(ic)}<span>${esc(label)}</span></button>`;let html='';for(let group of ['门店管理','财务管理','合作管理','设备管理'])html+=`<div class="nav-label">${group}</div>`+UB.menus.filter(m=>m[3]===group).map(item).join('');let mobileLabel=$('#nav').querySelectorAll('.nav-label')[1];if(mobileLabel)mobileLabel.insertAdjacentHTML('beforebegin',html);else $('#nav').insertAdjacentHTML('beforeend',html);let current=UB.menus.find(x=>x[0]===route);if(current)$('#crumb').innerHTML=`<span>WEID微动</span><span>/</span><span>${current[3]}</span><span>/</span><b>${current[1]}</b>`;$('#nav').querySelectorAll('.active').forEach(el=>el.setAttribute('aria-current','page'));mountSidebarGroups();$('#sidebar').scrollTop=navScroll;};
render=function(){if(!UB.menus.some(x=>x[0]===route)){ubOriginalRender();return}document.body.classList.remove('approval-h5');nav();$('#main').innerHTML=UB.page(route);renderRuleDrawers(null);mrRenderTask();cxRenderApplication();cxRenderWorkbench();syncDrawerLayer($('#mergeDrawers'),'approval-review','');syncDrawerInteraction();document.title=UB.menus.find(x=>x[0]===route)[1]+' · WEID微动'};
window.removeEventListener('hashchange',readRoute);readRoute=function(){UB.clearDrawers();ubOriginalReadRoute()};window.addEventListener('hashchange',readRoute);
$('#resetDemo').onclick=()=>modal('重置演示数据','<p>将恢复当前后台的示例数据，包括档案模块与本次整合的六个业务模块。已保存的本地修改和草稿会被清除。</p>',btn('取消','closeModal()')+btn('确认重置',`UB.resetData();localStorage.removeItem(STORAGE);location.hash='rules';location.reload()`,'danger'));
readRoute();

</script>
</body>
</html>
