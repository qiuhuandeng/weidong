<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 - 客户触达系统</title>
<style>
  :root {
    --primary: #1677ff;
    --primary-hover: #0958d9;
    --primary-light: #e6f4ff;
    --primary-border: #91caff;
    
    --success: #52c41a;
    --success-bg: #f6ffed;
    --warning: #fa8c16;
    --warning-bg: #fff7e6;
    --neutral-gray: #8c8c8c;
    --neutral-bg: #f5f5f5;

    --bg-page: #f4f6f9;
    --bg-card: #ffffff;
    --bg-subtle: #fafafa;
    --bg-hover: #f0f5ff;

    --text-title: #1f2937;
    --text-body: #4b5563;
    --text-muted: #9ca3af;
    --text-light: #6b7280;

    --border-color: #e5e7eb;
    --border-light: #f3f4f6;

    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    background-color: var(--bg-page);
    color: var(--text-body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Page Shell Layout */
  .page-container {
    max-width: 1480px;
    margin: 0 auto;
    padding: 24px 32px;
  }

  /* Header Section */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
  }

  .page-header-info h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-title);
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-header-info h1 .icon-box {
    width: 32px;
    height: 32px;
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-header-info p {
    color: var(--text-light);
    font-size: 13px;
    margin-top: 4px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Common Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
    user-select: none;
  }

  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .btn-primary {
    background-color: var(--primary);
    color: #ffffff;
    box-shadow: 0 2px 4px rgba(22, 119, 255, 0.2);
  }
  .btn-primary:hover {
    background-color: var(--primary-hover);
    box-shadow: 0 4px 8px rgba(22, 119, 255, 0.3);
  }

  .btn-secondary {
    background-color: var(--bg-card);
    border-color: var(--border-color);
    color: var(--text-body);
  }
  .btn-secondary:hover {
    border-color: var(--primary-border);
    color: var(--primary);
    background-color: var(--primary-light);
  }

  .btn-text {
    background: transparent;
    color: var(--text-light);
    padding: 6px 10px;
  }
  .btn-text:hover {
    background: var(--neutral-bg);
    color: var(--text-title);
  }

  .btn-danger-text {
    background: transparent;
    color: #ef4444;
  }
  .btn-danger-text:hover {
    background: #fef2f2;
  }

  .btn-sm {
    padding: 5px 10px;
    font-size: 12px;
  }

  /* Card Component */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  /* Filter / Control Bar */
  .toolbar {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--bg-card);
    flex-wrap: wrap;
  }

  .search-filters {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex: 1;
  }

  .input-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  .input-wrapper svg {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    width: 15px;
    height: 15px;
    pointer-events: none;
  }

  .input-control, .select-control {
    height: 36px;
    padding: 0 12px;
    font-size: 13px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background-color: #fff;
    color: var(--text-title);
    outline: none;
    transition: all 0.2s;
  }

  .input-wrapper .input-control {
    padding-left: 36px;
    width: 280px;
  }

  .input-control:focus, .select-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
  }

  /* Split Layout */
  .workspace-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 680px;
  }

  /* Sidebar - Categories */
  .sidebar-panel {
    border-right: 1px solid var(--border-color);
    background-color: var(--bg-subtle);
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
  }

  .sidebar-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-title);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-count {
    font-size: 11px;
    padding: 2px 7px;
    background: var(--neutral-bg);
    color: var(--text-light);
    border-radius: 12px;
    font-weight: 500;
  }

  .category-list {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }

  .category-item {
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: transparent;
    border: 1px solid transparent;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }

  .category-item:hover {
    background-color: #f1f5f9;
  }

  .category-item.active {
    background-color: var(--primary-light);
    border-color: var(--primary-border);
  }

  .category-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 4px;
    background-color: var(--primary);
    border-radius: 0 4px 4px 0;
  }

  .category-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .category-name {
    font-weight: 600;
    color: var(--text-title);
    font-size: 13.5px;
  }

  .category-item.active .category-name {
    color: var(--primary);
  }

  .category-badge {
    font-size: 11px;
    padding: 1px 6px;
    background: rgba(22, 119, 255, 0.1);
    color: var(--primary);
    border-radius: 4px;
    font-weight: 500;
  }

  .category-desc {
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Main Detail Panel */
  .main-panel {
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }

  .panel-header-bar {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    background: #ffffff;
  }

  .panel-header-info h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-title);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-header-info p {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 4px;
  }

  .content-group-list {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }

  /* Content Group Card */
  .group-card {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: #ffffff;
    transition: border-color 0.2s, box-shadow 0.2s;
    overflow: hidden;
  }

  .group-card:hover {
    border-color: #cbd5e1;
    box-shadow: var(--shadow-md);
  }

  .group-card-head {
    padding: 14px 20px;
    background: #fafafa;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .group-title-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .group-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-title);
  }

  .group-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .group-card-body {
    padding: 18px 20px;
  }

  /* Content Preview: text first, media row below */
  .flow-container {
    display: block;
  }

  .flow-text-stack {
    color: var(--text-body);
    font-size: 14px;
    line-height: 1.85;
  }

  .flow-text-line {
    margin: 0;
    white-space: pre-line;
  }

  .flow-text-line + .flow-text-line {
    margin-top: 8px;
  }

  .media-grid {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
  }

  .media-card {
    width: 132px;
    flex: 0 0 auto;
    background: transparent;
  }

  .media-card:hover .media-preview {
    border-color: #91caff;
    box-shadow: var(--shadow-sm);
  }

  .media-preview {
    height: 94px;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 600;
    font-size: 12px;
    border: 1px solid var(--border-light);
    border-radius: 3px;
    overflow: hidden;
    transition: all 0.2s;
  }

  .media-preview.img-1 { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
  .media-preview.img-2 { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
  .media-preview.img-3 { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); }
  .media-preview.video { background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); }

  .media-type-tag {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  /* Slide Drawer & Modal Overlay */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(2px);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .drawer-backdrop.active {
    opacity: 1;
    visibility: visible;
  }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(720px, 92vw);
    background: #ffffff;
    z-index: 1001;
    box-shadow: var(--shadow-lg);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
  }

  .drawer-backdrop.active .drawer {
    transform: translateX(0);
  }

  .drawer-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .drawer-header h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-title);
  }

  .drawer-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .drawer-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    background: #fafafa;
  }

  /* Form Elements */
  .form-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .form-section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-title);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full-width {
    grid-column: span 2;
  }

  .form-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-title);
  }

  .form-label.required::after {
    content: '*';
    color: #ef4444;
    margin-left: 3px;
  }

  textarea.input-control {
    height: auto;
    padding: 8px 12px;
    min-height: 80px;
    resize: vertical;
    line-height: 1.5;
  }

  /* Dynamic Segment List in Form */
  .entry-block {
    border: 0;
    border-bottom: 1px solid var(--border-light);
    border-radius: 0;
    padding: 0 0 18px;
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .entry-block:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }

  .entry-block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .entry-block-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-title);
  }

  .media-uploader-list {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .upload-tile {
    width: 120px;
    height: 92px;
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-sm);
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--text-light);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .upload-tile.selected-media {
    border-style: solid;
    border-color: var(--border-light);
    color: #fff;
    font-weight: 600;
    overflow: hidden;
    position: relative;
  }

  .upload-tile.img-1 { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
  .upload-tile.img-2 { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
  .upload-tile.img-3 { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); }
  .upload-tile.video { background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); }

  .upload-tile:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  /* Utility Empty State */
  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
  }

  /* Responsive Design */
  @media (max-width: 1024px) {
    .page-container { padding: 16px; }
    .workspace-layout { grid-template-columns: 1fr; }
    .sidebar-panel { border-right: none; border-bottom: 1px solid var(--border-color); }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full-width { grid-column: span 1; }
  }
</style>
</head>
<body>

  <div class="page-container">
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header-info">
        <h1>
          <span class="icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </span>
          客户触达知识库
        </h1>
        <p>按客户顾虑维护多组标准响应套件（文本、图片、视频），助力客服与AI智能推荐协同触达。</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="alert('即将开启批量导入对话框')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          批量导入
        </button>
        <button class="btn btn-primary" onclick="openContentDrawer('new')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加内容组
        </button>
      </div>
    </header>

    <!-- Main Workspace Card -->
    <main class="card">
      <!-- Toolbar / Search Bar -->
      <section class="toolbar">
        <div class="search-filters">
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="input-control" id="search-keyword" placeholder="搜索分类、内容组或话术关键词..." oninput="handleFilterChange()">
          </div>
        </div>
      </section>

      <!-- Grid Layout -->
      <div class="workspace-layout">
        <!-- Sidebar: Categories -->
        <aside class="sidebar-panel">
          <div class="sidebar-header">
            <div class="sidebar-title">
              客户顾虑分类
              <span class="sidebar-count" id="category-count">0</span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="openCategoryModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              新增分类
            </button>
          </div>
          <div class="category-list" id="category-list">
            <!-- Dynamic Category List -->
          </div>
        </aside>

        <!-- Main Panel: Content Groups Detail -->
        <section class="main-panel">
          <div class="panel-header-bar" id="panel-header-bar">
            <!-- Dynamic Header Info -->
          </div>

          <div class="content-group-list" id="content-group-list">
            <!-- Dynamic Cards List -->
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Drawer: Add/Edit Content Group -->
  <div class="drawer-backdrop" id="drawer-backdrop">
    <div class="drawer">
      <div class="drawer-header">
        <h3 id="drawer-title">添加内容组</h3>
        <button class="btn btn-text" onclick="closeDrawer()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="drawer-body">
        <!-- Basic Info Section -->
        <div class="form-section">
          <div class="form-section-title">基础配置</div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label required">内容组名称</label>
              <input type="text" class="input-control" id="form-group-name" placeholder="例：价值拆解核心组合">
            </div>
            <div class="form-group">
              <label class="form-label required">所属分类</label>
              <select class="select-control" id="form-category-select">
                <!-- Dynamic Category Options -->
              </select>
            </div>
          </div>
        </div>

        <!-- Sent Content Sequence Section -->
        <div class="form-section">
          <div class="form-section-title">
            发送序列编辑
            <button class="btn btn-secondary btn-sm" onclick="addFormSegment()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              增加段落
            </button>
          </div>

          <div id="drawer-segments-container" style="display: flex; flex-direction: column; gap: 14px;">
            <!-- Dynamic Editable Segment Blocks -->
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <button class="btn btn-secondary" onclick="closeDrawer()">取消</button>
        <button class="btn btn-primary" onclick="saveContentGroup()">保存内容组</button>
      </div>
    </div>
  </div>

  <!-- Simple Modal: Add Category -->
  <div class="drawer-backdrop" id="category-modal-backdrop">
    <div class="drawer" style="width: 420px; height: auto; top: 15%; bottom: auto; right: 50%; transform: translate(50%, -20px); border-radius: var(--radius-lg);">
      <div class="drawer-header">
        <h3>新增顾虑分类</h3>
        <button class="btn btn-text" onclick="closeCategoryModal()">×</button>
      </div>
      <div class="drawer-body" style="padding: 20px;">
        <div class="form-group">
          <label class="form-label required">分类名称</label>
          <input type="text" class="input-control" id="new-cat-name" placeholder="例如：售后服务疑虑">
        </div>
        <div class="form-group" style="margin-top: 12px;">
          <label class="form-label">核心关键词 / 描述</label>
          <input type="text" class="input-control" id="new-cat-meta" placeholder="例如：怕没人管、担心退款难">
        </div>
      </div>
      <div class="drawer-footer">
        <button class="btn btn-secondary" onclick="closeCategoryModal()">取消</button>
        <button class="btn btn-primary" onclick="saveCategory()">确认创建</button>
      </div>
    </div>
  </div>

  <script>
    // Initial Dataset
    var knowledgeData = [
      {
        id: 'price',
        name: '价格疑问',
        meta: '觉得贵、要比价、想等促销',
        desc: '针对价格敏感度较高的客户，提供多维度价值拆解、预算分摊和活动优惠解释。',
        groups: [
          {
            name: '价值拆解组合',
            messages: [
              { type: 'text', content: '这次方案不是单看一次价格，里面包含专业的皮肤检测、个性化方案设计、资深老师操作以及全程的术后跟进服务。' },
              { type: 'image', title: '项目服务价值拆解图（含赠送权益明细）', imageClass: 'img-1' },
              { type: 'image', title: '全流程服务保障与售后跟进承诺图', imageClass: 'img-2' }
            ]
          },
          {
            name: '预算缓解组合',
            messages: [
              { type: 'text', content: '咱们可以不用一次性做完整套方案，可以先从你最迫切想改善的问题开始，预算和调理节奏都会更轻便。' },
              { type: 'text', content: '你更想先解决毛孔暗沉，还是提升紧致？我帮你按优先级拆拆轻量方案。' }
            ]
          },
          {
            name: '顾问真人讲解',
            messages: [
              { type: 'video', title: '高级顾问视频解说：为什么建议先做基础改善再升级' },
              { type: 'text', content: '视频里老师讲得比较透彻，您可以先看圈出来的两个重点，后面按您的预算弹性调整。' }
            ]
          }
        ]
      },
      {
        id: 'effect',
        name: '效果不放心',
        meta: '担心没效果、看不到明显变化',
        desc: '围绕效果呈现周期、真实过程记录与案例路径，缓解客户对效果的焦虑。',
        groups: [
          {
            name: '效果周期拆解',
            messages: [
              { type: 'text', content: '这个项目更适合看阶段性改善，我们会按7天、14天、30天定期跟进记录，数据化对比更客观。' },
              { type: 'image', title: '观察节点图解与护理注意事项', imageClass: 'img-3' }
            ]
          },
          {
            name: '案例路径说明',
            messages: [
              { type: 'video', title: '阶段改善过程真实记录演示视频' },
              { type: 'text', content: '这个案例主要看改善路径参考，每个人皮肤基础不同，到店后我们会重新评估。' }
            ]
          }
        ]
      },
      {
        id: 'recovery',
        name: '恢复期担心',
        meta: '怕疼、怕红肿、怕影响正常社交',
        desc: '提供透明化的恢复期过程图解与专业护理指导，降低决策心理门槛。',
        groups: [
          {
            name: '恢复期说明组合',
            messages: [
              { type: 'text', content: '每个人皮肤反应不同，操作前我们会先评估，并按您的工作安排建议最适操作时段。' },
              { type: 'image', title: '恢复期日历指南与日常保养建议卡', imageClass: 'img-1' }
            ]
          }
        ]
      },
      {
        id: 'trust',
        name: '信任度不足',
        meta: '顾问陌生、对品牌门店不了解',
        desc: '展示门店环境、专业资质认证与规范服务流程，提升公信力。',
        groups: [
          {
            name: '门店背书组合',
            messages: [
              { type: 'text', content: '我先把门店地址、老师资质和到店流程发您，到店先做免费评估，不合适绝不强推。' },
              { type: 'image', title: '实景接待区与无菌操作间环境图', imageClass: 'img-2' }
            ]
          }
        ]
      }
    ];

    var activeCatId = 'price';
    var editingGroupIndex = null;

    // Helper functions
    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function getActiveCategory() {
      return knowledgeData.find(function(c) { return c.id === activeCatId; }) || knowledgeData[0];
    }

    // Render Side Category Navigation
    function renderCategories() {
      var listEl = document.getElementById('category-list');
      var countEl = document.getElementById('category-count');
      
      var keyword = document.getElementById('search-keyword').value.trim().toLowerCase();

      var filtered = knowledgeData.filter(function(cat) {
        if (!keyword) return true;
        return cat.name.toLowerCase().includes(keyword) || cat.meta.toLowerCase().includes(keyword);
      });

      countEl.textContent = knowledgeData.length;

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">无匹配分类</div>';
        return;
      }

      listEl.innerHTML = filtered.map(function(cat) {
        var isActive = cat.id === activeCatId;
        return `
          <div class="category-item ${isActive ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
            <div class="category-header-row">
              <span class="category-name">${escapeHtml(cat.name)}</span>
              <span class="category-badge">${cat.groups.length} 组</span>
            </div>
            <div class="category-desc">${escapeHtml(cat.meta)}</div>
          </div>
        `;
      }).join('');
    }

    // Render Main Panel Content
    function renderMainPanel() {
      var headerEl = document.getElementById('panel-header-bar');
      var listEl = document.getElementById('content-group-list');
      var cat = getActiveCategory();

      if (!cat) return;

      // Render Header Bar
      headerEl.innerHTML = `
        <div class="panel-header-info">
          <h2>
            ${escapeHtml(cat.name)}
          </h2>
          <p>${escapeHtml(cat.desc)}</p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openContentDrawer('new')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建此类内容
        </button>
      `;

      // Filter Groups
      var keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
      var groups = cat.groups.filter(function(group) {
        // Keyword Search
        if (keyword) {
          var matchName = group.name.toLowerCase().includes(keyword);
          var matchMsg = group.messages.some(m => (m.content || m.title || '').toLowerCase().includes(keyword));
          if (!matchName && !matchMsg) return false;
        }

        return true;
      });

      if (groups.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px;height:40px;margin-bottom:8px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p>暂无符合条件的内容组，点击右上方按钮添加</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = groups.map(function(group, index) {
        return `
          <div class="group-card">
            <div class="group-card-head">
              <div class="group-title-area">
                <span class="group-title">${escapeHtml(group.name)}</span>
              </div>
              <div class="group-actions">
                <button class="btn btn-secondary btn-sm" onclick="openContentDrawer('edit', ${index})">编辑</button>
                <button class="btn btn-text btn-sm" onclick="duplicateGroup(${index})">复制</button>
                <button class="btn btn-danger-text btn-sm" onclick="deleteGroup(${index})">删除</button>
              </div>
            </div>

            <div class="group-card-body">
              <div class="flow-container">
                ${renderMessageFlow(group.messages)}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render content as customer-facing reading order: text above, media below.
    function renderMessageFlow(messages) {
      var textItems = messages.filter(function(msg) {
        return msg.type === 'text' && msg.content;
      });
      var mediaItems = messages.filter(function(msg) {
        return msg.type === 'image' || msg.type === 'video';
      });

      var textHtml = textItems.length ? `
        <div class="flow-text-stack">
          ${textItems.map(function(msg) {
            return `<p class="flow-text-line">${escapeHtml(msg.content)}</p>`;
          }).join('')}
        </div>
      ` : '';

      var mediaHtml = mediaItems.length ? `
        <div class="media-grid">
          ${mediaItems.map(function(msg) {
            var isVideo = msg.type === 'video';
            return `
              <div class="media-card" title="${escapeHtml(msg.title)}">
                <div class="media-preview ${isVideo ? 'video' : (msg.imageClass || 'img-1')}">
                  ${isVideo ? '▶' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      ` : '';

      return textHtml + mediaHtml;
    }

    // Interactive Handlers
    function selectCategory(catId) {
      activeCatId = catId;
      renderCategories();
      renderMainPanel();
    }

    function handleFilterChange() {
      renderCategories();
      renderMainPanel();
    }

    function resetFilters() {
      document.getElementById('search-keyword').value = '';
      handleFilterChange();
    }

    // Open/Close Drawer Logic
    function openContentDrawer(mode, index) {
      var cat = getActiveCategory();
      editingGroupIndex = (mode === 'edit') ? index : null;

      document.getElementById('drawer-title').textContent = (mode === 'edit') ? '编辑内容组' : '添加内容组';

      // Populate Select
      var selectEl = document.getElementById('form-category-select');
      selectEl.innerHTML = knowledgeData.map(c => `<option value="${c.id}" ${c.id === cat.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');

      var groupContainer = document.getElementById('drawer-segments-container');

      if (mode === 'edit' && cat.groups[index]) {
        var g = cat.groups[index];
        document.getElementById('form-group-name').value = g.name;

        groupContainer.innerHTML = buildSegmentBlockHTML(normalizeMessagesToSegment(g.messages), 0);
      } else {
        document.getElementById('form-group-name').value = '';
        groupContainer.innerHTML = buildSegmentBlockHTML({ type: 'text', content: '' }, 0);
      }

      document.getElementById('drawer-backdrop').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('drawer-backdrop').classList.remove('active');
    }

    function normalizeMessagesToSegment(messages) {
      var text = messages.filter(function(m) {
        return m.type === 'text' && m.content;
      }).map(function(m) {
        return m.content;
      }).join('\n\n');

      var media = messages.filter(function(m) {
        return m.type === 'image' || m.type === 'video';
      });

      return { type: 'combo', content: text, media: media };
    }

    function buildSegmentBlockHTML(msg, index) {
      var media = msg.media || ((msg.type === 'image' || msg.type === 'video') ? [msg] : []);
      var content = msg.content || '';

      return `
        <div class="entry-block">
          <div class="entry-block-head">
            <span class="entry-block-title">内容段落 ${index + 1}</span>
            <button class="btn btn-danger-text btn-sm" onclick="this.closest('.entry-block').remove()">删除段落</button>
          </div>
          <div class="form-group">
            <textarea class="input-control segment-text-input" placeholder="输入标准触达话术，支持多行输入...">${escapeHtml(content)}</textarea>
          </div>
          <div>
            <span class="form-label" style="font-size:12px;">附件素材（可选图片/视频）</span>
            <div class="media-uploader-list">
              ${media.map(function(item) {
                var isVideo = item.type === 'video';
                var mediaClass = isVideo ? 'video' : (item.imageClass || 'img-1');
                return `
                  <div class="upload-tile selected-media ${mediaClass}" data-type="${escapeHtml(item.type)}" data-title="${escapeHtml(item.title || (isVideo ? '视频素材' : '图片素材'))}" data-image-class="${escapeHtml(item.imageClass || '')}"></div>
                `;
              }).join('')}
              <div class="upload-tile" onclick="alert('上传图片功能模拟')">
                <span>+ 图片</span>
              </div>
              <div class="upload-tile" onclick="alert('上传视频功能模拟')">
                <span>+ 视频</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function addFormSegment() {
      var container = document.getElementById('drawer-segments-container');
      var count = container.querySelectorAll('.entry-block').length;
      container.insertAdjacentHTML('beforeend', buildSegmentBlockHTML({ type: 'text', content: '' }, count));
    }

    function saveContentGroup() {
      var name = document.getElementById('form-group-name').value.trim();
      var targetCatId = document.getElementById('form-category-select').value;

      if (!name) {
        alert('请输入内容组名称');
        return;
      }

      var segmentNodes = document.querySelectorAll('.entry-block');
      var messages = [];

      segmentNodes.forEach(function(node) {
        var text = node.querySelector('.segment-text-input').value.trim();
        if (text) {
          messages.push({ type: 'text', content: text });
        }

        node.querySelectorAll('.selected-media').forEach(function(tile) {
          var mediaType = tile.getAttribute('data-type') || 'image';
          var mediaItem = {
            type: mediaType,
            title: tile.getAttribute('data-title') || (mediaType === 'video' ? '视频素材' : '图片素材')
          };
          var imageClass = tile.getAttribute('data-image-class');
          if (imageClass) mediaItem.imageClass = imageClass;
          messages.push(mediaItem);
        });
      });

      if (messages.length === 0) {
        messages.push({ type: 'text', content: '（内容为空，请编辑触达话术）' });
      }

      var targetCat = knowledgeData.find(c => c.id === targetCatId);
      if (editingGroupIndex !== null && targetCat.groups[editingGroupIndex]) {
        targetCat.groups[editingGroupIndex] = {
          name: name,
          messages: messages
        };
      } else {
        targetCat.groups.unshift({
          name: name,
          messages: messages
        });
      }

      closeDrawer();
      selectCategory(targetCatId);
    }

    function duplicateGroup(index) {
      var cat = getActiveCategory();
      var original = cat.groups[index];
      if (!original) return;

      var clone = JSON.parse(JSON.stringify(original));
      clone.name += ' (副本)';
      cat.groups.splice(index + 1, 0, clone);
      renderMainPanel();
      renderCategories();
    }

    function deleteGroup(index) {
      if (!confirm('确定要删除该内容组吗？')) return;
      var cat = getActiveCategory();
      cat.groups.splice(index, 1);
      renderMainPanel();
      renderCategories();
    }

    // Category Modal Handlers
    function openCategoryModal() {
      document.getElementById('new-cat-name').value = '';
      document.getElementById('new-cat-meta').value = '';
      document.getElementById('category-modal-backdrop').classList.add('active');
    }

    function closeCategoryModal() {
      document.getElementById('category-modal-backdrop').classList.remove('active');
    }

    function saveCategory() {
      var name = document.getElementById('new-cat-name').value.trim();
      var meta = document.getElementById('new-cat-meta').value.trim();

      if (!name) {
        alert('请输入分类名称');
        return;
      }

      var newId = 'cat_' + Date.now();
      knowledgeData.push({
        id: newId,
        name: name,
        meta: meta || '新增分类描述',
        desc: '关于' + name + '场景下的客服标准触达组合。',
        groups: []
      });

      closeCategoryModal();
      selectCategory(newId);
    }

    // Initialize Page
    renderCategories();
    renderMainPanel();
  </script>
</body>
</html>
