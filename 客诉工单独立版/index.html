function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(UI.toast);UI.toast=setTimeout(()=>$('#toast').style.display='none',3500)}
function save(){const raw=localStorage.getItem(KEY);if(raw){const live=JSON.parse(raw);if((live.configRevision||0)>(S.configRevision||0)){S.rules=live.rules;S.scenes=live.scenes;S.configRevision=live.configRevision;S.configHistory=live.configHistory;}}localStorage.setItem(KEY,JSON.stringify(S))}
function mutate(fn,msg){const raw=localStorage.getItem(KEY);if(raw){const live=JSON.parse(raw);if((live.configRevision||0)>(S.configRevision||0)){S.rules=live.rules;S.scenes=live.scenes;S.configRevision=live.configRevision;S.configHistory=live.configHistory;}}const previous=E.clone(S);try{const r=fn();save();return r}catch(e){S=previous;throw e}}
function badges(t){return`<span class="pill l${t.level}">${['','一级','二级','三级','四级'][t.level]}</span>${t.repeat?'<span class="pill red">重复投诉</span>':''}`}
function stateTag(t){return`<span class="pill ${({'待方案审批':'amber','待打款':'blue','已结案':'green','待首联':'blue'})[t.state]||''}">${esc(t.state)}</span>`}
function due(t){if(['已结案','已合并'].includes(t.state))return`<span class="sub">${date(t.closed||t.updated)}</span>`;const times=[t.deadline,t.taskDeadline].filter(x=>x>0);if(!times.length)return'<span class="sub">时限待设定</span>';const d=(Math.min(...times)-Date.now())/E.H,a=Math.abs(d),v=a>=24?Math.floor(a/24)+'天'+Math.floor(a%24)+'小时':a>=1?Math.floor(a)+'小时'+Math.floor(a%1*60)+'分':Math.max(1,Math.floor(a*60))+'分钟';return`<span class="${d<0?'red-text':d<S.rules.warn?'amber-text':'teal-text'}">${d<0?'已超时':'剩余'} ${v}</span>`}
function shownTaskPeople(t){return actor().role==='lead'&&E.needsRiskReview(t)?[S.rules.riskConfig.receiver]:E.taskPeople(S,t)}
function taskLabel(t){if(actor().role==='lead'&&E.needsRiskReview(t))return '结案风险复核';if(t.state==='待方案审批')return t.approval?.steps[t.approval.index]?.name||t.state;return({'待分派':'分派工单','待首联':'首次联系','处理中':'跟进处理','待打款':'财务打款','待回访':'结果确认'})[t.state]||t.state}
function roleSelect(){return `<span class="current-actor">${esc(actor().name)} · ${esc(actor().title)}</span>`}
function canCreate(){return['agent','lead','store','sales'].includes(actor().role)}
function filtered(){const f=UI.filters;return S.tickets.filter(t=>E.canView(S,t,S.actor)).filter(t=>UI.view==='mine'?E.isPending(S,t,S.actor):UI.view==='created'?t.creator===S.actor:UI.view==='involved'?t.owner===S.actor||t.creator===S.actor||t.participants.includes(S.actor):true).filter(t=>{const q=f.q.trim().toLowerCase();return(!q||[t.id,t.name,t.phone,t.member,t.title].join(' ').toLowerCase().includes(q))&&(!f.state||t.state===f.state)&&(!f.level||t.level===+f.level)&&(!f.store||t.store===f.store)&&(!f.owner||t.owner===f.owner)&&(!f.channel||t.channel===f.channel)&&(!f.task||taskLabel(t).includes(f.task))&&(!f.risk||(f.risk==='repeat'?t.repeat:f.risk==='high'?t.level===4:f.risk==='overdue'?t.taskDeadline<Date.now()&&!['已结案','已合并'].includes(t.state):t.taskDeadline>=Date.now()&&t.taskDeadline-Date.now()<S.rules.warn*E.H&&!['已结案','已合并'].includes(t.state)))&&(!f.from||t.created>=new Date(f.from).getTime())&&(!f.to||t.created<new Date(f.to).getTime()+24*E.H)}).sort((a,b)=>f.sort==='new'?b.created-a.created:f.sort==='due'?a.taskDeadline-b.taskDeadline:((b.level===4?100:0)+(b.repeat?50:0))-((a.level===4?100:0)+(a.repeat?50:0))||a.taskDeadline-b.taskDeadline)}
function filterControls(){const f=UI.filters;return`<form id="filter-form" class="filters ${UI.more?'expanded':''}"><input class="search" name="q" aria-label="搜索工单" placeholder="搜索工单号、客户、手机号 / 会员号" value="${esc(f.q)}">${select('state',E.STATES,f.state,'全部状态')}${select('level',[[1,'一级'],[2,'二级'],[3,'三级'],[4,'四级']],f.level,'全部等级')}${select('store',E.STORES,f.store,'全部门店')}<button class="primary" type="submit">查询</button>${btn('重置','resetFilters','','ghost')}${btn(I('filter')+' 更多筛选','moreFilters','','ghost')}<div class="filter-more">${select('owner',E.USERS.filter(u=>['agent','lead','store'].includes(u.role)).map(u=>[u.id,u.name]),f.owner,'全部负责人')}${select('channel',E.CHANNELS,f.channel,'全部来源')}${select('risk',[['high','四级风险'],['repeat','重复投诉'],['overdue','已超时'],['soon','即将超时']],f.risk,'风险 / 时效')}${select('task',['首联','跟进','审批','打款','确认','分派'],f.task,'全部任务')}${inp('from',f.from,'date',false,'title="开始日期"')}${inp('to',f.to,'date',false,'title="结束日期"')}${select('sort',[['risk','风险优先'],['new','最近受理'],['due','最近截止']],f.sort)}</div></form>`}
function tabs(){return`<div class="tabs">${[['mine','待我处理'],['created','我发起的'],['involved','我参与的'],['all','全部工单']].map(([v,l])=>btn(l,'view',v,'tab '+(UI.view===v?'active':''))).join('')}</div>`}
function pager(total){const pages=Math.max(1,Math.ceil(total/8));UI.page=Math.min(UI.page,pages);return`<div class="pager"><span>共 ${total} 条工单</span><div class="row">${btn('上一页','page',UI.page-1,'small',UI.page===1?'disabled':'')}${Array.from({length:pages},(_,i)=>btn(i+1,'page',i+1,'small '+(i+1===UI.page?'selected':''))).join('')}${btn('下一页','page',UI.page+1,'small',UI.page===pages?'disabled':'')}</div></div>`}
function empty(text='暂无符合条件的工单'){return`<div class="empty">${I('ticket')}<p>${text}</p>${btn('重置筛选','resetFilters','','link')}</div>`}
function listPage(){const list=filtered(),pagination=pager(list.length),rows=list.slice((UI.page-1)*8,UI.page*8);return`<div class="page-head"><h1>客诉工单</h1><div class="row">${btn(I('refresh'),'refresh','','iconbtn','aria-label="刷新列表"')}${canCreate()?btn(I('plus')+' 新增工单','create','','primary'):''}</div></div><div class="panel tickets-query-panel">${tabs()}${filterControls()}</div><div class="panel tickets-results-panel">${rows.length?`<div class="table-wrap"><table class="tickets-table"><thead><tr><th>工单 / 来源</th><th>客户</th><th>门店</th><th>等级 / 风险</th><th>当前进度</th><th>责任人</th><th>处理时效</th><th>操作</th></tr></thead><tbody>${rows.map(t=>`<tr class="${t.level===4||t.repeat?'risky':''}"><td><div class="ticket-no">${t.id}</div><a href="#/tickets/${t.id}" class="ticket-title">${esc(t.title)}</a><span class="sub">${esc(t.channel)}</span></td><td class="nowrap">${esc(t.name)}<div class="sub">${mask(t.phone)}</div></td><td class="nowrap">${esc(t.store)}</td><td>${badges(t)}</td><td>${stateTag(t)}<div class="sub">${esc(taskLabel(t))}</div></td><td class="nowrap">${shownTaskPeople(t).map(name).join('、')||name(t.owner)}<div class="sub">主责 · ${name(t.owner)}</div></td><td class="nowrap">${due(t)}<div class="sub">整单 ${t.deadline?date(t.deadline):'待设定'}</div></td><td class="nowrap">${btn('查看详情','detail',t.id,'link')}</td></tr>`).join('')}</tbody></table></div>`:empty()}${pagination}</div>`}
function render(){
  let route=location.hash;
  if(!/^#\/(tickets|mobile)(\/[^/]+)?$/.test(route)){
    route=matchMedia('(max-width:760px)').matches?'#/mobile':'#/tickets';
    history.replaceState(null,'',location.pathname+location.search+route);
  }
  syncTaskActor(route);
  document.body.classList.toggle('is-mobile',mobile());
  document.body.classList.toggle('workflow-mobile',mobile());
  $('#drawer-root').innerHTML='';
  if(mobile()){
    renderMobile();
    if(ticket(route.split('/')[2])?.state==='待方案审批')$('.mobile-top strong').textContent='钉钉审批详情';
    return;
  }
  $('#app').innerHTML=`<div class="shell standalone-shell"><main class="main"><header class="topbar"><div class="crumb">客诉管理 <b>/ 工单列表</b></div><div class="top-right"><a class="mini-link" href="#/config">${I('settings')} 配置后台</a><a class="mini-link" href="#/mobile">${I('mobile')} 移动端</a>${roleSelect()}</div></header><section class="content">${listPage()}</section></main></div>`;
  const rid=route.split('/')[2];
  if(rid){UI.drawer=rid;renderDrawer(rid)}else if(UI.drawer)renderDrawer(UI.drawer);
}
function dataRows(rows){return`<dl class="data">${rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`}
function info(t){return `<div class="card"><h3>处理规则</h3><div class="gap"></div>${dataRows([['匹配场景',esc(t.flow?.name||'历史流程')+' · V'+(t.flow?.version||1)],['定级依据',esc(t.gradeReason||'受理人员确认')],['整单截止',t.deadline?date(t.deadline):'待设定'],['当前节点截止',date(t.taskDeadline)]])}</div>`+originalInfo(t)}
function originalInfo(t){const o=S.orders.find(x=>x.id===t.order);return`<div class="grid cols2"><div class="card"><div class="section-title"><h3>客户信息</h3><span class="pill outline">${esc(t.isNew)}</span></div>${dataRows([['客户姓名',esc(t.name)],['手机号',mask(t.phone)+' '+btn('查看','reveal',t.id,'link')],['会员号',esc(t.member)||'—'],['所属门店',esc(t.store)],['接待人员',esc(t.staff)||'—']])}</div><div class="card"><div class="section-title"><h3>消费订单</h3>${!o&&E.canHandle(S,t,S.actor)?btn('关联订单','bindOrder',t.id,'link'):''}</div>${dataRows([['订单编号',esc(o?.external)||'待核实'],['订单来源',esc(o?.system)||'—'],['消费项目',esc(t.project)],['订单金额',money(o?.paid||t.amount)],['可退余额',o?money(o.paid-o.refunded):'待核实']])}</div></div><div class="gap"></div><div class="card"><div class="section-title"><h3>投诉内容</h3><span class="sub">${date(t.created)} · ${esc(t.channel)}</span></div><p class="text">${esc(t.description)}</p>${t.attachments.length?'<div class="gap"></div>'+filesView(t.attachments):''}</div>${t.related.length?`<div class="card"><h3>关联工单</h3><div class="gap"></div>${t.related.map(x=>btn(x,'detail',x,'link')).join('')}</div>`:''}<div class="card"><h3>来源记录</h3><div class="gap"></div>${t.sources.map(x=>`<p class="sub">${esc(x.channel)} · ${date(x.at)}</p><p class="text">${esc(x.content)}</p>`).join('<div class="gap"></div>')}</div>`}
function filesView(files){return`<div class="files">${files.map(f=>`<a class="file" href="${f.data||'#'}" ${f.data?'download="'+esc(f.name)+'"':''}>${esc(f.name)}</a>`).join('')}</div>`}
function timeline(t){return`<div class="card"><div class="section-title"><h3>处理记录</h3><span class="sub">${t.logs.length} 条记录</span></div><div class="timeline">${t.logs.map(l=>`<div class="event"><h3>${esc(l.title)} <span class="muted">· ${esc(l.actor)}</span></h3><div class="sub">${date(l.at)}</div><div class="text">${esc(l.body)}</div></div>`).join('')}</div></div>`}
function approvalView(a){return`<div class="section-title"><h3>${esc(a.scene)}</h3><span class="pill blue">V${a.version} · ${esc(a.status)}</span></div>${a.steps.map((n,i)=>`<div class="approval-line"><div class="node-dot ${n.done?'done':i===a.index&&a.status==='审批中'?'current':''}">${n.done?'✓':i+1}</div><div class="grow"><div>${esc(n.name)}</div><div class="sub">${n.people.map(name).join('、')} · ${n.type==='cc'?'抄送':n.mode==='all'?'全部同意':'任一同意'}</div></div><span class="sub">${n.done?'已完成':i===a.index&&a.status==='审批中'?'待审批':'未执行'}</span></div>`).join('')}`}
function funding(t){const p=t.proposal;if(!p)return`<div class="card"><div class="empty">暂无处理方案</div></div>`;return`<div class="card"><div class="section-title"><h3>处理方案 · V${p.version}</h3><span class="pill outline">${esc(p.type)}</span></div><p class="text">${esc(p.content)}</p><div class="gap"></div>${dataRows([['退款金额',money(p.refund)],['赔偿金额',money(p.compensation)],['申请总额','<b>'+money(p.refund+p.compensation)+'</b>'],['客户沟通',esc(p.consent)],['收款方式',esc(p.account)||'无资金事项']])}</div>${t.approval?`<div class="card">${approvalView(t.approval)}</div>`:''}${t.payments.length?`<div class="card"><h3>付款记录</h3>${t.payments.map(x=>`<div class="approval-line"><div class="grow"><b class="${x.result==='失败'?'red-text':'teal-text'}">${esc(x.result)}</b> · ${money(x.amount)}<div class="sub">${date(x.at)} · ${esc(x.actor)}</div><div class="text">${esc(x.reference||x.reason||'')}</div>${x.proof?filesView(x.proof):''}</div></div>`).join('')}</div>`:''}${t.approvalHistory?.length?`<div class="card"><details><summary>历史审批 · ${t.approvalHistory.length} 次</summary><div class="gap"></div>${t.approvalHistory.map(a=>approvalView(a)).join('<div class="gap"></div>')}</details></div>`:''}`}
function actionButtons(t){let b=[];if(t.mergedInto)return btn('查看主工单','detail',t.mergedInto,'primary');if(['已结案','已合并'].includes(t.state))return '';if(t.state==='待分派'&&actor().role==='lead')b.push(btn('分派工单','assign',t.id,'primary'));if(E.needsRiskReview(t)&&actor().role==='lead')b.push(btn('结案风险复核','risk',t.id,'danger'));if(t.state==='待方案审批'&&E.taskPeople(S,t).includes(S.actor)){b.push(btn('驳回','reject',t.id,'danger'),btn('同意','approve',t.id,'primary'))}else if(t.state==='待打款'&&S.actor===(t.flow?.doc.finance||S.rules.finance)){b.push(btn('退回补正','payReturn',t.id),btn('登记打款结果','pay',t.id,'primary'))}else if(E.canHandle(S,t,S.actor)){if(t.state==='待首联')b.push(btn(I('phone')+' 联系客户','call',t.id),btn('记录联系','follow',t.id,'primary'));if(t.state==='处理中'){b.push(btn('添加跟进','follow',t.id),btn(t.level===1&&t.flow?.doc.approvalMode!=='required'?'提交处理结果':'提交处理方案',t.level===1&&t.flow?.doc.approvalMode!=='required'?'complete':'proposal',t.id,'primary'))}if(t.state==='待回访')b.push(btn('记录回访结果','review',t.id,'primary'));if(['待方案审批','待打款'].includes(t.state))b.push(btn('添加跟进','follow',t.id),btn('撤回方案','withdraw',t.id))}return b.join('')}
function moreActions(t){
 if(t.state==='已合并')return '';
 const active=t.state!=='已结案';
 return `${active&&t.state!=='待分派'&&actor().role==='lead'?btn('调整负责人','assign',t.id):''}${active&&E.canHandle(S,t,S.actor)&&t.level<4?btn('升级投诉','escalate',t.id):''}${canCreate()?btn('再次投诉','repeat',t.id):''}`;
}
function moreMenu(t){const actions=moreActions(t);return actions?`<details class="ticket-more-menu"><summary>更多</summary><div class="ticket-more-items">${actions}</div></details>`:''}
function renderDrawer(id){const oldScroll=$('.drawer-body')?.scrollTop||0;const t=ticket(id);if(!t||!E.canView(S,t,S.actor)){UI.drawer=null;$('#drawer-root').innerHTML='';toast('工单不存在或没有访问权限');return}UI.drawer=id;$('#drawer-root').innerHTML=`<div class="drawer-backdrop" data-action="closeDrawer"><section class="drawer" role="dialog" aria-modal="true" aria-label="工单详情" data-stop><div class="drawer-header"><div class="spread"><span class="ticket-no">${t.id}</span><div class="row">${stateTag(t)}${moreMenu(t)}${btn(I('close'),'closeDrawer','','iconbtn','aria-label="关闭详情"')}</div></div><h2>${esc(t.title)}</h2><div class="spread wrap"><div>${badges(t)}</div><div class="drawer-status"><span>主责 ${name(t.owner)}</span><span>${esc(taskLabel(t))} · ${shownTaskPeople(t).map(name).join('、')||'—'}</span><span>${due(t)}</span><span>整单 ${t.deadline?date(t.deadline):'待设定'}</span></div></div></div><div class="tabs drawer-tabs">${[['info','工单信息'],['logs','处理记录'],['fund','方案与资金']].map(([v,l])=>btn(l,'detailTab',v,'tab '+(UI.tab===v?'active':''))).join('')}</div><div class="drawer-body">${t.level===4||t.repeat?`<div class="banner red">${I('shield')} ${t.level===4?'四级风险':''}${t.repeat?' · 重复投诉':''} · ${t.riskAck?'已完成结案风险复核':t.state==='待回访'?'待结案风险复核':'结案前需风险复核'}${t.riskWords?.length?' · 命中：'+esc(t.riskWords.join('、')):''}</div>`:''}${UI.tab==='info'?info(t):UI.tab==='logs'?timeline(t):funding(t)}</div><div class="drawer-footer"><span class="sub">${esc(t.state)}${t.nextFollow?' · 下次跟进 '+esc(t.nextFollow):''}</span><div class="action-buttons">${actionButtons(t)}</div></div></section></div>`;if($('.drawer-body'))$('.drawer-body').scrollTop=oldScroll}
function modal(title,body,{form='',id='',wide=false,drawer=!!form,submit='保存',danger=false}={}){
 UI.returnFocus=document.activeElement;UI.modalDirty=false;
 const actions=`${btn('取消','closeModal')}<button type="submit" class="${danger?'danger':'primary'}">${submit}</button>`;
 $('#modal-root').innerHTML=drawer?`<div class="drawer-backdrop form-drawer-backdrop" data-action="closeModal"><section class="drawer form-drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}" data-stop><header class="drawer-header spread"><h2>${title}</h2>${btn(I('close'),'closeModal','','iconbtn','aria-label="关闭抽屉"')}</header><form data-form="${form}" data-id="${esc(id)}"><div class="drawer-body">${body}</div><footer class="drawer-footer"><div class="error-slot" role="alert"></div><div class="form-actions">${actions}</div></footer></form></section></div>`:`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2>${btn(I('close'),'closeModal','','iconbtn','aria-label="关闭弹窗"')}</div>${form?`<form data-form="${form}" data-id="${esc(id)}">${body}<div class="error-slot" role="alert"></div><div class="form-actions">${actions}</div></form>`:body}</section></div>`;
 setTimeout(()=>$('#modal-root input, #modal-root textarea, #modal-root select, #modal-root button')?.focus(),30);
}
function closeModal(force=false){if(!force&&UI.modalDirty){const slot=$('#modal-root .error-slot');if(slot){slot.innerHTML='<div class="banner amber">有未保存的内容 '+btn('放弃修改','discardModal','','small danger')+'</div>';return}}$('#modal-root').innerHTML='';UI.modalDirty=false;UI.returnFocus?.isConnected&&UI.returnFocus.focus()}
function createForm(){const u=actor();modal('新增工单',`<div class="form-section"><h3>受理信息</h3><div class="form-grid">${field('来源渠道',select('channel',E.CHANNELS,u.role==='store'?E.CHANNELS[2]:u.role==='sales'?E.CHANNELS[5]:E.CHANNELS[0]))}${field('客户类型',select('isNew',['新客','老客','待核实'],'待核实'))}</div></div><div class="form-section"><h3>客户与订单</h3><div class="form-grid">${field('客户姓名 *',inp('name','','text',true))}${field('手机号 *',inp('phone','','tel',true,'pattern="1[0-9]{10}" maxlength="11"'))}${field('会员号',inp('member'))}${field('所属门店 *',select('store',u.store?[u.store]:E.STORES,u.store||E.STORES[0]))}${field('关联订单',select('order',S.orders.filter(o=>!u.store||o.store===u.store).map(o=>[o.id,o.external+' · '+o.name+' · '+o.system]),'','暂未关联'),true)}</div><div id="duplicate-candidates"></div></div><div class="form-section"><h3>投诉内容</h3><div class="form-grid">${field('投诉摘要 *',inp('title','','text',true,'maxlength="60"'),true)}${field('投诉描述 / 客户诉求 *',txt('description'),true)}${field('投诉等级',select('level',[[1,'一级 · 普通服务'],[2,'二级 · 退款 / 小额赔付'],[3,'三级 · 赔偿'],[4,'四级 · 越级风险']],2))}${field('手动指定负责人',actor().role==='lead'?select('owner',E.USERS.filter(x=>S.rules.commonHandling?S.rules.commonHandling.handlers.includes(x.id):['agent','lead','store'].includes(x.role)).map(x=>[x.id,x.name]),'','按规则自动分派'):inp('ownerDisplay','按规则分派','text',false,'disabled'))}${field('附件',`<input name="files" type="file" multiple aria-label="投诉附件">`,true)}</div></div>`,{form:'create',drawer:true,submit:'提交工单'})}
function duplicateCandidates(){const f=$('[data-form="create"]');if(!f)return;const phone=f.elements.phone.value,member=f.elements.member.value;const hits=S.tickets.filter(t=>E.canView(S,t,S.actor)&&t.state!=='已合并'&&((phone&&t.phone===phone)||(member&&t.member===member)));$('#duplicate-candidates').innerHTML=hits.length?`<div class="banner amber"><b>发现关联工单</b>${hits.map(t=>`<div class="spread wrap" style="margin-top:10px"><div><span class="ticket-no">${t.id}</span><div>${esc(t.title)} · ${t.state}</div></div><div>${btn('补充原工单','appendExisting',t.id,'small')}${btn('登记再次投诉','repeatExisting',t.id,'small')}</div></div>`).join('')}<div style="margin-top:12px"><label><input type="checkbox" name="distinct"> 不同事件，继续新建</label></div></div>`:'';UI.duplicates=hits.map(t=>t.id)}
async function readFiles(list){const files=[...(list||[])];if(files.some(f=>f.size>500*1024)||files.reduce((n,f)=>n+f.size,0)>1024*1024)throw Error('本地附件每个不超过500KB，单次总计不超过1MB');return Promise.all(files.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,type:f.type,size:f.size,data:r.result});r.onerror=()=>reject(Error('附件读取失败'));r.readAsDataURL(f)})))}
function actionForm(act,id){const t=ticket(id);if(!t||!E.canView(S,t,S.actor))throw Error('没有工单访问权限');const base={id};if(act==='follow')modal('联系与跟进',`<div class="form-grid">${field('联系方式',select('method',['电话','企微','门店面谈','其他'],'电话'))}${field('联系结果',select('connected',[['yes','已接通 / 有效沟通'],['no','未接通']],'yes'))}${field('沟通内容 *',txt('content'),true)}${field('客户诉求',txt('request','',false),true)}${field('下次跟进时间',inp('next','','datetime-local'),true)}${field('附件','<input type="file" name="files" multiple>',true)}</div>`,{...base,form:'follow',submit:'保存记录'});
 else if(act==='assign')modal(t.state==='待分派'?'分派工单':'调整负责人',`<div class="form-grid">${field('负责人 *',select('owner',E.USERS.filter(u=>t.flow?.doc.common?t.flow.doc.common.handlers.includes(u.id):['agent','lead'].includes(u.role)||(u.role==='store'&&u.store===t.store)).map(u=>[u.id,u.name+' · '+u.title]),t.owner),true)}${field('原因 *',txt('reason'),true)}</div>`,{...base,form:'assign',submit:'确认分派'});
 else if(act==='proposal')proposalForm(t);
 else if(act==='approve'||act==='reject')modal(act==='approve'?'审批同意':'审批驳回',`<div class="banner">${esc(t.approval?.steps[t.approval.index]?.name)} · 申请 ${money((t.proposal?.refund||0)+(t.proposal?.compensation||0))}</div><p class="text">${esc(t.proposal?.content)}</p><div class="gap"></div>${field(act==='reject'?'驳回原因 *':'审批意见',txt('note','',act==='reject'))}`,{...base,form:act,submit:act==='approve'?'确认同意':'确认驳回',danger:act==='reject'});
 else if(act==='pay')modal('登记打款结果',`<div class="banner">批准金额 <b>${money(t.proposal.refund+t.proposal.compensation)}</b> · ${esc(t.proposal.account)}</div><div class="form-grid">${field('付款结果',select('result',['成功','失败'],'成功'))}${field('实际金额（元）',inp('amount',(t.proposal.refund+t.proposal.compensation)/100,'number',true,'step="0.01" min="0"'))}${field('交易流水号',inp('reference'),true)}${field('付款凭证','<input name="proof" type="file" multiple>',true)}${field('失败原因',txt('reason','',false),true)}</div>`,{...base,form:'pay',submit:'保存付款结果'});
 else if(act==='payReturn'||act==='withdraw')modal(act==='payReturn'?'退回补正':'撤回方案',field('原因 *',txt('reason')),{...base,form:act,submit:'确认退回',danger:true});
 else if(act==='review')modal('回访与结果确认',`<div class="form-grid">${field('客户反馈',select('result',['认可','不认可','未联系上'],'认可'),true)}${field('回访记录 *',txt('note'),true)}</div>`,{...base,form:'review',submit:'保存回访结果'});
 else if(act==='complete')modal('提交处理结果',field('处理措施与结果 *',txt('note')),{...base,form:'complete',submit:'进入结果确认'});
 else if(act==='risk')modal('结案风险复核',field('处置情况与复核意见 *',txt('note')),{...base,form:'risk',submit:'完成复核'});
 else if(act==='repeat')modal('登记再次投诉',field('客户再次投诉内容 *',txt('note')),{...base,form:'repeat',submit:'保存并标红'});
 else if(act==='escalate')modal('升级投诉',`<div class="form-grid">${field('升级至',select('level',[2,3,4].filter(x=>x>t.level).map(x=>[x,x+'级']),Math.min(4,t.level+1)),true)}${field('升级原因 *',txt('note'),true)}</div>`,{...base,form:'escalate',submit:'确认升级'});
 else if(act==='bindOrder')modal('关联订单',field('客户订单',select('order',S.orders.filter(o=>o.phone===t.phone).map(o=>[o.id,o.external+' · '+o.project]),'','请选择')),{...base,form:'bindOrder',submit:'确认关联'});
 else if(act==='call')modal('联系客户',`<div class="spread"><div><h2>${esc(t.name)}</h2><p class="muted">${mask(t.phone)}</p></div>${I('phone')}</div><div class="gap"></div><div class="action-buttons">${btn('记录未接通','follow',t.id)}${btn('记录联系结果','follow',t.id,'primary')}</div>`);
 else if(act==='reveal'){mutate(()=>E.log(t,S.actor,'查看客户联系方式','经当前岗位权限查看'));modal('客户联系方式',`<h2>${esc(t.name)}</h2><div class="gap"></div><p>${esc(t.phone)}</p>`)}
}
function proposalForm(t){modal('提交处理方案',`<div class="form-grid">${field('方案类型',select('type',['普通处理','退款','赔偿','退款＋赔偿'],t.level===1?'普通处理':t.level===3?'退款＋赔偿':'退款'))}${field('客户沟通结果',select('consent',['客户已认可','尚未认可'],'客户已认可'))}${field('退款金额（元）',inp('refund',0,'number',true,'min="0" step="0.01"'))}${field('赔偿金额（元）',inp('compensation',0,'number',true,'min="0" step="0.01"'))}${field('处理方案与依据 *',txt('content',t.proposal?.content||''),true)}${field('收款方式 / 已核验收款信息',inp('account',t.proposal?.account||'原支付渠道'),true)}</div><div class="gap"></div>${btn('预览匹配流程','previewMatch',t.id,'small')}<div id="match-preview"></div>`,{form:'proposal',id:t.id,wide:true,submit:'提交审批'})}
function proposalFromForm(f){const d=Object.fromEntries(new FormData(f));return{type:d.type,refund:Math.round(Number(d.refund)*100),compensation:Math.round(Number(d.compensation)*100),content:d.content,consent:d.consent,account:d.account}}
function renderMobile(){const rid=location.hash.split('/')[2],t=ticket(rid);if(rid){if(!t||!E.canView(S,t,S.actor)){$('#app').innerHTML=`<div class="mobile-shell"><div class="mobile-top"><a href="#/mobile">${I('back')}</a><strong>工单详情</strong>${roleSelect()}</div>${empty('工单不存在或没有访问权限')}</div>`;return}const actionable=E.isPending(S,t,S.actor);$('#app').innerHTML=`<div class="mobile-shell"><header class="mobile-top"><a href="#/mobile" aria-label="返回工单列表">${I('back')}</a><strong>工单详情</strong>${moreMenu(t)}</header><div class="mobile-subbar"><span>${t.id}</span>${roleSelect()}</div><div class="mobile-content"><div class="spread">${stateTag(t)}<span class="sub">${due(t)}</span></div><h1 class="mobile-detail-title">${esc(t.title)}</h1><div class="mobile-tags">${badges(t)}<span class="sub">主责 ${name(t.owner)}</span></div>${t.level===4||t.repeat?`<div class="banner red">${I('shield')} ${t.level===4?'四级风险':''}${t.repeat?' · 重复投诉':''} · ${t.riskAck?'已完成结案风险复核':t.state==='待回访'?'待结案风险复核':'结案前需风险复核'}</div>`:''}<div class="task-callout"><div class="mobile-tasktitle">${actionable?'待我处理':'当前节点'}</div><div class="spread"><h3>${esc(taskLabel(t))}</h3><span class="sub">${shownTaskPeople(t).map(name).join('、')||'已完成'}</span></div><div class="sub">整单截止 ${t.deadline?date(t.deadline):'待设定'}</div>${t.state==='待方案审批'||t.state==='待打款'?`<div class="detail-amount">${money((t.proposal?.refund||0)+(t.proposal?.compensation||0))}</div><p>${esc(t.proposal?.content)}</p>${t.state==='待打款'?'<p class="sub">'+esc(t.proposal?.account)+'</p>':'<p class="sub">'+esc(t.approval?.scene)+' · V'+t.approval?.version+'</p>'}`:`<p>${esc(t.logs[0]?.body||t.description)}</p>`}</div><div class="card"><h3>客户与诉求</h3><div class="gap"></div>${dataRows([['客户',esc(t.name)],['联系电话',mask(t.phone)+' '+btn('查看','reveal',t.id,'link')],['门店',esc(t.store)],['诉求',esc(t.description)]])}</div><details class="mobile-details"><summary>订单与受理信息</summary><div>${info(t)}</div></details>${t.proposal?`<details class="mobile-details" ${['待方案审批','待打款'].includes(t.state)?'open':''}><summary>方案与审批付款</summary><div>${funding(t)}</div></details>`:''}<details class="mobile-details" open><summary>处理记录</summary><div>${timeline(t)}</div></details></div><footer class="mobile-footer">${actionButtons(t)||'<span class="muted">当前无待办操作</span>'}</footer></div>`}else{const all=filtered(),pg=pager(all.length),rows=all.slice((UI.page-1)*8,UI.page*8);$('#app').innerHTML=`<div class="mobile-shell"><header class="mobile-top"><a href="#/tickets" class="mini-link">电脑版</a><strong>客诉工单</strong>${canCreate()?btn(I('plus'),'create','','iconbtn','aria-label="新增工单"'):''}</header><div class="mobile-subbar"><span>客诉管理</span>${roleSelect()}</div><div class="tickets-query-panel">${tabs()}<form class="mobile-search" data-form="mobileSearch"><input name="q" aria-label="搜索工单" placeholder="工单号 / 客户 / 手机号" value="${esc(UI.filters.q)}"><button type="submit" class="iconbtn" aria-label="查询">${I('search')}</button>${btn(I('filter'),'mobileFilter','','iconbtn','aria-label="筛选工单"')}</form></div><div class="mobile-content mobile-list-content">${rows.length?rows.map(t=>`<a class="mobile-ticket ${t.level===4||t.repeat?'risky':''}" href="#/mobile/${t.id}"><div class="spread"><span class="ticket-no">${t.id}</span>${stateTag(t)}</div><div class="ticket-title">${esc(t.title)}</div><div class="sub">${esc(t.name)} · ${esc(t.store)}</div><div style="margin-top:9px">${badges(t)}<span class="sub">${esc(taskLabel(t))}</span></div><div class="mobile-ticket-footer"><span>${shownTaskPeople(t).map(name).join('、')||name(t.owner)}</span>${due(t)}</div></a>`).join(''):empty()}${pg}</div></div>`}}
async function onAction(act,id,el){
 if(act==='closeModal')return closeModal();if(act==='discardModal')return closeModal(true);
 if(act==='closeDrawer'){UI.drawer=null;UI.tab='info';$('#drawer-root').innerHTML='';history.replaceState(null,'','#/tickets');return}
 if(act==='detail'||act==='handle'){closeModal(true);UI.drawer=id;UI.tab=act==='handle'&&['待打款','待方案审批'].includes(ticket(id)?.state)?'fund':'info';location.hash=(mobile()?'#/mobile/':'#/tickets/')+id;if(!mobile())renderDrawer(id);return}
 if(act==='detailTab'){UI.tab=id;renderDrawer(UI.drawer);return}
 if(act==='view'){UI.view=id;UI.page=1;render();return}
 if(act==='page'){UI.page=+id;render();return}
 if(act==='refresh'){render();toast('已刷新');return}
 if(act==='resetFilters'){Object.keys(UI.filters).forEach(k=>UI.filters[k]=k==='sort'?'risk':'');UI.page=1;render();return}
 if(act==='moreFilters'){UI.more=!UI.more;$('#filter-form')?.classList.toggle('expanded',UI.more);return}
 if(act==='create')return createForm();
 if(['follow','assign','proposal','approve','reject','pay','payReturn','withdraw','review','complete','risk','repeat','escalate','bindOrder','call','reveal'].includes(act)){closeModal(true);return actionForm(act,id)}
 if(act==='previewMatch'){const p=proposalFromForm($('[data-form="proposal"]')),t=ticket(id),hits=E.matching(S,t,p);$('#match-preview').innerHTML=hits.length?`<div class="banner"><b>${esc(hits[0].name)} · V${hits[0].published.version}</b><p>${E.flatten(hits[0].published.nodes,E.context(t,p)).map(n=>esc(n.name)+'（'+n.people.map(name).join('、')+'）').join(' → ')}</p>${hits.length>1?'<div class="sub">按优先顺序命中首个场景</div>':''}</div>`:'<div class="banner red">没有可用审批场景，请联系负责人</div>';return}
 if(act==='appendExisting'||act==='repeatExisting'){const f=$('[data-form="create"]'),d=Object.fromEntries(new FormData(f));if(!d.description.trim())throw Error('请先填写本次投诉内容');const t=ticket(id),files=await readFiles(f.elements.files.files);let result=t;mutate(()=>{if(act==='appendExisting'){if(['已结案','已合并'].includes(t.state))throw Error('已结束工单请登记再次投诉');t.sources.push({channel:d.channel,at:Date.now(),content:d.description});t.attachments.push(...files);E.log(t,S.actor,'补充来源记录',d.channel+'；'+d.description);E.scan(S,t,S.actor,d.description)}else{result=E.repeat(S,t,S.actor,d.description);result.attachments.push(...files);result.sources[result.sources.length-1].channel=d.channel}});closeModal(true);location.hash=(mobile()?'#/mobile/':'#/tickets/')+result.id;UI.drawer=result.id;render();toast(act==='appendExisting'?'已补充到原工单':'已登记再次投诉');return}
 if(act==='mobileFilter'){const f=UI.filters;modal('筛选工单',`<div class="form-grid">${field('状态',select('state',E.STATES,f.state,'全部状态'))}${field('等级',select('level',[[1,'一级'],[2,'二级'],[3,'三级'],[4,'四级']],f.level,'全部等级'))}${field('门店',select('store',E.STORES,f.store,'全部门店'))}${field('来源',select('channel',E.CHANNELS,f.channel,'全部来源'))}${field('风险 / 时效',select('risk',[['high','四级'],['repeat','重复投诉'],['overdue','已超时'],['soon','即将超时']],f.risk,'全部'))}${field('排序',select('sort',[['risk','风险优先'],['new','最近受理'],['due','最近截止']],f.sort))}</div>`,{form:'mobileFilters',submit:'应用筛选'});return}
}
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action]');if(!el){const link=ev.target.closest('a[href^="#/"]');if(link){ev.preventDefault();location.hash=link.getAttribute('href');}return;}if(el.classList.contains('drawer-backdrop')&&ev.target.closest('[data-stop]'))return;ev.preventDefault();try{await onAction(el.dataset.action,el.dataset.id,el)}catch(e){toast(e.message)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if($('#modal-root').children.length)closeModal();else if(UI.drawer)onAction('closeDrawer','')}if(ev.key==='Tab'){const container=$('#modal-root .modal, #modal-root .drawer')||$('#drawer-root .drawer');if(!container)return;const elements=[...container.querySelectorAll('button:not(:disabled),summary,a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')].filter(x=>x.offsetParent!==null);const first=elements[0],last=elements[elements.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus()}}});
document.addEventListener('input',ev=>{if(ev.target.closest('#modal-root form'))UI.modalDirty=true;if(ev.target.closest('[data-form="create"]')&&['phone','member'].includes(ev.target.name))duplicateCandidates()});
document.addEventListener('change',ev=>{const f=ev.target.closest('[data-form="create"]');if(f&&ev.target.name==='order'){const o=S.orders.find(x=>x.id===ev.target.value);if(o){['name','phone','member','store','isNew'].forEach(k=>f.elements[k].value=o[k]);duplicateCandidates()}}});
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target;if(f.id==='filter-form'){Object.assign(UI.filters,Object.fromEntries(new FormData(f)));UI.page=1;render();return}const type=f.dataset.form;if(!type)return;const d=Object.fromEntries(new FormData(f)),id=f.dataset.id,t=ticket(id),submit=f.querySelector('[type=submit]');if(submit)submit.disabled=true;try{
 if(type==='mobileSearch'){UI.filters.q=d.q;UI.page=1;render();return}
 if(type==='mobileFilters'){Object.assign(UI.filters,d);UI.page=1;closeModal(true);render();return}
 if(type==='create'){if(UI.duplicates?.length&&!d.distinct)throw Error('请选择关联处理方式，或确认是不同事件');const files=await readFiles(f.elements.files.files);const nt=mutate(()=>E.create(S,S.actor,{...d,attachments:files}));closeModal(true);UI.drawer=nt.id;UI.view='all';location.hash=(mobile()?'#/mobile/':'#/tickets/')+nt.id;render();toast('工单已创建');return}
 if(type==='follow'){const files=await readFiles(f.elements.files.files);mutate(()=>E.follow(S,t,S.actor,{...d,connected:d.connected==='yes',files}))}
 else if(type==='assign')mutate(()=>E.assign(S,t,S.actor,d.owner,d.reason));
 else if(type==='proposal')mutate(()=>E.startApproval(S,t,S.actor,proposalFromForm(f)));
 else if(type==='approve'||type==='reject')mutate(()=>E.approve(S,t,S.actor,type==='approve',d.note));
 else if(type==='pay'){const proof=await readFiles(f.elements.proof.files);mutate(()=>E.pay(S,t,S.actor,{...d,amount:Math.round(+d.amount*100),proof}))}
 else if(type==='payReturn')mutate(()=>E.pay(S,t,S.actor,{result:'退回',reason:d.reason}));
 else if(type==='withdraw')mutate(()=>E.withdraw(S,t,S.actor,d.reason));
 else if(type==='review')mutate(()=>E.review(S,t,S.actor,d));
 else if(type==='complete')mutate(()=>E.completeNormal(S,t,S.actor,d.note));
 else if(type==='risk')mutate(()=>E.riskAck(S,t,S.actor,d.note));
 else if(type==='repeat'){const nt=mutate(()=>E.repeat(S,t,S.actor,d.note));if(nt.id!==t.id){UI.drawer=nt.id;location.hash=(mobile()?'#/mobile/':'#/tickets/')+nt.id}}
 else if(type==='escalate')mutate(()=>E.escalate(S,t,S.actor,d.level,d.note));
 else if(type==='bindOrder')mutate(()=>{if(!E.canHandle(S,t,S.actor))throw Error('没有关联权限');const o=S.orders.find(x=>x.id===d.order&&x.phone===t.phone);if(!o)throw Error('请选择本人客户的有效订单');if(t.proposal?.approved||t.approval?.status==='审批中')throw Error('请先撤回当前方案');Object.assign(t,{order:o.id,project:o.project,amount:o.paid,member:o.member,staff:o.staff});E.log(t,S.actor,'关联消费订单',o.external)});
 closeModal(true);render();toast('操作已完成');
 }catch(e){const slot=f.querySelector('.error-slot');if(slot)slot.innerHTML=`<div class="error-inline">${esc(e.message)}</div>`;else toast(e.message)}finally{if(submit?.isConnected)submit.disabled=false}
});

<script>
/* Configuration model derived from the ticket engine in this document. */
const ConfigModel=(()=>{
 const clone=E.clone;
 const roles=ids=>ids.every(id=>E.user(id));
 const eligible=E.USERS.filter(u=>['agent','lead','store'].includes(u.role)).map(u=>u.id);
 function snapshot(s){return {scenes:clone(s.scenes),rules:clone(s.rules)}}
 function normalize(c){
  c=clone(c);
  c.scenes.forEach(sc=>{const d=sc.published;d.approvalMode=sc.level===1?'none':'required';d.common=d.common||{mode:'legacy',handlers:[...eligible],dispatcher:c.rules.fallback,callbackMode:'owner',callback:'chen'};d.common.callback=d.common.callback||'chen';d.common.dispatcher=d.common.dispatcher||c.rules.fallback;});

 }
 function baseline(s){return normalize(snapshot(s))}
 function clean(c){const x=clone(c);x.scenes.forEach(s=>{delete s.history;delete s.draft;delete s.published.at;delete s.published.by;delete s.published.version});delete x.rules.grading.version;delete x.rules.riskConfig.version;return x;}
 function flat(x,p='',out={}){if(Array.isArray(x)){x.forEach((v,i)=>flat(v,p+'['+i+']',out));if(!x.length)out[p]='[]'}else if(x&&typeof x==='object'){Object.keys(x).forEach(k=>flat(x[k],p?p+'.'+k:k,out))}else out[p]=x;return out}
 function changes(a,b){const aa=flat(clean(a)),bb=flat(clean(b));return [...new Set([...Object.keys(aa),...Object.keys(bb)])].filter(k=>JSON.stringify(aa[k])!==JSON.stringify(bb[k])).map(k=>({path:k,before:aa[k],after:bb[k]}))}
 function validate(c){
  const errors=[],warnings=[];const add=(label,fn)=>{try{fn()}catch(e){errors.push(label+'：'+e.message)}};
  const ok=(v,m)=>{if(!v)throw Error(m)};
  ok(c&&c.rules&&Array.isArray(c.scenes),'配置格式不正确');
  add('等级流程',()=>ok(c.scenes.length===4&&[1,2,3,4].every(n=>c.scenes.filter(s=>s.level===n).length===1),'四个等级各保留一个处理流程'));
  for(const sc of c.scenes){add(sc.name,()=>{
   const d=sc.published,q=d.common;
   E.validateScene(sc,d);
   ok(sc.enabled,'所有等级流程必须启用');
   ok(['legacy','auto','manual'].includes(q.mode),'分派方式无效');
   ok(Array.isArray(q.handlers)&&q.handlers.length&&q.handlers.every(id=>eligible.includes(id)),'请至少选择一名有效承办人');
   if(q.mode==='auto')ok(q.handlers.some(id=>E.user(id)?.role==='agent'),'自动轮转至少需要一名售后专员');
   ok(E.user(q.dispatcher)?.role==='lead','待分派接收人须为负责人');
   ok(['owner','designated'].includes(q.callbackMode),'回访方式无效');
   if(q.callbackMode==='designated')ok(eligible.includes(q.callback),'请选择有效回访人');
   const ids=new Set();function walk(ns){ns.forEach(n=>{ok(n.id&&!ids.has(n.id),'节点标识重复');ids.add(n.id);if(n.type==='branch'){walk(n.yes);walk(n.no)}else if(n.type==='approval'){ok(E.user(n.fallback)?.role==='lead'||!n.configured,'审批兜底人员无效')}})}walk(d.nodes);
   const span=ns=>ns.reduce((a,n)=>a+(n.type==='branch'?Math.max(span(n.yes),span(n.no)):n.type==='approval'?+n.hours:0),0);
   const total=+d.stage.first + +d.stage.process + +d.stage.review+(sc.level>1?+d.stage.payment+span(d.nodes):0);
   if(d.totalHours&&total>d.totalHours)warnings.push(`${sc.name}：最长路径 ${total} 小时，超过整单目标 ${d.totalHours} 小时，节点需并行推进或提前完成。`);
  })}
  add('分级与风险',()=>{const r=c.rules;ok(r.grading.smallLimit===null||(Number.isFinite(r.grading.smallLimit)&&r.grading.smallLimit>0),'小额赔付上限应大于0或留空');ok(r.grading.serious?.trim(),'请填写三级判定说明');ok(Array.isArray(r.riskConfig.keywords)&&r.riskConfig.keywords.length&&r.riskConfig.keywords.every(x=>typeof x==='string'&&x.trim()),'至少保留一个风险词');ok(E.user(r.riskConfig.receiver)?.role==='lead','风险复核人须为负责人')});
  add('临期与超时',()=>{const r=c.rules.reminders;ok(Number.isFinite(r.warn)&&r.warn>0&&r.warn<=72,'提前提醒应为0到72小时之间');ok(Number.isFinite(r.repeat)&&r.repeat>0&&r.repeat<=72,'重复提醒应为0到72小时之间');ok(E.user(r.escalation)?.role==='lead','超时升级接收人无效')});
  add('默认分派',()=>{const r=c.rules;ok(E.user(r.fallback)?.role==='lead','默认分派负责人无效');ok(eligible.includes(r.channelOwner),'小程序渠道负责人无效');ok(r.onDuty.length&&r.onDuty.every(id=>E.user(id)?.role==='agent'),'请选择售后值班人员');for(const id of r.onDuty){const q=r.schedule[id];ok(q&&[q.start,q.end].every(v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v)),'值班时间格式不正确')}});
  return {errors,warnings};
 }
 function apply(s,c){const next=clone(s);next.rules=clone(c.rules);next.rules.warn=next.rules.reminders.warn;next.rules.keywords=clone(next.rules.riskConfig.keywords);next.scenes=clone(c.scenes);return next}
 function publish(s,c,base,note){
  if((s.configRevision||0)!==base)throw Error('生效版本已变化，请先加载最新版本，再合并草稿');
  const check=validate(c);if(check.errors.length)throw Error(check.errors[0]);

  next.scenes.forEach(sc=>{const old=s.scenes.find(x=>x.id===sc.id);sc.history=clone(old?.history||[]);const before=normalize(snapshot(s)).scenes.find(x=>x.id===sc.id);const same=JSON.stringify(clean({scenes:[before],rules:s.rules}).scenes)===JSON.stringify(clean({scenes:[sc],rules:c.rules}).scenes);sc.published.version=(old?.published.version||1)+(same?0:1);sc.published.at=now;sc.published.by='配置管理员';if(!same&&old)sc.history.push(clone(old.published));sc.draft=null;});

  next.configHistory=[...(s.configHistory||[]),{revision:next.configRevision,at:now,note:note||'更新客诉办理规则',changes:diff,before:snapshot(s),after:snapshot(next)}];

 }
 function simulate(s,c,input){
  const check=validate(c);if(check.errors.length)throw Error(check.errors[0]);
  const tmp=apply(s,c);tmp.tickets=[];tmp.orders=[];tmp.sequence=900;tmp.round=0;
  const level=+input.level,refund=Math.round(+input.refund*100),compensation=Math.round(+input.compensation*100);
  if(![1,2,3,4].includes(level)||![refund,compensation].every(n=>Number.isSafeInteger(n)&&n>=0))throw Error('请填写有效等级与金额');
  tmp.orders.push({id:'TRIAL',phone:'13900009999',name:'试算客户',store:input.store,member:'TRIAL',isNew:'老客',project:'试算项目',paid:100000000,refunded:0});
  const t=E.create(tmp,'jiang',{name:'试算客户',phone:'13900009999',store:input.store,order:'TRIAL',title:'规则试算',description:input.content||'普通服务反馈',level,channel:input.channel,repeat:!!input.repeat});
  const assigned=t.owner,steps=[{title:'受理与定级',detail:`${level}级 → ${t.level}级${t.riskWords?.length?'；命中 '+t.riskWords.join('、'):''}`},{title:'分派工单',detail:assigned?(E.user(assigned).name+' · 自动分派'):'待负责人 '+E.user(t.flow.doc.common.dispatcher).name+' 手动分派'}];
  if(!t.owner){const common=t.flow.doc.common;const uid=common.handlers.find(id=>E.user(id)?.role!=='store'||E.user(id)?.store===t.store);if(!uid)throw Error('当前门店没有可用承办人');E.assign(tmp,t,'jiang',uid,'试算手动分派');}
  E.follow(tmp,t,t.owner,{content:input.content||'核实诉求',connected:true,method:'电话'});steps.push({title:'首次联系与处理',detail:`首联 ${t.flow.doc.stage.first}h · 处理 ${t.flow.doc.stage.process}h`});
  if(t.level===1){if(refund+compensation>0)throw Error('一级不支持资金方案，需要先升级工单');E.completeNormal(tmp,t,t.owner,'试算处理结果');steps.push({title:'处理结果',detail:'一级普通处理，无资金审批'});}
  else {E.startApproval(tmp,t,t.owner,{type:input.type,refund,compensation,content:'试算方案',consent:'客户已认可',account:'原支付渠道'});steps.push(...t.approval.steps.map(n=>({title:n.type==='approval'?'审批 · '+n.name:'抄送 · '+n.name,detail:n.people.map(id=>E.user(id).name).join('、')+(n.type==='approval'?` · ${n.mode==='all'?'全部同意':'任一同意'} · ${n.hours}h`:'')})));if(refund+compensation>0)steps.push({title:'财务打款',detail:E.user(t.flow.doc.finance).name+` · ${t.flow.doc.stage.payment}h · 金额 ¥${((refund+compensation)/100).toFixed(2)}`});}

CFG.section==='approval'?cfgCard('处理方案如何审批',sc.level===1?'一级仅支持非资金普通处理；产生退款或赔偿时必须先升级。':'按顺序执行审批与抄送，条件分支仅使用方案类型和金额。',sc.level===1?`<div class="cfg-simple-flow"><div>${I('ticket')}提交处理结果</div><span>→</span><div>${I('phone')}回访确认</div><span>→</span><div>${I('check')}结案</div></div>${cfgNote('一级不设置资金审批，保留原工单引擎的分级约束。')}`:`<div class="cfg-flow-toolbar"><span>资金以元填写 · 节点按顺序执行</span>${cfgButton('+ 添加根节点','add-node','root','primary')}</div><div class="cfg-flow-canvas"><div class="cfg-flow-cap">提交处理方案 · 客户已认可</div>${cfgNodes(d.nodes,'root')}<div class="cfg-flow-cap">有资金 → 财务打款 · 无资金 → 回访确认</div></div>${cfgNote('二级至少保留一个主干审批；三级、四级至少保留两个主干审批。分支内可追加审批或抄送。')}`):cfgCard('时限从何时开始计算','全部使用自然小时。工单总目标和各节点时限分别计时，不自动相加。',`<div class="cfg-form-grid">${cfgField('整单目标（小时）',p+'.totalHours',{type:'number',nullable:sc.level===4,help:sc.level===4?'四级可留空，表示整单目标待设定。':'从受理时间起算，发布后用于新受理与升级工单。'})}<div class="cfg-fixed"><span>计时方式</span><b>自然小时 / 全天连续计时</b></div></div><div class="cfg-time-rows">${[['first','首次联系','工单受理 → 首次有效沟通'],['process','处理方案','进入处理 → 提交有效方案或结果'],...(sc.level>1?[['payment','财务打款','审批通过 → 成功打款']]:[]),['review','回访确认','处理完成 / 打款成功 → 回访结果']].map(([k,label,desc])=>`<div><span><b>${label}</b><small>${desc}</small></span>${cfgField('时限（小时）',p+'.stage.'+k,{type:'number'})}</div>`).join('')}</div>${cfgNote('审批时限在每个审批节点中设置；驳回、撤回或财务退回后，重新计算处理节点时限。')}`);
return `<div class="cfg-grade-tabs">${CFG.draft.scenes.map((s,j)=>`<button class="${i===j?'active':''}" data-cfg="grade" data-id="${j}"><span class="pill l${s.level}">${['','一级','二级','三级','四级'][s.level]}</span><b>${esc(s.name)}</b><small>${s.published.totalHours?s.published.totalHours+'h 整单目标':'整单目标待设定'}</small></button>`).join('')}</div><div class="cfg-segment">${[['assignment','受理与分派'],['approval','方案与审批'],['sla','时限与回访']].map(([v,label])=>cfgButton(label,'section',v,CFG.section===v?'active':'')).join('')}</div>${body}`}
function cfgNodes(ns,list){return `<div class="cfg-node-list">${ns.map((n,i)=>n.type==='branch'?`<section class="cfg-branch"><div class="cfg-node cfg-condition"><div><span class="cfg-node-type">条件分支</span><b>${esc(n.name)}</b><small>${cfgCondition(n.condition)}</small></div><div class="cfg-node-actions">${cfgButton('编辑','node',n.id)}${cfgButton('↑','move',n.id+'|-1')}${cfgButton('↓','move',n.id+'|1')}${cfgButton('删除','delete-node',n.id)}</div></div><div class="cfg-branch-columns"><div><span class="cfg-branch-label">满足条件</span>${cfgNodes(n.yes,n.id+'|yes')}${cfgButton('+ 添加节点','add-node',n.id+'|yes','cfg-add')}</div><div><span class="cfg-branch-label">不满足条件</span>${cfgNodes(n.no,n.id+'|no')}${cfgButton('+ 添加节点','add-node',n.id+'|no','cfg-add')}</div></div></section>`:`<div class="cfg-node ${n.type==='cc'?'cfg-cc':''}"><div class="cfg-node-icon">${I(n.type==='cc'?'phone':'check')}</div><div class="cfg-node-content"><span class="cfg-node-type">${n.type==='cc'?'抄送节点':'审批节点 '+(i+1)}</span><b>${esc(n.name)}</b><small>${(n.people||[]).map(name).join('、')}${n.type==='approval'?` · ${n.mode==='all'?'全部同意':'任一同意'} · ${n.hours}h`:''}</small></div><div class="cfg-node-actions">${cfgButton('编辑','node',n.id)}${cfgButton('↑','move',n.id+'|-1')}${cfgButton('↓','move',n.id+'|1')}${cfgButton('删除','delete-node',n.id)}</div></div>`).join('')}${!ns.length?'<div class="cfg-empty-branch">直接进入下一环节</div>':''}</div>`}
function cfgCondition(c){return esc(({type:'方案类型',refund:'退款金额',compensation:'赔偿金额',total:'方案总额'})[c.field]+' '+({eq:'等于',ne:'不等于',gt:'大于',gte:'大于等于',lt:'小于',lte:'小于等于'})[c.op]+' '+c.value+(c.field==='type'?'':' 元'))}
function cfgRisk(){return `${cfgCard('分级判定','复用现有四级结构，金额标准用于提交方案时的校验。',`<div class="cfg-level-def"><div><span class="pill l1">一级</span><p>普通服务处理，无退款或赔偿。</p></div><div><span class="pill l2">二级</span><p>退款 / 小额赔付，超过赔付上限时提示升级三级。</p></div><div><span class="pill l3">三级</span><p>${esc(CFG.draft.rules.grading.serious)}</p></div><div><span class="pill l4">四级</span><p>命中风险词或人工升级，结案前必须复核。</p></div></div><div class="cfg-form-grid">${cfgField('二级小额赔付上限（元）','rules.grading.smallLimit',{type:'number',step:.01,nullable:true,help:'留空表示不设置金额分界。仅判断赔偿金额，不包含退款。'})}${cfgField('三级判定说明','rules.grading.serious',{type:'textarea',help:'作为人工定级说明；系统不依据此段文字自动判级。'})}</div>`)}${cfgCard('高风险识别','受理内容、追加投诉和跟进记录命中任一关键词，即升级四级。',`<div class="cfg-form-grid">${cfgField('风险关键词','rules.riskConfig.keywords',{type:'textarea',help:'使用顿号、逗号或换行分隔；按文字包含匹配。'})}${cfgField('结案风险复核人','rules.riskConfig.receiver',{values:cfgLead(),help:'四级与重复投诉进入回访环节后，由此人接收复核待办。'})}</div><div class="cfg-trigger"><span>命中任一关键词</span><b>→</b><span>升四级并保留风险标识</span><b>→</b><span>结案前负责人复核</span></div>${cfgNote('升级发生在审批或待打款期间时，原任务挂起，回到处理环节重新提交方案。')}`)}${cfgCard('重复投诉','重复投诉是风险标记，不自动改变投诉等级。',`<div class="cfg-boundary"><div><b>尚未结案</b><p>可追加到原工单，保存来源记录，并标记为重复投诉。</p></div><div><b>已经结案</b><p>新建关联工单，保留原工单结案记录。</p></div><div><b>准备结案</b><p>先完成负责人风险复核，再登记客户认可结果。</p></div></div>`)}`}
function cfgTiming(){return `${cfgCard('临期与超时策略','工单列表使用临期阈值，规则引擎计算超时接收人和下一次提醒时间。',`<div class="cfg-form-grid">${cfgField('提前多久视为临期（小时）','rules.reminders.warn',{type:'number',help:'距节点截止时间小于此值时标记临期。'})}${cfgField('超时后重复提醒间隔（小时）','rules.reminders.repeat',{type:'number'})}${cfgField('超时升级接收人','rules.reminders.escalation',{values:cfgLead()})}<div class="cfg-fixed"><span>原任务责任人</span><b>始终保留为超时提醒接收人</b></div></div>${cfgNote('本地页面展示提醒规则和待办预览；未连接钉钉、短信或服务端定时推送。')}`)}${cfgCard('用现有工单预览提醒','以下基于草稿策略即时计算，不会发送通知。',`<div class="cfg-table-scroll"><table class="cfg-table"><thead><tr><th>工单</th><th>触发事项</th><th>接收人</th><th>下一次提醒</th></tr></thead><tbody id="cfg-reminder-rows">${cfgReminderRows()}</tbody></table></div>`)}`}
function cfgReminderRows(){const temp=E.clone(S);temp.rules=E.clone(CFG.draft.rules);return temp.tickets.flatMap(t=>E.ruleTasks(temp,t).filter(x=>x.title!=='处理中'&&x.title!=='待首联').slice(0,2).map(n=>`<tr><td><b>${esc(t.id)}</b><small>${esc(t.title)}</small></td><td>${esc(n.title)}</td><td>${n.people.map(name).join('、')}</td><td>${n.nextAt?date(n.nextAt):'事件触发'}</td></tr>`)).slice(0,12).join('')||'<tr><td colspan="4">暂无触发的提醒</td></tr>'}
function cfgTrial(){const v=CFG.trialInput||{level:'2',channel:E.CHANNELS[0],store:E.STORES[0],type:'退款',refund:'6000',compensation:'0',content:'客户申请退还未使用项目',repeat:false};return `<div class="cfg-trial-layout">${cfgCard('输入一笔业务场景','在发布前检查定级、承办人、审批路径与时效。',`<form data-cfg-form="trial"><div class="cfg-form-grid">${field('投诉等级',select('level',[[1,'一级'],[2,'二级'],[3,'三级'],[4,'四级']],v.level))}${field('来源渠道',select('channel',E.CHANNELS,v.channel))}${field('所属门店',select('store',E.STORES,v.store))}${field('方案类型',select('type',['普通处理','退款','赔偿','退款＋赔偿'],v.type))}${field('退款金额（元）',inp('refund',v.refund,'number',true,'min="0" step="0.01"'))}${field('赔偿金额（元）',inp('compensation',v.compensation,'number',true,'min="0" step="0.01"'))}${field('投诉 / 跟进内容',txt('content',v.content),true)}<label class="cfg-checkbox"><input type="checkbox" name="repeat" ${v.repeat?'checked':''}>同一客户重复投诉</label></div><div class="cfg-trial-actions"><button type="submit" class="primary">${I('check')} 运行草稿试算</button><span>同时对比当前生效版本</span></div></form>`)}${cfgCard('预期办理路径','直接调用工单的分派、定级和审批逻辑进行推演。',CFG.trial?cfgTrialResult(CFG.trial):`<div class="cfg-trial-empty">${I('flow')}<h3>先试算，再发布</h3><p>输入金额或风险内容，检查这笔工单会交给谁处理。</p></div>`)}</div>`}
function cfgTrialResult(r){return `${r.error?`<div class="cfg-error">${esc(r.error)}</div>`:`<div class="cfg-result-head"><span class="pill l${r.draft.level}">${r.draft.level}级流程</span><b>${r.draft.total?r.draft.total+'h 整单目标':'整单目标待设定'}</b><span class="cfg-chip">草稿</span></div><ol class="cfg-result-steps">${r.draft.steps.map(s=>`<li><b>${esc(s.title)}</b><p>${esc(s.detail)}</p></li>`).join('')}</ol><small class="cfg-muted">${esc(r.draft.warning)}</small>`}<details class="cfg-compare" open><summary>与生效版本对比</summary>${r.liveError?`<p>生效版本：${esc(r.liveError)}</p>`:r.live?`<p>生效版本：${r.live.level}级 · ${r.live.total?r.live.total+'h':'未设整单时限'}</p><p>${r.live.steps.filter(s=>s.title.startsWith('审批')).map(s=>esc(s.detail)).join(' → ')||'无审批节点'}</p>`:''}${r.draft&&r.live?`<b>${JSON.stringify(r.draft.steps)===JSON.stringify(r.live.steps)&&r.draft.total===r.live.total?'本次场景的办理结果一致':'本次场景的办理结果发生变化，请核对上方路径'}</b>`:''}</details>`}
function cfgHistory(){const records=[...(S.configHistory||[])].reverse();return cfgCard('发布记录','每次发布保留规则快照。恢复历史版本会先生成草稿，经试算与发布后生效。',records.length?`<div class="cfg-history">${records.map(r=>`<article><div class="cfg-history-version">V${r.revision}</div><div><h3>${esc(r.note)}</h3><p>${date(r.at)} · 配置管理员 · ${r.changes.length} 项字段变化</p><details><summary>查看变更内容</summary>${cfgDiff(r.changes)}</details></div><div class="cfg-history-actions">${cfgButton('从此版本创建草稿','restore',r.revision)}${cfgButton('从发布前版本创建草稿','restore-before',r.revision,'ghost')}</div></article>`).join('')}</div>`:`<div class="cfg-trial-empty">${I('clock')}<h3>尚未发布配置变更</h3><p>V0 为当前工单页面内置规则，首次发布后开始记录版本。</p></div>`)}
function cfgPath(path){const match=path.match(/^scenes\[(\d+)\]\.(.*)/);let s=path;if(match)s=CFG.draft.scenes[+match[1]]?.name+' / '+match[2];const labels={'published.':'','rules.':'全局 / ','common.':'分派 / ','handlers':'承办范围','dispatcher':'待分派接收人','callbackMode':'回访方式','callback':'回访人','mode':'办理方式','totalHours':'整单时限','stage.':'节点时限 / ','first':'首联','process':'处理','payment':'打款','review':'回访','finance':'财务','cc':'协作人员','nodes':'审批节点','people':'人员','hours':'时限','name':'名称','condition':'条件','field':'判定字段','value':'阈值','op':'比较方式','riskConfig.':'风险 / ','keywords':'关键词','receiver':'复核人','reminders.':'提醒 / ','repeat':'重复间隔','warn':'临期提前量','escalation':'升级接收人','grading.':'分级 / ','smallLimit':'小额赔付上限','serious':'三级判定说明'};for(const [a,b]of Object.entries(labels))s=s.replaceAll(a,b);return s;}
function cfgDiff(ds){return `<div class="cfg-table-scroll"><table class="cfg-table cfg-diff"><thead><tr><th>变更项</th><th>原值</th><th>新值</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${esc(cfgPath(d.path))}</td><td>${esc(d.before??'未设置')}</td><td>${esc(d.after??'未设置')}</td></tr>`).join('')}</tbody></table></div>`}
function renderConfig(){if(!CFG.draft)cfgLoad();CFG.page=location.hash.split('/')[2]||'overview';if(!CFG_PAGES.some(x=>x[0]===CFG.page))CFG.page='overview';document.body.classList.remove('is-mobile','workflow-mobile');document.body.classList.add('is-config');$('#drawer-root').innerHTML='';$('#modal-root').innerHTML='';const page=CFG_PAGES.find(x=>x[0]===CFG.page);const bodies={overview:cfgOverview,flows:cfgFlow,risk:cfgRisk,timing:cfgTiming,trial:cfgTrial,history:cfgHistory};$('#app').innerHTML=`<div class="cfg-app"><aside class="cfg-sidebar"><a class="cfg-brand" href="#/config"><div>${I('ticket')}</div><span>客诉管理<small>业务配置中心</small></span></a><div class="cfg-nav-label">工作空间</div><nav>${CFG_PAGES.map(([id,title,icon])=>`<a href="#/config/${id}" class="${id===CFG.page?'active':''}">${I(icon)}${title}${id==='flows'?'<span>4</span>':''}</a>`).join('')}</nav><div class="cfg-sidebar-bottom"><span class="cfg-status-dot"></span>本地交互原型<small>配置与工单共用同一份业务规则</small><a href="#/tickets">${I('back')} 返回工单列表</a></div></aside><main class="cfg-main"><header class="cfg-topbar"><div><span>客诉管理</span><b>/</b><strong>配置后台</strong></div><div class="cfg-topbar-right"><span class="cfg-version">生效 V${S.configRevision||0}</span><a href="#/tickets">查看工单 ${I('arrow')}</a><span class="cfg-avatar">配</span></div></header><div class="cfg-page"><div class="cfg-page-heading"><div><div class="cfg-eyebrow">COMPLAINT WORKFLOW</div><h1>${page[1]}</h1><p>${({overview:'从业务流转出发，让每一笔客诉有清晰的处理规则。',flows:'按等级配置人员、审批和时限，办理过程保留版本依据。',risk:'把风险识别和结案复核放到同一条规则链中。',timing:'明确谁在何时接收提醒，避免责任悬空。',trial:'在草稿中验证真实办理路径，再决定是否发布。',history:'每次变更有据可查，历史规则可以重新生成草稿。'})[CFG.page]}</p></div><div class="cfg-heading-actions"><span id="cfg-save-status">${CFG.dirty?'草稿已自动保存':'与生效版本一致'}</span>${cfgButton('放弃草稿','discard','','ghost')}${cfgButton('检查并发布','preview','','primary')}</div></div>${CFG.conflict?cfgNote('另一窗口发布了新版本。当前草稿已保留，请导出草稿备份或放弃草稿后加载最新版本，再重新合并修改。','warn'):''}<div class="cfg-mobile-warning">配置后台适合在电脑宽屏中使用。</div>${bodies[CFG.page]()}</div><footer class="cfg-page-footer"><span>自然小时 · 发布前校验 · 在途工单保留流程快照</span><div>${cfgButton('导出草稿','export','','ghost')}${cfgButton('导入配置','import','','ghost')}<input id="cfg-import" type="file" accept="application/json,.json" hidden></div></footer></main></div><div id="cfg-overlay"></div>`;}
function cfgModal(title,body,footer=''){const root=$('#cfg-overlay');root.innerHTML=`<div class="cfg-modal-backdrop"><section class="cfg-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${title}</h2>${cfgButton(I('close'),'close-modal','','iconbtn')}</header><div class="cfg-modal-body">${body}</div>${footer?`<footer>${footer}</footer>`:''}</section></div>`;setTimeout(()=>root.querySelector('input,button')?.focus(),20)}
function cfgFindNode(id,list=CFG.draft.scenes[CFG.grade].published.nodes){for(let i=0;i<list.length;i++){if(list[i].id===id)return{node:list[i],list,index:i};if(list[i].type==='branch'){const x=cfgFindNode(id,list[i].yes)||cfgFindNode(id,list[i].no);if(x)return x}}}
function cfgNodeList(where){if(where==='root')return CFG.draft.scenes[CFG.grade].published.nodes;const[id,side]=where.split('|');return cfgFindNode(id).node[side]}
function cfgNodeModal(id,where){CFG.node=id?{data:E.clone(cfgFindNode(id).node),id}:{data:{id:E.id(),type:'approval',name:'审批节点',people:['jiang'],mode:'any',hours:4,configured:true,fallback:'gu'},where};cfgNodeForm();}
function cfgNodeForm(){const n=CFG.node.data;cfgModal(CFG.node.id?'编辑节点':'添加节点',`<form id="cfg-node-form" data-cfg-form="node"><div class="cfg-form-grid">${field('节点类型',`<select name="type" id="cfg-node-type" ${CFG.node.id?'disabled':''}>${options([['approval','审批'],['cc','抄送'],['branch','条件分支']],n.type)}</select>`)}${field('节点名称',inp('name',n.name,'text',true,'maxlength="40"'))}${n.type==='branch'?`${field('判定字段',`<select name="field" id="cfg-condition-field">${options([['refund','退款金额'],['compensation','赔偿金额'],['total','方案总额'],['type','方案类型']],n.condition?.field||'refund')}</select>`)}${field('比较方式',select('op',(n.condition?.field==='type'?[['eq','等于'],['ne','不等于']]:[['gte','大于等于'],['gt','大于'],['lte','小于等于'],['lt','小于'],['eq','等于']]),n.condition?.op||'gte'))}${field('条件值',n.condition?.field==='type'?select('value',['普通处理','退款','赔偿','退款＋赔偿'],n.condition?.value):inp('value',n.condition?.value||'5000','number',true,'min="0" step="0.01"'))}`:`<div class="cfg-field cfg-span"><span>${n.type==='approval'?'审批人':'抄送人员'}</span><div class="cfg-people">${E.USERS.filter(u=>n.type==='approval'?u.role==='lead':u.role!=='admin').map(u=>`<label><input type="checkbox" name="people" value="${u.id}" ${n.people?.includes(u.id)?'checked':''}><span>${u.name}<small>${u.title}</small></span></label>`).join('')}</div></div>${n.type==='approval'?`${field('多人审批方式',select('mode',[['any','任意一人同意'],['all','全部人员同意']],n.mode))}${field('审批时限（小时）',inp('hours',n.hours,'number',true,'min="0.1" max="720" step="0.1"'))}${field('申请人与审批人相同时转交给',select('fallback',cfgLead(),n.fallback||'gu'),true)}`:''}`}</div><div id="cfg-node-error" class="cfg-error" hidden></div></form>`,`${cfgButton('取消','close-modal')}<button class="primary" type="submit" form="cfg-node-form">应用到草稿</button>`);}
function cfgPreview(){const {errors,warnings}=ConfigModel.validate(CFG.draft),ds=ConfigModel.changes(ConfigModel.baseline(S),CFG.draft);cfgModal('发布前检查',`${errors.length?`<div class="cfg-error"><b>请先修正 ${errors.length} 项问题</b><ul>${errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:cfgNote('规则校验通过。发布将更新新工单的办理依据，并立即更新全局风险与提醒策略。')}${warnings.length?`<details class="cfg-warnings"><summary>${warnings.length} 项时限提示</summary><ul>${warnings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}<h3 class="cfg-diff-title">${ds.length} 项字段变更 · V${S.configRevision||0} → V${(S.configRevision||0)+1}</h3>${ds.length?cfgDiff(ds):'<p>暂无配置变更。</p>'}<label class="cfg-field"><span>发布说明 *</span><input id="cfg-publish-note" placeholder="例如：二级退款增加金额审批分支" maxlength="120"></label>`,`${cfgButton('继续编辑','close-modal')}<button class="primary" data-cfg="publish" ${errors.length||!ds.length||CFG.conflict?'disabled':''}>确认发布 V${(S.configRevision||0)+1}</button>`);}
function cfgLatest(){try{const live=JSON.parse(localStorage.getItem(KEY));if(live?.version===4)return live}catch{}return S;}
const ticketRender=render;
render=function(){document.body.classList.toggle('is-config',location.hash.startsWith('#/config'));if(location.hash.startsWith('#/config'))renderConfig();else ticketRender();};
document.addEventListener('input',ev=>{const el=ev.target;if(el.matches('[data-bind]')){let v=el.value;if(el.dataset.parse==='number')v=+v;else if(el.dataset.parse==='nullable')v=v===''?null:+v;else if(el.dataset.parse==='words')v=[...new Set(v.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean))];cfgSet(CFG.draft,el.dataset.bind,v);cfgStore();}if(el.matches('[data-list-bind]')){const key=el.dataset.listBind;const ids=[...document.querySelectorAll(`[data-list-bind="${key}"]:checked`)].map(x=>x.value);cfgSet(CFG.draft,key,ids);cfgStore();}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.matches('[data-bind]')&&['mode','callbackMode'].some(x=>el.dataset.bind.endsWith('.'+x)))renderConfig();if(el.id==='cfg-node-type'){CFG.node.data.type=el.value;CFG.node.data.name=({approval:'审批节点',cc:'抄送节点',branch:'金额条件'})[el.value];if(el.value==='branch')Object.assign(CFG.node.data,{condition:{field:'refund',op:'gte',value:'5000'},yes:[],no:[]});cfgNodeForm();}if(el.id==='cfg-condition-field'){CFG.node.data.name=$('#cfg-node-form [name=name]').value;CFG.node.data.condition={field:el.value,op:el.value==='type'?'eq':'gte',value:el.value==='type'?'退款':'5000'};cfgNodeForm();}if(el.id==='cfg-import'&&el.files[0]){try{if(el.files[0].size>1024*1024)throw Error('配置文件请小于1MB');const x=JSON.parse(await el.files[0].text());if(x.format!=='complaint-config-v1')throw Error('请选择本后台导出的配置文件');const check=ConfigModel.validate(x.config);if(check.errors.length)throw Error(check.errors[0]);CFG.pendingImport=x.config;cfgModal('导入为草稿',`<p>导入后覆盖当前草稿，当前生效规则和工单不受影响。</p><p>配置文件：${esc(el.files[0].name)}</p>`,cfgButton('取消','close-modal')+cfgButton('确认导入','do-import','','primary'));}catch(e){toast(e.message)}}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-cfg]');if(!b)return;ev.preventDefault();const a=b.dataset.cfg,id=b.dataset.id;try{
 if(a==='grade'){CFG.grade=+id;if(CFG.page!=='flows')location.hash='#/config/flows';else renderConfig();}
 if(a==='section'){CFG.section=id;renderConfig()}
 if(a==='preview')cfgPreview();
 if(a==='close-modal')$('#cfg-overlay').innerHTML='';
 if(a==='node')cfgNodeModal(id);
 if(a==='add-node')cfgNodeModal(null,id);
 if(a==='delete-node'){const f=cfgFindNode(id);f.list.splice(f.index,1);cfgStore();renderConfig()}
 if(a==='move'){const[n,offset]=id.split('|'),f=cfgFindNode(n),to=f.index+ +offset;if(to>=0&&to<f.list.length){[f.list[f.index],f.list[to]]=[f.list[to],f.list[f.index]];cfgStore();renderConfig()}}
 if(a==='discard')cfgModal('放弃当前草稿','<p>将重新加载当前生效版本。工单记录不受影响。</p>',cfgButton('保留草稿','close-modal')+cfgButton('放弃并重新加载','do-discard','','danger'));
 if(a==='do-discard'){S=cfgLatest();localStorage.removeItem(CFG_KEY);CFG.conflict=false;cfgLoad();renderConfig();toast('已加载生效版本')}
 if(a==='publish'){const note=$('#cfg-publish-note').value.trim();if(!note)throw Error('请填写发布说明');const live=cfgLatest(),next=ConfigModel.publish(live,CFG.draft,CFG.base,note);localStorage.setItem(KEY,JSON.stringify(next));S=next;localStorage.removeItem(CFG_KEY);CFG.conflict=false;cfgLoad();renderConfig();toast('V'+S.configRevision+' 已发布')}
 if(a==='restore'||a==='restore-before'){const rec=S.configHistory.find(r=>r.revision===+id);CFG.pendingImport=ConfigModel.normalize(a==='restore'?rec.after:rec.before);cfgModal('从历史版本创建草稿','<p>会替换当前草稿，发布前不会改变当前生效规则。</p>',cfgButton('取消','close-modal')+cfgButton('创建草稿','do-import','','primary'));}
 if(a==='do-import'){CFG.draft=E.clone(CFG.pendingImport);CFG.base=S.configRevision||0;CFG.conflict=false;cfgStore();renderConfig();toast('已生成草稿，请试算后发布')}
 if(a==='export'){const blob=new Blob([JSON.stringify({format:'complaint-config-v1',at:Date.now(),config:CFG.draft},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='客诉规则草稿.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 if(a==='import')$('#cfg-import').click();
}catch(e){toast(e.message)}});
document.addEventListener('submit',ev=>{const f=ev.target,type=f.dataset.cfgForm;if(!type)return;ev.preventDefault();const d=Object.fromEntries(new FormData(f));try{
 if(type==='node'){const n=E.clone(CFG.node.data);n.name=d.name.trim();if(!n.name)throw Error('请填写节点名称');if(n.type==='branch'){n.condition={field:d.field,op:d.op,value:d.value};n.yes=n.yes||[];n.no=n.no||[];}else{n.people=new FormData(f).getAll('people');if(!n.people.length)throw Error('请至少选择一人');if(n.type==='approval'){Object.assign(n,{mode:d.mode,hours:+d.hours,fallback:d.fallback,configured:true,source:'people'});if(!(n.hours>0&&n.hours<=720))throw Error('审批时限应为0到720小时之间')}}if(CFG.node.id){const x=cfgFindNode(CFG.node.id);x.list[x.index]=n}else cfgNodeList(CFG.node.where).push(n);cfgStore();renderConfig();toast('节点已应用到草稿')}
 if(type==='trial'){d.repeat=!!d.repeat;CFG.trialInput=d;const r={};try{r.draft=ConfigModel.simulate(S,CFG.draft,d)}catch(e){r.error=e.message}try{r.live=ConfigModel.simulate(S,ConfigModel.baseline(S),d)}catch(e){r.liveError=e.message}CFG.trial=r;renderConfig()}
}catch(e){const slot=$('#cfg-node-error');if(slot){slot.hidden=false;slot.textContent=e.message}else toast(e.message)}});
document.addEventListener('keydown',ev=>{const dialog=$('#cfg-overlay [role=dialog]');if(!dialog)return;if(ev.key==='Escape'){$('#cfg-overlay').innerHTML='';ev.preventDefault()}if(ev.key==='Tab'){const list=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea')],first=list[0],last=list.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
window.addEventListener('storage',ev=>{if(ev.key===KEY&&CFG.draft){CFG.conflict=CFG.base!==(S.configRevision||0);if(location.hash.startsWith('#/config'))renderConfig()}});
render();

</script>
</body>
</html>
