.staff-binding{max-width:100%;font-size:11px;line-height:1.4;overflow-wrap:anywhere}
.staff-binding-label{color:#748197}
.staff-binding-names{min-width:0;color:#43516a;overflow-wrap:anywhere}.staff-binding .staff-binding-names{color:#748197}
.staff-binding-names.unbound{color:#7b8799}
.staff-card-actions{min-height:40px;flex:0 0 auto;border-top:1px solid #eff1f5;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 12px}
.workbench-btn{height:28px;border:0;border-radius:6px;background:transparent;color:var(--brand);padding:0 5px;font-size:12px;font-weight:550;display:inline-flex;align-items:center;gap:5px;transition:background .15s,color .15s}
.workbench-btn .ui-icon{width:14px;height:14px;stroke-width:1.7}
.workbench-btn:hover{background:var(--brand-soft);color:var(--brand)}
.workbench-btn:active{background:#e1eaff;color:var(--brand)}
.workbench-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.rare-menu{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:#8c98aa;display:grid;place-items:center}
.rare-menu:hover{background:#f3f5f8;color:#475467}
.staff-card-actions button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.account-empty{grid-column:1/-1;display:none;place-items:center;min-height:240px;color:var(--sub);text-align:center}
.account-empty.show{display:grid}
@media(max-width:1220px){.account-search{width:240px}}

.account-grid.is-list{display:block;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff}
.staff-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;text-align:left}
.staff-table th{position:sticky;top:0;z-index:1;background:#f7faff;color:#536176;font-weight:500;height:40px;padding:0 14px;border-bottom:1px solid var(--line)}
.staff-table td{height:52px;padding:8px 14px;border-bottom:1px solid #eff1f5;color:#43516a;overflow-wrap:anywhere}
.staff-table tbody tr:last-child td{border-bottom:0}.staff-table tbody tr:hover{background:#fafcff}
.staff-table .staff-card-head{gap:9px}
.staff-table-name{min-width:0;font-size:13px;font-weight:600;color:#25344b;overflow-wrap:anywhere}
.staff-row-actions{display:flex;align-items:center;gap:6px}.staff-table .number{font-variant-numeric:tabular-nums}
.account-state{display:inline-flex;align-items:center;gap:5px;width:max-content;padding:2px 7px;border-radius:5px;font-size:11px;line-height:17px;font-weight:500;color:var(--brand);background:#edf4ff;white-space:nowrap}.account-state:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.account-state.disabled{color:#ad7832;background:#fff5e8}
.workbench-btn:disabled{color:#a5adba;cursor:not-allowed;background:transparent}
.staff-action-menu{position:fixed;z-index:60;width:132px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(24,39,66,.13)}
.staff-action-menu[hidden]{display:none}.staff-action-menu button{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border:0;border-radius:5px;background:transparent;color:#475467;text-align:left;font-size:12px}
.staff-action-menu button:hover,.staff-action-menu button:focus-visible{background:#f1f5fb;outline:none}.staff-action-menu button.danger{color:#c94848}.staff-action-menu button.danger:hover{background:#fff3f3}.staff-action-menu .ui-icon{width:14px;height:14px}
.staff-dialog{width:400px;max-width:calc(100vw - 40px);padding:0;border:1px solid var(--line);border-radius:12px;color:var(--text);box-shadow:0 24px 80px rgba(16,24,40,.2)}
.staff-dialog::backdrop{background:rgba(24,35,52,.28)}.staff-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid #eff1f5}.staff-dialog-head h2{margin:0;font-size:16px;font-weight:600}
.staff-dialog-body{padding:20px}.staff-dialog-body p{margin:0;line-height:1.8;color:#667085;font-size:13px;overflow-wrap:anywhere}
.staff-form-field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;color:#536176;font-size:12px}.staff-form-field:last-child{margin-bottom:0}.staff-form-field .control{width:100%;height:34px;font-size:13px}.staff-form-field small{font-size:11px;color:#98a2b3}
.staff-dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid #eff1f5;background:#fafbfc}.staff-dialog .danger-btn{background:#c94848;border-color:#c94848}.staff-dialog .danger-btn:hover{background:#b33d3d}
.staff-dialog.is-account-form{width:640px}
.staff-form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 20px}
.staff-form-grid .staff-form-field{margin:0}.staff-form-grid label{font-weight:550;color:#475467}.staff-required{color:#dc2626;margin-left:3px}
@media(max-width:640px){.staff-form-grid{grid-template-columns:minmax(0,1fr)}}

/* WeCom accounts */
.wecom-page{padding:16px;flex-direction:column;gap:12px;overflow:hidden;background:#f8faff}
.wecom-page .account-toolbar-main,.staff-page .account-toolbar-main{flex-wrap:wrap}.wecom-page .account-search,.staff-page .account-search{width:270px}.wecom-company{height:30px;width:156px;font-size:12px}
.wecom-tabs{display:flex;gap:24px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.wecom-tab{height:35px;position:relative;display:flex;align-items:center;gap:7px;padding:0 2px 9px;border:0;background:transparent;color:#64748b;font-size:12px;white-space:nowrap}
.wecom-tab.active{color:var(--brand);font-weight:600}.wecom-tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;border-radius:2px;background:var(--brand)}
.wecom-tab-count{font-size:11px;color:#8490a3;font-variant-numeric:tabular-nums}.wecom-tab.active .wecom-tab-count{color:var(--brand)}
.wecom-results{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.wecom-results.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:minmax(224px,max-content);align-content:start;gap:12px;padding:2px 2px 12px;background:transparent;border:0;border-radius:0}
.wecom-card{min-width:0;display:flex;flex-direction:column;min-height:212px;overflow:hidden;border:1px solid #dfe6ef;border-radius:10px;background:#fff;box-shadow:0 2px 4px rgba(24,39,66,.025)}
.wecom-card:hover{border-color:#c1cfe3;box-shadow:0 6px 20px rgba(24,39,66,.055)}
.wecom-card-body{flex:1;padding:16px}.wecom-identity{min-width:0;display:flex;align-items:center;gap:9px}.wecom-name-block{min-width:0;flex:1}
.wecom-name{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;color:#25344b}.wecom-id{display:block;margin-top:3px;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#748197;overflow-wrap:anywhere}
.wecom-avatar{flex:0 0 32px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#eaf1ff;color:#5074b6;font-size:13px;font-weight:600}.wecom-avatar.purple{background:#f1edfc;color:#8c72b2}.wecom-avatar.sand{background:#f6f0e5;color:#947749}
.wecom-status{display:inline-flex;align-items:center;gap:5px;width:max-content;padding:2px 7px;border-radius:5px;font-size:11px;line-height:17px;font-weight:500;color:#6e798a;background:#f0f3f7;white-space:nowrap}
.wecom-status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.wecom-status.online{color:var(--brand);background:#edf4ff}.wecom-status.offline{color:#ad7832;background:#fff5e8}.wecom-status.pending{color:#738198;background:#f0f3f8}.wecom-status.disabled:before{display:none}
.wecom-card-status,.staff-card-status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}.wecom-status-note{font-size:11px;color:#7c8798;white-space:nowrap}
.wecom-meta,.staff-meta{margin:12px 0 0;display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:12px}.wecom-meta dt,.staff-meta dt{color:#748197}.wecom-meta dd,.staff-meta dd{margin:0;color:#43516a;overflow-wrap:anywhere}.wecom-meta time,.staff-meta time,.staff-table time{font-size:11px;font-variant-numeric:tabular-nums}
.wecom-archive{font-size:11px;color:#748197}.wecom-archive.enabled{color:#4775c8}
.wecom-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}.wecom-card>.wecom-actions{flex:0 0 auto;padding:5px 12px;border-top:1px solid #eff1f5;min-height:40px}.wecom-card>.wecom-actions .rare-menu{margin-left:auto}
.wecom-cloud-btn{height:28px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 5px;border:0;border-radius:6px;background:transparent;font-size:12px;white-space:nowrap}.wecom-cloud-btn{color:var(--brand);font-weight:550}.wecom-cloud-btn .ui-icon{width:14px;height:14px}.wecom-cloud-btn:hover{background:var(--brand-soft)}
.wecom-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;text-align:left}.wecom-table th{position:sticky;top:0;z-index:1;padding:0 14px;height:40px;background:#f7faff;border-bottom:1px solid var(--line);color:#536176;font-weight:500}.wecom-table td{height:66px;padding:10px 14px;border-bottom:1px solid #eff1f5;color:#43516a}.wecom-table tr:last-child td{border-bottom:0}.wecom-table tbody tr:hover{background:#fafcff}.wecom-table .wecom-status-note{display:block;margin-top:4px;font-size:10px}.wecom-table time{font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wecom-empty{display:grid;place-items:center;min-height:220px;grid-column:1/-1;text-align:center;font-size:12px;color:#748197}.wecom-empty strong{display:block;margin-bottom:6px;color:#536176;font-size:13px;font-weight:500}
.wecom-dialog{width:440px;max-width:calc(100vw - 40px);padding:0;border:1px solid var(--line);border-radius:12px;color:var(--text);box-shadow:0 24px 80px rgba(16,24,40,.2)}.wecom-dialog::backdrop{background:rgba(24,35,52,.28)}.wecom-dialog.cloud{width:660px}.wecom-dialog [hidden]{display:none}.wecom-dialog .wecom-meta{grid-template-columns:96px 1fr;gap:14px;margin:0}.wecom-dialog .wecom-status{vertical-align:middle}
.wecom-cloud-summary{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;gap:16px}.wecom-cloud-placeholder{min-height:238px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;border:1px solid #e1e9f7;border-radius:8px;background:#f7faff}.wecom-cloud-placeholder>.ui-icon{width:34px;height:34px;color:#7194db;stroke-width:1.4;margin-bottom:14px}.wecom-cloud-placeholder strong{font-size:14px;font-weight:550}.wecom-cloud-placeholder p{max-width:340px;margin:8px 0 0;font-size:12px;color:#748197;line-height:1.7}
.wecom-page button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}.wecom-dialog-body{padding:20px}.wecom-confirm-copy{margin:0;font-size:13px;line-height:1.8;color:#536176}
@media(max-width:1280px){.wecom-tabs,.account-tabs{gap:20px}.wecom-table td,.wecom-table th,.staff-table td,.staff-table th{padding-left:10px;padding-right:10px}.wecom-actions{gap:3px}.wecom-page .account-search,.staff-page .account-search{width:240px}}

.account-pagination{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;color:#64748b}
.pagination-summary{white-space:nowrap;font-variant-numeric:tabular-nums}.pagination-controls{display:flex;align-items:center;gap:12px}.pagination-size{height:28px;min-width:92px;padding:0 7px;border:1px solid var(--line-2);border-radius:6px;background:#fff;color:#536176;font-size:12px}
.pagination-pages{display:flex;align-items:center;gap:4px}.pagination-pages button{min-width:28px;height:28px;padding:0 7px;border:1px solid transparent;border-radius:6px;background:transparent;color:#64748b;font-size:12px;font-variant-numeric:tabular-nums;display:grid;place-items:center}.pagination-pages button:hover:not(:disabled){background:#f0f5ff;color:var(--brand)}.pagination-pages button[aria-current="page"]{background:#edf4ff;border-color:#dce7ff;color:var(--brand);font-weight:600}.pagination-pages button:disabled{color:#b8c0cd;cursor:default}.pagination-pages .ui-icon{width:13px;height:13px}.pagination-gap{padding:0 3px;color:#98a2b3}.account-pagination button:focus-visible,.pagination-size:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <nav class="primary" aria-label="一级菜单">
    <button class="mark" data-view="workbench" aria-label="企微客服中台"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h8M8 12h5M8 16h8"/></svg></button>
    <div class="primary-list" id="primaryList"></div>
    <button class="help" title="帮助"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 1 1 4.2 2.2c-1 .7-1.7 1.2-1.7 2.3"/><path d="M12 17h.01"/></svg></button>
  </nav>
  <aside class="secondary">
    <div class="sub-brand"><div class="sub-logo"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg></div><div><strong>企微客服中台</strong><span>管理后台</span></div></div>
    <nav class="sub-list" id="subList" aria-label="二级菜单"></nav>
  </aside>
  <section class="shell">
    <header class="top">
      <div class="crumb"><span id="crumbGroup">客服</span>&nbsp; / &nbsp;<b id="crumbPage">会话管理</b></div>
      <div class="top-actions"><button class="global-search">搜索功能 <span style="float:right">K</span></button><button class="icon-button" title="帮助"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 1 1 4.2 2.2c-1 .7-1.7 1.2-1.7 2.3"/><path d="M12 17h.01"/></svg></button><button class="icon-button" title="通知"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17H9"/><path d="M18 14v-3a6 6 0 0 0-12 0v3l-2 3h16z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><div class="avatar-admin"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></div></div>
    </header>
    <main class="main">
      <section class="view blank" id="view-workbench"></section>
      <section class="view wecom-page" id="view-wecom">
        <header class="account-header"><div><h1>企微帐号</h1><p id="wecomResultText" aria-live="polite"></p></div><button class="light-btn" id="wecomRefresh"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15-6.7L3 8M3 3v5h5M3 12a9 9 0 0 0 15 6.7L21 16M16 16h5v5"/></svg>刷新状态</button></header>
        <section class="account-toolbar" aria-label="企微帐号筛选">
          <div class="account-toolbar-main"><div class="account-search"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="wecomSearch" class="control" placeholder="搜索帐号名称 / 企微 ID" aria-label="搜索帐号名称或企微 ID"></div><select id="wecomCompany" class="control wecom-company" aria-label="企业主体"><option value="all">全部企业主体</option></select><button class="light-btn" id="wecomClear">重置</button></div>
          <div class="view-switch" aria-label="企微帐号视图切换"><button title="列表视图" aria-label="企微帐号列表视图" aria-pressed="false" data-wecom-layout="list"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button><button class="active" title="卡片视图" aria-label="企微帐号卡片视图" aria-pressed="true" data-wecom-layout="cards"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button></div>
        </section>
        <nav id="wecomTabs" class="wecom-tabs" role="tablist" aria-label="企微在线状态"></nav>
        <section id="wecomResults" class="wecom-results" role="tabpanel" aria-labelledby="wecom-tab-all" tabindex="0"></section>
        <nav id="wecomPagination" class="account-pagination" aria-label="企微帐号分页"></nav>
      </section>
      <section class="view staff-page active" id="view-staff">
        <header class="account-header">
          <div><h1>客服帐号</h1><p><span id="accountResultText" aria-live="polite"></span></p></div>
          <div class="account-top-actions">
            <button class="light-btn" data-toast="已刷新客服帐号"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7L21 16"/><path d="M16 16h5v5"/></svg>刷新</button>
            <button class="primary-btn" id="staffAddBtn"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增客服帐号</button>
          </div>
        </header>
        <section class="account-toolbar">
          <div class="account-toolbar-main">
            <div class="account-search"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="staffSearch" class="control" placeholder="搜索客服姓名 / 微动员工" aria-label="搜索客服姓名或微动员工"></div>
            <button id="staffSearchBtn" class="light-btn">搜索</button>
          </div>
          <div class="account-top-actions">
            <div class="view-switch" aria-label="视图切换"><button class="active" title="卡片视图" data-staff-layout="cards" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button><button title="列表视图" data-staff-layout="list" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></button></div>
            <button class="light-btn" data-toast="已导出当前结果"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>导出当前结果</button>
          </div>
        </section>
        <nav class="account-tabs" role="tablist" aria-label="客服业务分类">
          <button id="staff-tab-sales" class="account-tab active" role="tab" aria-selected="true" aria-controls="staffAccountGrid" data-staff-category="sales">线上销售<span class="account-tab-count" aria-hidden="true"></span></button>
          <button id="staff-tab-store" class="account-tab" role="tab" aria-selected="false" aria-controls="staffAccountGrid" tabindex="-1" data-staff-category="store">线下门店<span class="account-tab-count" aria-hidden="true"></span></button>
        </nav>
        <section id="staffAccountGrid" class="account-grid" role="tabpanel" aria-labelledby="staff-tab-sales" tabindex="0"></section>
        <nav id="staffPagination" class="account-pagination" aria-label="客服帐号分页"></nav>
      </section>
      <section class="view session-page" id="view-session">
        <section class="workspace">
          <div class="result-pane">
            <div class="result-head result-toolbar">
              <div class="toolbar-title-line"><div class="dimension dimension-tabs" role="tablist"><button data-dimension="staff" class="active">按客服帐号</button><button data-dimension="account">按企微帐号</button></div><button id="filterToggle" class="filter-trigger" title="高级筛选" aria-label="高级筛选"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button></div>
              <div class="toolbar-search-line">
                <div class="search-field"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="conversationSearch" class="control" placeholder="搜索"></div>
                <button id="sortToggle" class="sort-current" title="排序方式"><span id="sortLabel">跟进优先</span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
              </div>
            </div>

function accountUsesCards(kind){return (kind==='staff'?staffLayout:wecomLayout)==='cards'}
function accountPageSize(kind){
 const state=accountPaging[kind];if(!accountUsesCards(kind))return state.listSize;
 const grid=$(kind==='staff'?'#staffAccountGrid':'#wecomResults');
 if(grid.clientWidth){const columns=getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/);if(columns.every(column=>/^\d+(\.\d+)?px$/.test(column)))return columns.length*4}

}
function renderAccountPagination(kind,total){
 const state=accountPaging[kind],size=accountPageSize(kind);state.total=total;
 if(size!==state.size){state.page=Math.floor((state.page-1)*state.size/size)+1;state.size=size}
 if(accountUsesCards(kind))state.cardSize=size;
 const pageCount=Math.max(1,Math.ceil(total/state.size));state.page=Math.max(1,Math.min(state.page,pageCount));
 const start=(state.page-1)*state.size;
 const nearby=new Set([1,pageCount,...Array.from({length:5},(_,i)=>state.page+i-2)]);
 const pages=pageCount<=7?Array.from({length:pageCount},(_,i)=>i+1):[...nearby].filter(p=>p>=1&&p<=pageCount).sort((a,b)=>a-b);
 let previous=0;
 const numbers=pages.map(page=>{const gap=previous&&page-previous>1?'<span class="pagination-gap" aria-hidden="true">…</span>':'';previous=page;return gap+`<button type="button" data-page="${page}" aria-label="第 ${page} 页" ${page===state.page?'aria-current="page"':''} ${total?'':'disabled'}>${page}</button>`}).join('');
 $('#'+kind+'Pagination').innerHTML=`<span class="pagination-summary" aria-live="polite">共 ${total} 条${total?` · 第 ${start+1}–${Math.min(start+state.size,total)} 条`:''}</span><div class="pagination-controls">${accountUsesCards(kind)?`<span class="pagination-card-size">每页 4 行 · ${state.size} 条</span>`:`<select class="pagination-size" aria-label="每页条数">${[8,16,32,64].map(size=>`<option value="${size}" ${size===state.size?'selected':''}>${size} 条 / 页</option>`).join('')}</select>`}<div class="pagination-pages"><button type="button" data-page="${state.page-1}" aria-label="上一页" ${state.page===1?'disabled':''}><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>${numbers}<button type="button" data-page="${state.page+1}" aria-label="下一页" ${state.page===pageCount?'disabled':''}><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div>`;
 return start;
}

 const trigger=$('#staffAccountGrid').querySelector(`[data-staff-action="more"][data-id="${account.id}"]`);(trigger||$('#staffAccountGrid')).focus();
};
$$('[data-toast]').forEach(btn=>btn.onclick=()=>notify(btn.dataset.toast));
$$('[data-staff-layout]').forEach(btn=>btn.onclick=()=>{staffLayout=btn.dataset.staffLayout;renderStaffAccounts();$('#staffAccountGrid').scrollTop=0});
document.addEventListener('click',e=>{if(!e.target.closest('#staffActionMenu,[data-staff-action="more"]'))closeStaffMenu()});
window.addEventListener('resize',()=>closeStaffMenu());
document.addEventListener('scroll',()=>closeStaffMenu(),true);
document.addEventListener('click',closePanels);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});
$('#clearFilters').onclick=()=>{$('#dimensionSelect').value='all';$('#startDate').value='2026-06-01';$('#endDate').value='2026-06-30';$('#sourceFilter').value='all';$('#relationFilter').value='all';dimension='staff';openingFilter='all';dealFilter='all';quickStatus='all';$$('.dimension button').forEach(x=>x.classList.toggle('active',x.dataset.dimension==='staff'));populateDimensionSelect();applyFilters()};
$('.mark').onclick=()=>showView('workbench');
const startHash=location.hash.replace('#','');if(startHash&&document.getElementById('view-'+startHash)){activeView=startHash;activeGroup=findGroupByView(startHash)}
renderMenu();showView(activeView);populateDimensionSelect();applyFilters();renderStaffAccounts();

// Demonstration data. Online state must come from observation, never from opening a cloud session.
const wecomAccounts=[
 {id:'DY9516',name:'敬虔战队9516',company:'黛伊',status:'disabled',archive:false,lastActive:'09/19 17:34',avatar:'敬'},
 {id:'SL8006',name:'SL8006志鹏战队-白银钟',company:'瞬丽美',status:'online',archive:true,lastActive:'09/23 10:53',avatar:'白'},
 {id:'DY8808',name:'雨晴战队-程华静DY8808',company:'黛伊',status:'pending',archive:true,lastActive:'09/23 10:53',avatar:'雨'},
 {id:'SL1580',name:'志伟战队-刘敬林',company:'瞬丽美',status:'online',archive:true,lastActive:'09/23 10:39',avatar:'刘'},
 {id:'SL0906',name:'雨晴战队-康桉-HD0906',company:'瞬丽美',status:'pending',archive:true,lastActive:'09/22 13:36',avatar:'雨'},
 {id:'DY258',name:'文杰战队-张一鸣-DY258',company:'黛伊',status:'online',archive:true,lastActive:'09/22 17:00',avatar:'张'},
 {id:'SCZX115',name:'恒漾医疗-丹妮',company:'思梦妍',status:'offline',archive:true,lastActive:'09/23 10:45',avatar:'恒'},
 {id:'SL8005',name:'志鹏战队-叶柳英SL8005',company:'瞬丽美',status:'offline',archive:true,lastActive:'09/22 23:40',avatar:'叶'},
 {id:'17379415416',name:'恒漾-于静',company:'思梦妍',status:'disabled',archive:false,lastActive:'09/23 09:16',avatar:'恒'},
 {id:'SCZX118',name:'恒漾医疗眼袋-菲菲',company:'思梦妍',status:'disabled',archive:false,lastActive:'—',avatar:'菲'}
];
const wecomStatusLabels={all:'全部',online:'在线',offline:'离线',pending:'未观测',disabled:'已停用'};
let wecomStatus='all',wecomLayout='cards',wecomMenuTrigger=null,wecomPendingAction=null;
function wecomStatusBadge(a){return `<span class="wecom-status ${a.status}">${a.status==='pending'?'登录待确认':wecomStatusLabels[a.status]}</span>`}
function wecomStatusNote(a){return a.status==='pending'?'登录状态尚未确认':a.status==='offline'?'企微当前不在线':''}
function wecomIdentity(a){return `<div class="wecom-identity"><span class="wecom-avatar ${a.company==='黛伊'?'sand':a.company==='思梦妍'?'purple':''}" aria-hidden="true">${esc(a.avatar)}</span><div class="wecom-name-block"><strong class="wecom-name" title="${esc(a.name)}">${esc(a.name)}</strong><span class="wecom-id">${esc(a.id)}</span></div></div>`}
function wecomArchive(a){return `<span class="wecom-archive ${a.archive?'enabled':''}">${a.archive?'已开启':'未开启'}</span>`}
function wecomActionButtons(a){return `<button class="wecom-cloud-btn" data-wecom-action="cloud" data-id="${a.id}">${icon('phone')}登录云机</button><button class="rare-menu" data-wecom-action="more" data-id="${a.id}" aria-label="${esc(a.name)} 更多操作" aria-haspopup="menu" aria-expanded="false" aria-controls="wecomActionMenu">${icon('more')}</button>`}
function renderWecomAccounts(){
 const results=$('#wecomResults');results.classList.toggle('cards',wecomLayout==='cards');
 closeWecomMenu();
 const q=$('#wecomSearch').value.trim().toLowerCase(),company=$('#wecomCompany').value;
 const scope=wecomAccounts.filter(a=>(company==='all'||a.company===company)&&(!q||(a.name+' '+a.id).toLowerCase().includes(q)));
 const filtered=scope.filter(a=>wecomStatus==='all'||a.status===wecomStatus);
 const start=renderAccountPagination('wecom',filtered.length),pageAccounts=filtered.slice(start,start+accountPaging.wecom.size);
 $('#wecomResultText').textContent=`共 ${scope.length} 个帐号 · ${scope.filter(a=>a.status==='online').length} 个在线`;
 const tabs=$('#wecomTabs');
 if(!tabs.children.length)tabs.innerHTML=Object.entries(wecomStatusLabels).map(([key,label])=>`<button id="wecom-tab-${key}" class="wecom-tab" role="tab" data-wecom-status="${key}" aria-controls="wecomResults"><span>${label}</span><span class="wecom-tab-count" aria-hidden="true"></span></button>`).join('');
 tabs.querySelectorAll('button').forEach(btn=>{const status=btn.dataset.wecomStatus,active=status===wecomStatus;btn.classList.toggle('active',active);btn.setAttribute('aria-selected',String(active));btn.tabIndex=active?0:-1;btn.querySelector('.wecom-tab-count').textContent=scope.filter(a=>status==='all'||a.status===status).length});
 $$('[data-wecom-layout]').forEach(btn=>{const active=btn.dataset.wecomLayout===wecomLayout;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});
 results.setAttribute('aria-labelledby','wecom-tab-'+wecomStatus);
 const empty='<div class="wecom-empty"><div><strong>暂无匹配的企微帐号</strong>请调整状态、企业主体或搜索关键词</div></div>';
 if(wecomLayout==='cards'){
  results.innerHTML=pageAccounts.map(a=>`<article class="wecom-card" data-wecom-id="${a.id}" aria-label="${esc(a.name)}"> <div class="wecom-card-body">${wecomIdentity(a)}<div class="wecom-card-status">${wecomStatusBadge(a)}<span class="wecom-status-note">${wecomStatusNote(a)}</span></div><dl class="wecom-meta"><dt>企业主体</dt><dd>${esc(a.company)}</dd><dt>会话存档</dt><dd>${wecomArchive(a)}</dd><dt>最后活跃</dt><dd><time>${a.lastActive}</time></dd></dl></div><div class="wecom-actions">${wecomActionButtons(a)}</div></article>`).join('')||empty;
 }else{
  results.innerHTML=`<table class="wecom-table" aria-label="企微帐号列表"><colgroup><col style="width:26%"><col style="width:12%"><col style="width:14%"><col style="width:10%"><col style="width:14%"><col style="width:24%"></colgroup><thead><tr><th scope="col">企微帐号信息</th><th scope="col">企业主体</th><th scope="col">在线状态</th><th scope="col">会话存档</th><th scope="col">最后活跃</th><th scope="col">操作</th></tr></thead><tbody>${pageAccounts.map(a=>`<tr data-wecom-id="${a.id}"><td>${wecomIdentity(a)}</td><td>${esc(a.company)}</td><td>${wecomStatusBadge(a)}${wecomStatusNote(a)?`<span class="wecom-status-note">${wecomStatusNote(a)}</span>`:''}</td><td>${wecomArchive(a)}</td><td><time>${a.lastActive}</time></td><td><div class="wecom-actions">${wecomActionButtons(a)}</div></td></tr>`).join('')}</tbody></table>${filtered.length?'':empty}`;
 }
}
function closeWecomMenu(focus=false){const menu=$('#wecomActionMenu');if(!menu)return;menu.hidden=true;if(wecomMenuTrigger){wecomMenuTrigger.setAttribute('aria-expanded','false');if(focus&&wecomMenuTrigger.isConnected)wecomMenuTrigger.focus()}wecomMenuTrigger=null}
function openWecomMenu(btn,a){
 if(wecomMenuTrigger===btn){closeWecomMenu(true);return}closeWecomMenu();closeStaffMenu();wecomMenuTrigger=btn;
 const menu=$('#wecomActionMenu');menu.dataset.id=a.id;menu.innerHTML=`<button role="menuitem" data-wecom-menu-action="relogin">${icon('external')}重新登录</button><button role="menuitem" data-wecom-menu-action="toggle">${icon('power')}${a.status==='disabled'?'启用':'停用'}</button>`;menu.hidden=false;btn.setAttribute('aria-expanded','true');
 const r=btn.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(r.right-menu.offsetWidth,innerWidth-menu.offsetWidth-8))+'px';menu.style.top=(r.bottom+menu.offsetHeight+8>innerHeight?Math.max(8,r.top-menu.offsetHeight-5):r.bottom+5)+'px';menu.querySelector('button').focus();
}
function openWecomDialog(action,a){
 closeWecomMenu(true);wecomPendingAction={action,id:a.id};const cloud=action==='cloud'||action==='relogin';
 $('#wecomDialog').classList.toggle('cloud',cloud);$('#wecomDialogTitle').textContent=cloud?(action==='relogin'?'重新登录企微':'登录云机'):a.status==='disabled'?'启用企微帐号':'停用企微帐号';
 $('#wecomDialogConfirm').hidden=action!=='toggle';$('#wecomDialogCancel').textContent=action==='toggle'?'取消':'关闭';$('#wecomDialogConfirm').textContent=a.status==='disabled'?'启用':'停用';
 $('#wecomDialogBody').innerHTML=cloud?`<div class="wecom-cloud-summary">${wecomIdentity(a)}${wecomStatusBadge(a)}</div><div class="wecom-cloud-placeholder">${icon('phone')}<strong>云机暂未接入</strong><p>接入云机后，可在此查看画面并完成企微登录。</p></div>`:`<p class="wecom-confirm-copy">${a.status==='disabled'?'启用「'+esc(a.name)+'」后，将等待重新确认企微登录状态。':'确定停用「'+esc(a.name)+'」？后续可在更多操作中重新启用。'}</p>`;
 $('#wecomDialog').showModal();$('#wecomDialogCancel').focus();
}
$('#wecomCompany').innerHTML+=[...new Set(wecomAccounts.map(a=>a.company))].map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
$('#wecomSearch').oninput=$('#wecomCompany').onchange=()=>{accountPaging.wecom.page=1;refreshAccountPage('wecom')};
$('#wecomClear').onclick=()=>{$('#wecomSearch').value='';$('#wecomCompany').value='all';wecomStatus='all';accountPaging.wecom.page=1;refreshAccountPage('wecom')};
$('#wecomRefresh').onclick=()=>{renderWecomAccounts();notify('已刷新企微帐号列表')};
$$('[data-wecom-layout]').forEach(btn=>btn.onclick=()=>{wecomLayout=btn.dataset.wecomLayout;renderWecomAccounts();$('#wecomResults').scrollTop=0});
$('#wecomTabs').onclick=e=>{const btn=e.target.closest('[data-wecom-status]');if(!btn)return;wecomStatus=btn.dataset.wecomStatus;accountPaging.wecom.page=1;refreshAccountPage('wecom')};
$('#wecomTabs').onkeydown=e=>{const tabs=[...$('#wecomTabs').querySelectorAll('button')],index=tabs.indexOf(document.activeElement);if(index<0)return;const next=e.key==='ArrowRight'?(index+1)%tabs.length:e.key==='ArrowLeft'?(index+tabs.length-1)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:null;if(next!==null){e.preventDefault();tabs[next].focus();tabs[next].click()}};
$('#wecomResults').onclick=e=>{const btn=e.target.closest('[data-wecom-action]');if(!btn)return;const a=wecomAccounts.find(a=>a.id===btn.dataset.id);if(!a)return;if(btn.dataset.wecomAction==='more')openWecomMenu(btn,a);else openWecomDialog(btn.dataset.wecomAction,a)};
$('#wecomActionMenu').onclick=e=>{const btn=e.target.closest('[data-wecom-menu-action]');if(!btn)return;const a=wecomAccounts.find(a=>a.id===$('#wecomActionMenu').dataset.id);if(a)openWecomDialog(btn.dataset.wecomMenuAction,a)};
$('#wecomActionMenu').onkeydown=e=>{const items=[...$('#wecomActionMenu').querySelectorAll('button')],index=items.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();closeWecomMenu(true)}else if(e.key==='Tab')closeWecomMenu();else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();items[e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:items.length-1))%items.length].focus()}};
$('#wecomDialogClose').onclick=$('#wecomDialogCancel').onclick=()=>$('#wecomDialog').close();
$('#wecomDialogConfirm').onclick=()=>{if(wecomPendingAction?.action!=='toggle')return;const a=wecomAccounts.find(a=>a.id===wecomPendingAction.id);if(!a)return;a.status=a.status==='disabled'?'pending':'disabled';$('#wecomDialog').close();renderWecomAccounts();notify((a.status==='disabled'?'已停用企微帐号：':'已启用，等待确认登录状态：')+a.name);const btn=$('#wecomResults').querySelector(`[data-wecom-action="more"][data-id="${a.id}"]`);(btn||$('#wecomResults')).focus()};
document.addEventListener('click',e=>{if(!e.target.closest('#wecomActionMenu,[data-wecom-action="more"]'))closeWecomMenu()});
document.addEventListener('scroll',()=>closeWecomMenu(),true);window.addEventListener('resize',()=>closeWecomMenu());
renderWecomAccounts();
const accountGridObserver=new ResizeObserver(entries=>{
 for(const entry of entries){
  const kind=entry.target.id==='staffAccountGrid'?'staff':'wecom';
  if(entry.target.clientWidth&&accountUsesCards(kind)&&accountPageSize(kind)!==accountPaging[kind].size)refreshAccountPage(kind);
 }
});
accountGridObserver.observe($('#staffAccountGrid'));accountGridObserver.observe($('#wecomResults'));
</script>
