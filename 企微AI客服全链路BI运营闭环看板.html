<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企微AI客服全链路BI运营闭环看板</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #eef3f8;
      --line: #dfe6ee;
      --line-strong: #cbd5e1;
      --text: #172033;
      --muted: #667085;
      --soft: #98a2b3;
      --blue: #2f75ff;
      --blue-soft: #edf4ff;
      --green: #13a06f;
      --green-soft: #e8f7ef;
      --amber: #b97813;
      --amber-soft: #fff5df;
      --red: #d64b4b;
      --red-soft: #fff0f0;
      --cyan: #0f8f9f;
      --cyan-soft: #e7f7f9;
      --violet: #6957b8;
      --violet-soft: #f0edfb;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(47, 117, 255, .95), rgba(19, 160, 111, .95)),
        linear-gradient(45deg, transparent 41%, rgba(255,255,255,.42) 42%, rgba(255,255,255,.42) 56%, transparent 57%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.44);
      flex: 0 0 auto;
    }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 780;
      white-space: nowrap;
    }
    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .data-freshness {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .icon-btn,
    .text-btn {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #344054;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 11px;
      font-size: 12px;
      font-weight: 760;
      transition: background .15s, border-color .15s, color .15s;
    }
    .icon-btn { width: 34px; padding: 0; }
    .icon-btn:hover,
    .text-btn:hover {
      border-color: #b8ccf8;
      background: #f8fbff;
      color: #1f5fd6;
    }
    .icon {
      width: 15px;
      height: 15px;
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
    }
    .icon.refresh::before {
      content: "";
      position: absolute;
      inset: 1px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
    }
    .icon.refresh::after {
      content: "";
      position: absolute;
      right: 0;
      top: 1px;
      border-left: 5px solid currentColor;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transform: rotate(22deg);
    }
    .icon.download::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 1px;
      width: 2px;
      height: 9px;
      background: currentColor;
    }
    .icon.download::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 7px;
      width: 8px;
      height: 8px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-45deg);
    }
    .icon.close::before,
    .icon.close::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 7px;
      width: 12px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }
    .icon.close::before { transform: rotate(45deg); }
    .icon.close::after { transform: rotate(-45deg); }

    .layout {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 0;
    }
    .sidebar {
      position: sticky;
      top: 62px;
      height: calc(100vh - 62px);
      align-self: start;
      overflow: auto;
      padding: 14px;
      background: #fff;
      border-right: 1px solid var(--line);
    }
    .nav-title {
      margin: 4px 8px 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .nav-list {
      display: grid;
      gap: 4px;
    }
    .nav-btn {
      width: 100%;
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #344054;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 760;
    }
    .nav-btn:hover { background: var(--surface-2); }
    .nav-btn.active {
      background: var(--blue-soft);
      border-color: #cfe0ff;
      color: #1f5fd6;
    }
    .nav-index {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--surface-3);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 850;
    }
    .nav-btn.active .nav-index {
      background: #fff;
      color: #1f5fd6;
    }
    .nav-note {
      color: var(--soft);
      font-size: 11px;
      font-weight: 700;
    }
    .source-box {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }
    .source-box h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 850;
    }
    .source-box p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .workspace {
      min-width: 0;
      padding: 16px 18px 26px;
      display: grid;
      gap: 12px;
    }
    .filter-panel,
    .section-panel,
    .detail-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .filter-panel {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 12px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 10px;
    }
    .field {
      display: grid;
      gap: 5px;
    }
    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 820;
    }
    .field select,
    .field input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      padding: 0 10px;
      font-size: 12px;
      outline: none;
    }
    .field select:focus,
    .field input:focus {
      border-color: #99bbff;
      box-shadow: 0 0 0 3px rgba(47,117,255,.09);
    }
    .segmented {
      height: 34px;
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
    }
    .segmented button {
      min-width: 64px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #fff;
      color: #475467;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 780;
    }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active {
      color: #1f5fd6;
      background: var(--blue-soft);
    }

    .page-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 6px 2px 0;
    }
    .page-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 860;
      line-height: 1.2;
    }
    .page-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border: 1px solid #cfe0ff;
      border-radius: 7px;
      background: var(--blue-soft);
      color: #1f5fd6;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 820;
      white-space: nowrap;
    }

    .alert-strip {
      min-height: 44px;
      border: 1px solid #f2d9b0;
      border-radius: 8px;
      background: #fffaf0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: #7a4b07;
      font-size: 13px;
      font-weight: 700;
    }
    .alert-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e59520;
      box-shadow: 0 0 0 4px rgba(229,149,32,.12);
    }
    .alert-strip strong { color: #5f3a05; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }
    .kpi-card {
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 13px 14px;
      display: grid;
      align-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
    }
    .kpi-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
      line-height: 1.35;
    }
    .kpi-value {
      font-size: 25px;
      line-height: 1;
      font-weight: 860;
      color: var(--text);
    }
    .kpi-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .delta {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      border-radius: 6px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 850;
    }
    .delta.good { background: var(--green-soft); color: #087a50; }
    .delta.bad { background: var(--red-soft); color: #bb3434; }
    .delta.watch { background: var(--amber-soft); color: #87580b; }
    .delta.info { background: var(--cyan-soft); color: #087889; }

    .analysis-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr);
      gap: 12px;
    }
    .section-panel {
      min-width: 0;
      padding: 14px;
    }
    .panel-head {
      min-height: 34px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .panel-title {
      margin: 0;
      font-size: 15px;
      font-weight: 860;
      line-height: 1.35;
    }
    .panel-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .small-tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
      flex: 0 0 auto;
    }
    .small-tabs button {
      height: 28px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #fff;
      color: #475467;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 780;
    }
    .small-tabs button:last-child { border-right: 0; }
    .small-tabs button.active {
      color: #1f5fd6;
      background: var(--blue-soft);
    }

    .funnel {
      display: grid;
      gap: 9px;
      padding: 4px 0;
    }
    .funnel-row {
      display: grid;
      grid-template-columns: 126px minmax(160px, 1fr) 86px;
      align-items: center;
      gap: 10px;
    }
    .funnel-label {
      color: #344054;
      font-size: 12px;
      font-weight: 780;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      height: 26px;
      border-radius: 6px;
      background: var(--surface-3);
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      min-width: 4px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--blue), var(--green));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #fff;
      font-size: 11px;
      font-weight: 850;
      padding-right: 8px;
    }
    .funnel-value {
      text-align: right;
      color: var(--text);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .bar-chart {
      display: grid;
      gap: 10px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 120px minmax(140px, 1fr) 56px;
      gap: 10px;
      align-items: center;
    }
    .bar-label {
      color: #344054;
      font-size: 12px;
      font-weight: 780;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-bar {
      height: 22px;
      border-radius: 6px;
      background: var(--surface-3);
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      min-width: 3px;
      border-radius: 6px;
      background: var(--cyan);
    }
    .bar-value {
      text-align: right;
      color: #344054;
      font-size: 12px;
      font-weight: 850;
    }

    .matrix {
      display: grid;
      gap: 8px;
    }
    .matrix-head,
    .matrix-row {
      display: grid;
      grid-template-columns: 1.25fr repeat(4, minmax(70px, .7fr));
      gap: 8px;
      align-items: center;
    }
    .matrix-head {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }
    .matrix-cell {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      color: #344054;
      font-size: 12px;
      font-weight: 820;
      text-align: center;
    }
    .matrix-cell.name {
      justify-content: flex-start;
      text-align: left;
      background: #fff;
    }
    .matrix-cell.good { background: var(--green-soft); border-color: #bfe8d3; color: #087a50; }
    .matrix-cell.bad { background: var(--red-soft); border-color: #f5c1c1; color: #b83232; }
    .matrix-cell.watch { background: var(--amber-soft); border-color: #efd19a; color: #87580b; }

    .scatter {
      height: 246px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(to right, rgba(203,213,225,.52) 1px, transparent 1px) 0 0 / 25% 100%,
        linear-gradient(to top, rgba(203,213,225,.52) 1px, transparent 1px) 0 0 / 100% 25%,
        #fff;
      position: relative;
      overflow: hidden;
    }
    .dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 5px rgba(47,117,255,.12);
      transform: translate(-50%, 50%);
    }
    .dot.bad { background: var(--red); box-shadow: 0 0 0 5px rgba(214,75,75,.12); }
    .dot.good { background: var(--green); box-shadow: 0 0 0 5px rgba(19,160,111,.12); }
    .dot span {
      position: absolute;
      left: 16px;
      top: -3px;
      color: #344054;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .axis-label {
      position: absolute;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      background: rgba(255,255,255,.86);
      border-radius: 4px;
      padding: 2px 5px;
    }
    .axis-x { right: 8px; bottom: 8px; }
    .axis-y { left: 8px; top: 8px; }

    .insight-list {
      display: grid;
      gap: 8px;
    }
    .insight-item {
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: #fff;
      padding: 10px 11px;
      display: grid;
      gap: 5px;
    }
    .insight-item.bad { border-left-color: var(--red); }
    .insight-item.good { border-left-color: var(--green); }
    .insight-item.watch { border-left-color: #e59520; }
    .insight-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #344054;
      font-size: 12px;
      font-weight: 850;
    }
    .insight-copy {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .lower-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .8fr);
      gap: 12px;
    }
    .queue-list {
      display: grid;
      gap: 8px;
    }
    .queue-row {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
    }
    .queue-title {
      color: #344054;
      font-size: 12px;
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .queue-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: #475467;
      padding: 0 7px;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }
    .tag.good { background: var(--green-soft); color: #087a50; border-color: #bee8d2; }
    .tag.bad { background: var(--red-soft); color: #b83232; border-color: #f3c0c0; }
    .tag.watch { background: var(--amber-soft); color: #87580b; border-color: #ebd09c; }
    .tag.info { background: var(--cyan-soft); color: #087889; border-color: #bce7ed; }

    .detail-panel {
      overflow: hidden;
    }
    .detail-toolbar {
      min-height: 54px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }
    .detail-toolbar h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 860;
    }
    .detail-toolbar p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .detail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .table-wrap {
      width: 100%;
      overflow: auto;
      max-height: 420px;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1100px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 10px;
      text-align: left;
      font-size: 12px;
      line-height: 1.45;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fafc;
      color: #475467;
      font-weight: 860;
    }
    td {
      color: #344054;
      background: #fff;
    }
    tbody tr {
      cursor: pointer;
    }
    tbody tr:hover td {
      background: #f8fbff;
    }
    .empty {
      padding: 32px 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .drawer-mask {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(15, 23, 42, .28);
      display: none;
    }
    .drawer-mask.open { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      width: min(720px, 100vw);
      height: 100vh;
      background: #fff;
      border-left: 1px solid var(--line);
      transform: translateX(100%);
      transition: transform .18s ease;
      display: grid;
      grid-template-rows: auto 1fr;
      box-shadow: -20px 0 46px rgba(23, 32, 51, .14);
    }

    function topGroup(rows, field, metric, asc = false) {
      const groups = {};
      rows.forEach(r => {
        const key = r[field] || "未知";
        groups[key] = groups[key] || [];
        groups[key].push(r);
      });
      return Object.entries(groups).map(([name, list]) => ({ name, value: metric(list), count: list.length, list }))
        .sort((a,b) => asc ? a.value - b.value : b.value - a.value);
    }

    function renderKpis(kpis) {
      $("kpiGrid").innerHTML = kpis.map(k => `
        <article class="kpi-card">
          <div class="kpi-label">${k.label}</div>
          <div class="kpi-value">${k.value}</div>
          <div class="kpi-foot"><span>${k.foot}</span><span class="delta ${k.tone || "watch"}">${toneText(k.tone)}</span></div>
        </article>
      `).join("");
    }

    function toneText(tone) {
      return tone === "good" ? "健康" : tone === "bad" ? "预警" : tone === "info" ? "追踪" : "关注";
    }

    function funnelHtml(steps) {
      const max = Math.max(...steps.map(s => s[1]), 1);
      return `<div class="funnel">` + steps.map(([label, value]) => {
        const width = Math.max(4, value / max * 100);
        return `<div class="funnel-row">
          <div class="funnel-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%">${width > 16 ? pct(value, max) : ""}</div></div>
          <div class="funnel-value">${value.toLocaleString("zh-CN")}</div>
        </div>`;
      }).join("") + `</div>`;
    }

    function barHtml(rows, unit) {
      const max = Math.max(...rows.map(r => r.value), 1);
      return `<div class="bar-chart">` + rows.slice(0, 8).map(r => `
        <div class="bar-row">
          <div class="bar-label" title="${r.name}">${r.name}</div>
          <div class="mini-bar"><div class="mini-fill" style="width:${Math.max(3, r.value / max * 100)}%"></div></div>
          <div class="bar-value">${r.label}${unit && !String(r.label).includes("%") ? unit : ""}</div>
        </div>
      `).join("") + `</div>`;
    }

    function scatterHtml(points, xLabel, yLabel) {
      return `<div class="scatter">
        <span class="axis-label axis-y">${yLabel}</span>
        <span class="axis-label axis-x">${xLabel}</span>
        ${points.map(p => `<span class="dot ${p.tone}" style="left:${Math.max(6, Math.min(94, p.x))}%; bottom:${Math.max(8, Math.min(92, p.y))}%"><span>${p.label}</span></span>`).join("")}
      </div>`;
    }

    function matrixHtml(rows, headers = ["对象","开口","支付","删除","动作"]) {
      return `<div class="matrix">
        <div class="matrix-head">${headers.map(h => `<div>${h}</div>`).join("")}</div>
        ${rows.map(r => `<div class="matrix-row">
          <div class="matrix-cell name">${r.name}</div>
          <div class="matrix-cell ${r.openTone || ""}">${r.open}</div>
          <div class="matrix-cell ${r.payTone || ""}">${r.pay}</div>
          <div class="matrix-cell ${r.deleteTone || ""}">${r.del}</div>
          <div class="matrix-cell ${r.actionTone || "watch"}">${r.action}</div>
        </div>`).join("")}
      </div>`;
    }

    function groupRows(rows, field, labelFn, valueFn) {
      const groups = {};
      rows.forEach(r => {
        const key = r[field] || "未记录";
        groups[key] = groups[key] || [];
        groups[key].push(r);
      });
      return Object.entries(groups).map(([name, list]) => ({ name, label: labelFn(list), value: Number(valueFn(list)) || list.length }))
        .sort((a,b) => b.value - a.value);
    }

    function channelMatrix(rows) {
      return topGroup(rows, "channel", list => list.length).map(g => {
        const ids = idsOf(g.list);
        const conv = conversions.filter(r => ids.has(r.id));
        const openRate = conv.filter(r => r.opened).length / Math.max(g.list.length, 1);
        const payRate = conv.filter(r => r.paid).length / Math.max(g.list.length, 1);
        const delRate = conv.filter(r => r.deleted).length / Math.max(g.list.length, 1);
        return {
          name:`${g.name} · ${g.list.length}人`,
          open:pct(conv.filter(r => r.opened).length, g.list.length),
          pay:pct(conv.filter(r => r.paid).length, g.list.length),
          del:pct(conv.filter(r => r.deleted).length, g.list.length),
          action: delRate > .35 ? "降预算" : payRate > .25 ? "加预算" : "改素材",
          openTone: openRate > .65 ? "good" : "watch",
          payTone: payRate > .25 ? "good" : "watch",
          deleteTone: delRate > .3 ? "bad" : "good",
          actionTone: delRate > .35 ? "bad" : payRate > .25 ? "good" : "watch"
        };
      }).slice(0, 6);
    }

    function strategyMatrix(rows) {
      return groupRows(rows, "strategyName", list => "", list => list.length).map(g => {
        const list = rows.filter(r => (r.strategyName || "未记录") === g.name);
        const reply = list.filter(r => r.replied).length / Math.max(list.length,1);
        const finalOpen = list.filter(r => r.finalOpen).length / Math.max(list.length,1);
        const del = list.filter(r => r.deletedAfter).length / Math.max(list.length,1);
        return {
          name:g.name,
          open:pct(list.filter(r => r.replied).length, list.length),
          pay:pct(list.filter(r => r.finalOpen).length, list.length),
          del:pct(list.filter(r => r.deletedAfter).length, list.length),
          action:del > .25 ? "重写节点" : finalOpen > .4 ? "推广" : "调节奏",
          openTone: reply > .5 ? "good" : "watch",
          payTone: finalOpen > .4 ? "good" : "watch",
          deleteTone: del > .25 ? "bad" : "good",
          actionTone: del > .25 ? "bad" : finalOpen > .4 ? "good" : "watch"
        };
      }).slice(0, 7);
    }

    function intentMatrix(rows) {
      const customerMsgs = rows.filter(r => r.sender === "客户");
      return groupRows(customerMsgs, "intent", list => "", list => list.length).map(g => {
        const list = customerMsgs.filter(r => (r.intent || "未记录") === g.name);
        const objections = uniq(list.map(r => r.objection).filter(Boolean)).join("、") || "无";
        const relatedIds = idsOf(list);
        const ai = rows.filter(r => relatedIds.has(r.id) && r.sender === "AI");
        const low = ai.filter(r => num(r.confidence) < .7).length / Math.max(ai.length,1);
        return {
          name:g.name,
          open:String(list.length),
          pay:objections,
          del:pct(ai.filter(r => r.payLink && r.clicked === "是").length, ai.filter(r => r.payLink).length),
          action:low > .3 ? "补知识库" : "沉淀话术",
          openTone:"info",
          payTone: objections === "无" ? "good" : "watch",
          deleteTone: "watch",
          actionTone: low > .3 ? "bad" : "good"
        };
      });
    }

    function roleMatrix(conv) {
      return groupRows(conv.filter(r => r.finalRole), "finalRole", list => "", list => list.length).map(g => {
        const list = conv.filter(r => (r.finalRole || "未记录") === g.name);
        return {
          name:g.name,
          open:String(list.length),
          pay:money(list.reduce((s,r)=>s+num(r.amount),0)),
          del:pct(list.filter(r => r.arrived).length, list.length),
          action:g.name === "AI独立成交" ? "复制场景" : "优化分配",
          openTone:"good",
          payTone:"good",
          deleteTone:list.filter(r => r.arrived).length ? "good" : "watch",
          actionTone:"good"
        };
      });
    }

    function reasonMatrix(conv) {
      return groupRows(conv.filter(r => r.deleted), "deleteReason", list => "", list => list.length).map(g => {
        const list = conv.filter(r => (r.deleteReason || "未记录") === g.name);
        const stages = uniq(list.map(r => r.deleteStage)).join("、");
        return {
          name:g.name,
          open:String(list.length),
          pay:stages,
          del:Math.round(avg(list.map(r => r.sourceQuality))),
          action:g.name.includes("低质") ? "查渠道" : g.name.includes("策略") ? "改SOP" : "查承接",
          openTone:"bad",
          payTone:"watch",
          deleteTone:"bad",
          actionTone:"bad"
        };
      });
    }

    function segmentMatrix(rows) {
      const segments = [
        { name:"高意向已支付", list:rows.filter(r => conversionById(r.id).paid), action:"到店跟进" },
        { name:"已开口未支付", list:rows.filter(r => conversionById(r.id).opened && !conversionById(r.id).paid), action:"顾问跟进" },
        { name:"转人工后未预约", list:rows.filter(r => transferById(r.id).result === "未预约"), action:"主管复盘" },
        { name:"首触即删", list:rows.filter(r => String(conversionById(r.id).deleteReason).includes("首触即删")), action:"查投放" },
        { name:"静默>=7天", list:rows.filter(r => r.silentDays >= 7 && !r.deleted), action:"召回" }
      ];
      return segments.map(s => ({
        name:s.name,
        open:String(s.list.length),
        pay:pct(s.list.filter(r => conversionById(r.id).paid).length, s.list.length),
        del:pct(s.list.filter(r => r.deleted).length, s.list.length),
        action:s.action,
        openTone:s.list.length ? "watch" : "good",
        payTone:"watch",
        deleteTone:s.list.some(r => r.deleted) ? "bad" : "good",
        actionTone:"info"
      }));
    }

    function healthMatrix() {
      const tables = uniq(healthRows.map(r => r.table));

          actionTone:"bad"
        };

    }

        "该节点发出后客户是否回复":r.replied,
        "客户回复时间":r.replyTime,
        "节点发出到客户回复的间隔（秒）":r.replyGap,
        "客户回复情绪倾向":r.sentiment,
        "该节点后客户是否删除":r.deletedAfter,
        "节点发出到客户删除的间隔（秒）":r.deleteGap,
        "是否为最终促成开口的节点":r.finalOpen,
        "A/B测试分组标识":r.abGroup
      };
    }

    function messageDetailRow(r) {
      return {
        __id:r.id,
        "消息唯一ID":r.msgId,
        "会话轮次ID":r.sessionId,
        "客户唯一ID":r.id,
        "发送方":r.sender,
        "发送方具体ID":r.senderId,
        "当前session内消息序号":r.seq,
        "消息发送时间":r.time,
        "消息类型":r.type,
        "消息文字内容":r.content,
        "消息意图分类":r.intent,
        "客户异议类型":r.objection,
        "AI回复时使用的策略/话术ID":r.talkId,
        "AI回复置信度分数":r.confidence,
        "距上一条消息的回复间隔（秒）":r.replyGap,
        "累计对话轮次数":r.turns,
        "是否触发转人工":r.transfer,
        "转人工触发原因":r.transferReason,
        "是否发送了预约金支付链接":r.payLink,
        "支付链接客户是否点击":r.clicked
      };
    }

    function transferDetailRow(r) {
      return {
        __id:r.id,
        "转接记录唯一ID":r.transferId,
        "客户唯一ID":r.id,
        "转接发生时的会话ID":r.sessionId,
        "转人工触发时间":r.transferTime,
        "转接类型":r.transferType,
        "转接前AI已对话轮次数":r.aiTurns,
        "AI转交时的对话摘要/客户画像":r.summary,
        "被分配的人工客服ID":r.agent,
        "人工首次查看该客户时间":r.viewedTime,
        "人工首次回复时间":r.firstReplyTime,
        "转人工到人工首次回复间隔（秒）":r.firstReplyGap,
        "人工平均回复间隔（秒）":r.avgReplyGap,
        "人工总回复条数":r.replyCount,
        "转人工后客户是否继续回复":r.customerContinue,
        "转人工后客户首次回复间隔（秒）":r.customerFirstReplyGap,
        "转人工后客户是否流失":r.lost,
        "转人工到客户删除的间隔":r.deleteGap,
        "转人工后转化结果":r.result
      };
    }

    function conversionDetailRow(r) {
      return {
        __id:r.id,
        "客户唯一ID":r.id,
        "是否开口":r.opened,
        "开口次数":r.openTimes,
        "促成开口的策略ID":r.openStrategyId,
        "促成开口的节点序号":r.openNode,
        "是否缴纳预约金":r.paid,
        "预约金金额":r.amount,
        "支付时间":r.payTime,
        "加微到支付的间隔（小时）":r.addToPayH,
        "开口到支付的间隔（小时）":r.openToPayH,
        "最终促成转化的角色":r.finalRole,
        "促成转化的员工ID":r.convertEmployee,
        "是否到店":r.arrived,
        "到店时间":r.arriveTime,
        "是否删除":r.deleted,
        "删除时间":r.deleteTime,
        "删除发生在哪个阶段":r.deleteStage,
        "删除前最后触达的节点/消息":r.lastTouch,
        "删除前累计对话轮次":r.deleteRounds,
        "删除可能原因归类":r.deleteReason,
        "该客户来源渠道的质量评分":r.sourceQuality,
        "客户最后活跃时间":r.lastActive,
        "静默天数":r.silentDays
      };
    }

    function healthDetailRow(r) {
      return {
        __id:r.id,
        "问题类型":r.issue,
        "所属表":r.table,
        "客户/记录ID":r.id,
        "异常字段":r.field,
        "异常值":r.value,
        "影响指标":r.impact,
        "建议修复动作":r.action
      };
    }

    function openDrawer(id) {
      const c = customerById(id);
      if (!c.id) return;
      const f = firstById(id);
      const v = conversionById(id);
      const t = transferById(id);
      const sops = sopRows.filter(r => r.id === id);
      const msgs = messages.filter(r => r.id === id);
      $("drawerTitle").textContent = `客户360 · ${id}`;
      $("drawerSub").textContent = `${c.channel} / ${c.store} / ${c.project} / ${c.lifecycle}`;
      $("drawerBody").innerHTML = `
        <div class="profile-grid">
          ${profileCell("来源渠道", c.channel)}
          ${profileCell("质量评分", c.quality)}
          ${profileCell("生命周期", c.lifecycle)}
          ${profileCell("静默天数", c.silentDays)}
          ${profileCell("促开口策略", v.openStrategyId)}
          ${profileCell("转人工客服", t.agent)}
          ${profileCell("预约金", v.paid ? money(v.amount) : "未支付")}
          ${profileCell("删除归因", v.deleteReason || "未删除")}
        </div>
        <div class="drawer-section">
          <h4>全链路时间线</h4>
          <div class="timeline">
            ${timelineItem(c.addTime, `加微成功，企微号 ${c.wecomId}，来源 ${c.channel}/${c.plan}`)}
            ${timelineItem(f.welcomeTime, `欢迎语 ${f.welcomeVersion || "-"}，发送间隔 ${fmt(f.welcomeGap)} 秒，链接状态 ${fmt(f.linkStatus)}`)}
            ${timelineItem(f.firstSopTime, `首条SOP ${f.firstSopId || "-"}，客户${f.opened ? "已开口" : "未开口"}`)}
            ${sops.map(r => timelineItem(r.sentTime, `SOP节点${r.node} · ${r.strategyName} · 回复 ${r.replied ? "是" : "否"} · 情绪 ${r.sentiment}`)).join("")}
            ${msgs.map(r => timelineItem(r.time, `${r.sender}：${r.content} ${r.confidence ? "· 置信度 " + r.confidence : ""}`)).join("")}
            ${t.transferTime ? timelineItem(t.transferTime, `转人工给 ${t.agent}，首回 ${fmt(t.firstReplyGap)} 秒，结果 ${t.result}`) : ""}
            ${v.payTime ? timelineItem(v.payTime, `缴纳预约金 ${money(v.amount)}，成交角色 ${v.finalRole}`) : ""}
            ${v.arriveTime ? timelineItem(v.arriveTime, "客户到店") : ""}
            ${v.deleteTime ? timelineItem(v.deleteTime, `客户删除，阶段 ${v.deleteStage}，原因 ${v.deleteReason}`) : ""}
          </div>
        </div>
        <div class="drawer-section">
          <h4>归因卡片</h4>
          <div class="kv-grid">
            ${kv("首触时延", fmt(f.welcomeGap) + " 秒")}
            ${kv("开口节点", fmt(v.openNode))}
            ${kv("AI低置信消息", msgs.filter(r => r.sender === "AI" && num(r.confidence) < .7).length)}
            ${kv("转人工结果", fmt(t.result))}
            ${kv("最后触达", fmt(v.lastTouch))}
            ${kv("最后活跃", fmt(c.lastActive))}
          </div>
        </div>
        <div class="drawer-section">
          <h4>处理建议</h4>
          <div class="insight-copy">${customerAdvice(c, f, v, t)}</div>
        </div>
      `;
      $("drawerMask").classList.add("open");
      $("customerDrawer").classList.add("open");
    }

    function profileCell(label, value) {
      return `<div class="profile-cell"><span>${label}</span><strong>${fmt(value)}</strong></div>`;
    }
    function timelineItem(time, copy) {
      if (!time) return "";
      return `<div class="timeline-item"><div class="timeline-time">${time}</div><div class="timeline-copy">${copy}</div></div>`;
    }
    function kv(label, value) {
      return `<div class="kv"><span>${label}</span><span>${fmt(value)}</span></div>`;
    }

    function customerAdvice(c, f, v, t) {
      if (v.deleted) return `归因优先级：${v.deleteStage || "删除"}。建议先回查 ${c.channel} 素材承诺，再看删除前最后触点“${v.lastTouch || "-"}”。`;
      if (v.paid && !v.arrived) return "已支付未到店，进入门店履约跟进池，补确认时间、路线和到店权益。";
      if (v.opened && !v.paid && t.agent) return `已开口且转人工未成交，建议主管复盘 ${t.agent} 的首回时长和异议处理。`;
      if (c.silentDays >= 7) return "未删除但已静默超过7天，按项目意向进入召回池，避免继续用强促销话术。";
      if (f.opened) return "当前链路健康，可作为同渠道同项目的有效样本沉淀。";
      return "未开口客户，优先检查欢迎语版本、链接状态和首条SOP节点。";
    }

    function closeDrawer() {
      $("drawerMask").classList.remove("open");
      $("customerDrawer").classList.remove("open");
    }

    function exportCsv() {
      const cols = state.detailColumns;
      const rows = state.detailRows;
      if (!rows.length) return;
      const escape = (value) => `"${String(fmt(value)).replace(/"/g, '""')}"`;
      const csv = [cols.map(escape).join(","), ...rows.map(r => cols.map(c => escape(r[c])).join(","))].join("\n");
      const blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${navPages.find(p => p.id === state.page).label}-完整明细.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    initNav();
    initFilters();
    renderPage();
  </script>
</body>
</html>
